// ---- Depth chart ----
// The best XI for a format (ignoring injuries and national duty), each slot labelled by its job,
// the best backup for every slot, who steps in for anyone unavailable, and the reserves.
const SLOT_NAMES = { opener:'Opener', three:'No. 3', middle:'Middle order', keeper:'Keeper', allrounder:'All-rounder', quick:'Quick', spinner:'Spinner' };
function slotFor(p, idx, keeperId) {
  if (p.id === keeperId) return 'keeper';
  const g = group(p);
  if (g === 'BAT' || g === 'WK') return idx < 2 ? 'opener' : idx === 2 ? 'three' : 'middle';
  if (g === 'AR') return idx < 2 ? 'opener' : 'allrounder';
  return isSpin(p) ? 'spinner' : 'quick';
}
function naturalSlot(p) { return p.role === 'OPEN' ? 'opener' : p.role === 'WK' ? 'keeper' : group(p) === 'BAT' ? 'middle' : group(p) === 'AR' ? 'allrounder' : isSpin(p) ? 'spinner' : 'quick'; }
function slotScore(p, slot, fmt) {
  const g = group(p), bat = ['BAT','WK','AR'].includes(g);
  switch (slot) {
    case 'opener': return bat ? batRating(p, fmt) + (p.role === 'OPEN' ? OPENER_PREF : p.role === 'TOP' ? 3 : 0) : -1e9;
    case 'three': case 'middle': return bat ? batRating(p, fmt) : -1e9;
    case 'keeper': return p.sk.keep >= 45 ? keeperScore(p, fmt) : -1e9;
    case 'allrounder': return g === 'AR' ? overall(p, fmt) : canBowl(p) && bat ? (batRating(p, fmt) + bowlRating(p, fmt)) / 2 - 4 : -1e9;
    case 'quick': return canBowl(p) && isPace(p) && g !== 'BAT' && g !== 'WK' ? bowlRating(p, fmt) : -1e9;
    case 'spinner': return canBowl(p) && isSpin(p) && g !== 'BAT' && g !== 'WK' ? bowlRating(p, fmt) : -1e9;
  }
  return -1e9;
}
function depthChart(teamId, fmt) {
  const all = squadOf(teamId).filter(p => !p.retired);
  if (all.length < 11) return null;
  const ideal = autoXI(teamId, fmt, all);
  const inXI = new Set(ideal.order);
  const bench = all.filter(p => !inXI.has(p.id));
  const used = new Set();
  const best = (slot, pool, skip) => pool.filter(p => !skip.has(p.id) && slotScore(p, slot, fmt) > -1e8).sort((a, b) => slotScore(b, slot, fmt) - slotScore(a, slot, fmt))[0] || null;
  const slots = ideal.order.map((id, i) => {
    const p = P(id), slot = slotFor(p, i, ideal.keeper), avail = isAvailable(p);
    const backup = best(slot, bench.filter(isAvailable), new Set());
    let inFor = null;
    if (!avail) { inFor = best(slot, bench.filter(isAvailable), used); if (inFor) used.add(inFor.id); }
    return { i, p, slot, avail, backup, inFor };
  });
  const covers = {};
  slots.forEach(s => { if (s.backup) (covers[s.backup.id] = covers[s.backup.id] || new Set()).add(SLOT_NAMES[s.slot]); });
  const reserves = bench.map(p => ({ p, covers: covers[p.id] ? [...covers[p.id]] : [] }));
  const cnt = f => all.filter(f).length;
  const summary = [
    ['Openers', cnt(p => p.role === 'OPEN'), 3],
    ['Keepers', cnt(p => p.sk.keep >= 45), 2],
    ['Quicks', cnt(p => canBowl(p) && isPace(p) && ['PACE','AR'].includes(group(p)) && bowlRating(p, fmt) >= 50), 5],
    ['Spinners', cnt(p => canBowl(p) && isSpin(p) && ['SPIN','AR'].includes(group(p)) && bowlRating(p, fmt) >= 50), 2],
    ['All-rounders', cnt(p => group(p) === 'AR'), 2]
  ].map(([l, n, need]) => ({ label: l, n, thin: n < need }));
  return { slots, reserves, summary, keeper: ideal.keeper };
}
// Where a player from outside the squad would fit, checked across the three formats.
let _fitCache = null;
function whereFits(p) {
  const key = game.day + '|' + squadOf(U()).map(x => x.id).join(',');
  if (!_fitCache || _fitCache.key !== key) _fitCache = { key, map: {}, charts: {} };   // kept out of the save
  const C = _fitCache;
  if (C.map[p.id] !== undefined) return C.map[p.id];
  let out = null;
  for (const fmt of ['T20', 'OD', 'FC']) {
    const pool = squadOf(U()).filter(x => !x.retired).concat([p]);
    const xi = autoXI(U(), fmt, pool);
    const k = xi.order.indexOf(p.id);
    if (k >= 0) { out = { start: true, text: `Starts No. ${k + 1} · ${COMPS[FMT_COMP[fmt]].short}` }; break; }
  }
  if (!out) for (const fmt of ['T20', 'OD', 'FC']) {
    const ch = C.charts[fmt] || (C.charts[fmt] = depthChart(U(), fmt));
    if (!ch) continue;
    const slot = naturalSlot(p), sc = slotScore(p, slot, fmt);
    const cur = ch.slots.filter(s => s.slot === slot).map(s => s.backup).filter(Boolean)[0];
    if (sc > -1e8 && (!cur || sc > slotScore(cur, slot, fmt))) { out = { start: false, text: `Backup ${SLOT_NAMES[slot].toLowerCase()} · ${COMPS[FMT_COMP[fmt]].short}` }; break; }
  }
  C.map[p.id] = out;
  return out;
}
// §8e CLUB BUSINESS: FINANCES, FACILITIES, INBOX, NEGOTIATION, ACADEMY -------------------
// Money is tracked for the user's club only; AI clubs are assumed solvent.

const FACILITIES = {
  training: { label:'High performance centre', desc:'Faster player development.', eff: l => `+${(l - 1) * 5}% development` },
  medical:  { label:'Medical and recovery',    desc:'Fewer injuries and quicker recovery.', eff: l => `−${(l - 1) * 6}% injury risk` },
  academy:  { label:'Youth academy',           desc:'More and better homegrown graduates each off-season.', eff: l => `${1 + Math.floor(l / 2)} graduate${1 + Math.floor(l / 2) > 1 ? 's' : ''} a year` },
  stadium:  { label:'Stadium and members',     desc:'Bigger crowds and gate takings.', eff: l => `${(12 + (l - 1) * 6)}k capacity` }
};
const TICKET = { low:{ label:'Low prices', demand:1.15, price:0.75, fans:+1 }, standard:{ label:'Standard', demand:1, price:1, fans:0 }, premium:{ label:'Premium', demand:0.85, price:1.35, fans:-1 } };
const FIN = { tv: 1100000, sponsorBase: 700000, upkeep: 60000, prize: { SHIELD:300000, T20C:250000, ODC:150000 }, finalBonus: 50000 };
function blankLedger() { return { gate:0, sponsor:0, tv:0, prize:0, other:0, wages:0, staff:0, upkeep:0, upgrades:0, events:0, months:0 }; }
function initFinances() { return { cash: 1000000, ticket: 'standard', fans: 60, fac: { training:1, medical:1, academy:1, stadium:1 }, ledger: blankLedger(), history: [] }; }
function facLevel(k) { return game.fin ? game.fin.fac[k] : 1; }
function upgradeCost(k) { return facLevel(k) * 400000; }
function income(L) { return L.gate + L.sponsor + L.tv + L.prize + L.other; }
function spend(L) { return L.wages + L.staff + L.upkeep + L.upgrades + L.events; }
function finBook(key, amt) { const f = game.fin; f.ledger[key] += Math.abs(amt); f.cash += (['gate','sponsor','tv','prize','other'].includes(key) ? 1 : -1) * Math.abs(amt); }
function sponsorRate() { return FIN.sponsorBase * (0.6 + game.gm.rep / 100) * (0.7 + game.fin.fans / 150); }
function payMonth() {
  const f = game.fin; if (!f || f.ledger.months >= 6) return;
  f.ledger.months++;
  finBook('tv', FIN.tv / 6);
  finBook('sponsor', sponsorRate() / 6);
  finBook('wages', payroll(U()) / 6);
  finBook('staff', staffPayroll(U()) / 6);
}
function settleSeasonFinances() {
  const f = game.fin; if (!f) return;
  while (f.ledger.months < 6) payMonth();
  finBook('upkeep', Object.values(f.fac).reduce((a, l) => a + l * FIN.upkeep, 0));
  const L = f.ledger;
  f.history.unshift({ year: game.year, income: Math.round(income(L)), spend: Math.round(spend(L)), profit: Math.round(income(L) - spend(L)), cash: Math.round(f.cash), fans: f.fans });
}
// Gate takings for the user's home matches.
function gateTakings(M) {
  const f = game.fin; if (!f || M.home !== U() || COMPS[M.comp].intl) return 0;
  const cap = (12 + (facLevel('stadium') - 1) * 6) * 1000;
  const base = { T20: 0.45, OD: 0.2, FC: 0.08 }[M.fmt];
  const price = { T20: 32, OD: 24, FC: 14 }[M.fmt] * TICKET[f.ticket].price;
  const days = M.fmt === 'FC' ? Math.max(1, Math.ceil(M.balls / (dayOpd(M) * 6))) : 1;
  const opp = 0.9 + (teamStrength(M.away) - 65 - RATING_SHIFT) / 60;
  const rain = M.abandoned ? 0.1 : M.cond && M.cond.days.some(d => d.sky === 'rain') ? 0.7 : 1;
  const big = M.stage !== 'league' ? 1.5 : 1;
  const crowd = Math.round(Math.min(cap, cap * base * TICKET[f.ticket].demand * (0.5 + f.fans / 100) * opp * rain * big) * days);
  const take = Math.round(crowd * price);
  finBook('gate', take);
  M.crowd = crowd;
  return take;
}
function weeklyFans() {

// Limits: board and government asks come once a season at most, and no event type repeats within 60 days.
const EVENT_PER_SEASON = { grant: 1, community: 1, sponsor: 2 };
const EVENT_COOLDOWN = 60;
function eventAllowed(k) {

function resolveEvent(id, idx) {

  if (eff.morale && P(eff.morale.id)) P(eff.morale.id).morale = clamp(P(eff.morale.id).morale + eff.morale.v, 5, 100);
  if (eff.form && P(eff.form.id)) P(eff.form.id).form = clamp(P(eff.form.id).form + eff.form.v, 15, 92);
  if (eff.fitness && P(eff.fitness.id)) P(eff.fitness.id).fitness = clamp(P(eff.fitness.id).fitness + eff.fitness.v, 35, 100);
  if (eff.team) squadOf(U()).forEach(p => p.morale = clamp(p.morale + eff.team, 5, 100));

// ---- Contract negotiation with agents ----
const AGENT_STYLES = { tough:{ label:'Hard-nosed', mult:1.12, patience:2 }, fair:{ label:'Straight shooter', mult:1.0, patience:3 }, friendly:{ label:'Easy to deal with', mult:0.96, patience:4 } };
function agentOf(p) { if (!p.agent) { const nm = genName('AUS'); p.agent = { name: nm[0] + ' ' + nm[1], style: weightedPick(Object.keys(AGENT_STYLES), k => ({ tough:2, fair:3, friendly:1.5 })[k]) }; } return p.agent; }
function prefYears(p) { return p.age <= 25 ? 3 : p.age <= 30 ? 2 : 1; }
function startNegotiation(id, mode) {
  const p = P(id), ag = agentOf(p), per = ensurePersona(p);
  if (p.noTalksUntil && game.day < p.noTalksUntil && game.phase === 'season') return { ok: false, reason: `${p.last}'s camp is not taking calls right now.` };
  if (mode === 'extend' && p.wantsOut) return { ok: false, reason: `${p.last} has asked for a trade and will not discuss a new deal.` };
  const own = p.teamId === U();
  let ask = askingSalary(p) * AGENT_STYLES[ag.style].mult * (per === 'ambitious' ? 1.08 : 1) * (per === 'loyal' && own ? 0.9 : 1) * (own && p.morale < 45 ? 1.12 : 1) * (1 - (game.gm.rep - 40) / 500);
  if (mode === 'resign' && game.offseason) { const e = game.offseason.expiring.find(x => x.id === id); if (e) ask = Math.max(ask, e.ask * 0.95); }
  ask = Math.max(MIN_SALARY, Math.round(ask / 5000) * 5000);
  game.neg = { id, mode, ask, years: prefYears(p), patience: AGENT_STYLES[ag.style].patience, log: [`${ag.name} (${AGENT_STYLES[ag.style].label.toLowerCase()}): "We are looking for ${money(ask)} a season over ${prefYears(p)} year${prefYears(p) > 1 ? 's' : ''}."`], done: false };
  return { ok: true };
}
function negotiationOffer(salary, years) {
  const n = game.neg; if (!n || n.done) return;
  const p = P(n.id), ag = agentOf(p);
  salary = Math.round(salary / 5000) * 5000;
  const yAdj = years === n.years ? 1 : 1 + Math.abs(years - n.years) * 0.05;
  const target = n.ask * yAdj;
  const capRoom = n.mode === 'sign' ? capSpace(U()) : capSpace(U()) + (p.contract ? p.contract.salary : 0);
  n.log.push(`You: ${money(salary)} × ${years} yr${years > 1 ? 's' : ''}.`);
  if (salary > capRoom) { n.log.push('Your list manager: that would take us over the salary cap.'); return; }
  if (salary >= target * 0.98) { n.done = 'agreed'; n.final = { salary, years }; n.log.push(`${ag.name}: "Done. We have a deal."`); return; }
  if (salary >= target * 0.85) {
    n.patience--;
    const give = ag.style === 'tough' ? 0.3 : ag.style === 'fair' ? 0.5 : 0.6;
    n.ask = Math.round((target - (target - salary) * give) / yAdj / 5000) * 5000;
    if (n.patience <= 0) { n.done = 'walked'; n.log.push(`${ag.name}: "We are too far apart. We will look elsewhere."`); }
    else n.log.push(`${ag.name}: "Closer. ${money(n.ask)} and we can sign today."`);
    return;
  }
  n.patience -= 2;
  if (p.teamId === U()) p.morale = clamp(p.morale - 3, 5, 100);
  if (n.patience <= 0) { n.done = 'walked'; n.log.push(`${ag.name}: "That is insulting. We are done here."`); }
  else n.log.push(`${ag.name}: "That is well short. ${money(n.ask)} is the number."`);
}
function closeNegotiation() {
  const n = game.neg; if (!n) return null;
  const p = P(n.id);
  let msg = null;
  if (n.done === 'agreed') {
    const { salary, years } = n.final;
    if (n.mode === 'sign') {
      if (squadOf(U()).length >= SQUAD_MAX) msg = `Squad is full (${SQUAD_MAX}).`;
      else if (p.nat !== 'AUS' && overseasCount(U()) >= OVERSEAS_MAX) msg = `You already have ${OVERSEAS_MAX} overseas players.`;
      else { p.teamId = U(); p.contract = { salary, years }; logTx(`Signed ${pname(p)} (${money(salary)} × ${years}).`); addNews('Signing', `${pname(p)} signs with ${teamName(U())}`, `${ROLES[p.role].label}, ${p.age}. ${money(salary)} a season for ${years} year${years > 1 ? 's' : ''}.`); msg = 'Signed.'; }
    } else if (n.mode === 'extend') { p.contract = { salary, years: p.contract.years + years }; p.morale = clamp(p.morale + 6, 5, 100); logTx(`Extended ${pname(p)} (${money(salary)}).`); msg = 'Extension agreed.'; }
    else if (n.mode === 'resign') { const e = game.offseason.expiring.find(x => x.id === n.id); p.contract = { salary, years }; if (e) e.status = 'signed'; logTx(`Re-signed ${pname(p)} (${money(salary)} × ${years}).`); msg = 'Re-signed.'; }
  } else if (n.done === 'walked') {
    p.noTalksUntil = game.day + 30;
    if (p.teamId === U()) p.morale = clamp(p.morale - 6, 5, 100);
    if (n.mode === 'resign') { const e = game.offseason.expiring.find(x => x.id === n.id); if (e) e.status = 'released'; }
    msg = `${p.last} walked away from talks.`;
  }
  game.neg = null;
  return msg;
}

// §8e RECORDS BOOK + PLAYER MATCH LOG -------------------------------------------------
// Records are kept as small top-10 lists with names stored as text, so they survive
// retirements and season rollovers. Keys are scope_format, e.g. dom_FC or intl_T20.

function recKey(M) { return (COMPS[M.comp].intl ? 'intl_' : 'dom_') + M.fmt; }
function topPush(list, item, better, n) {
  list.push(item); list.sort(better); if (list.length > (n || 10)) list.length = n || 10;
}
function recordMatch(M) {
  if (M.abandoned) return;
  const R = game.records = game.records || { hs:{}, bb:{}, th:{}, tl:{}, pt:{} };
  const k = recKey(M), y = game.year;
  ['hs','bb','th','tl','pt'].forEach(t => R[t][k] = R[t][k] || []);
  const sn = t => teamDef(t) ? (teamDef(t).short || teamDef(t).id) : t;
  M.innings.forEach(inn => {
    const opp = sn(inn.bowl), team = sn(inn.bat);
    topPush(R.th[k], { t: team, opp, r: inn.runs, w: inn.wkts, y }, (a, b) => b.r - a.r);
    if (inn.allOut) topPush(R.tl[k], { t: team, opp, r: inn.runs, y }, (a, b) => a.r - b.r);
    inn.card.forEach(c => { if (c.in && c.r >= 50) topPush(R.hs[k], { id: c.id, n: pname(P(c.id)), t: team, r: c.r, b: c.b, no: !c.out, opp, y }, (a, b) => b.r - a.r || (b.no ? 1 : 0) - (a.no ? 1 : 0)); });
    Object.keys(inn.bw).forEach(id => { const b = inn.bw[id]; if (b.w >= 3) topPush(R.bb[k], { id, n: pname(P(id)), t: sn(inn.bowl), w: b.w, r: b.r, opp: team, y }, (a, b2) => b2.w - a.w || a.r - b2.r); });
    const parts = (inn.parts || []).slice();
    if (inn.part && inn.part.r > 0 && !inn.allOut) parts.push({ r: inn.part.r, w: inn.wkts + 1, a: inn.card[inn.striker].id, o: inn.card[inn.non].id, unb: true });
    parts.forEach(pt => { if (pt.r >= 80) topPush(R.pt[k], { a: pname(P(pt.a)), b: pname(P(pt.o)), t: team, r: pt.r, w: pt.w, unb: !!pt.unb, opp, y }, (a, b) => b.r - a.r); });
  });
}
// Rolling log of each player's last 15 matches: [fmt, runs, wickets, opponent, intl].
function logMatchForPlayers(M) {

    const opp = M.home === t ? M.away : M.home;
    const os = teamDef(opp) ? (teamDef(opp).short || teamDef(opp).id) : opp;
    M.xi[t].forEach(id => {

function matchWear(M, inXI) {
  const fmt = M.fmt;
  const cond = game.training === 'fitness';
  inXI.forEach(id => {
    const p = P(id);
    let overs = 0; M.innings.forEach(inn => { if (inn.bw[id]) overs += inn.bw[id].balls / 6; });
    let load = (fmt === 'FC' ? 6 : fmt === 'OD' ? 3 : 2) * (M.cond && M.cond.days.some(d => d.sky === 'hot') ? 1.25 : 1) * (M.comp === 'TEST' ? 1.2 : 1);
    load += overs * (isPace(p) ? (fmt === 'FC' ? 0.32 : fmt === 'OD' ? 0.8 : 1.5) : (fmt === 'FC' ? 0.12 : 0.4));
    p.fitness = clamp(p.fitness - load * (1.15 - p.sk.stamina / 200), 35, 100);
    let risk = 0.004 + Math.max(0, 78 - p.fitness) * 0.0016 + (isPace(p) ? overs * (fmt === 'FC' ? 0.0005 : 0.0015) : 0);

    risk *= 1.3 - staffEff(p.teamId, 'physio') / 200;
    if (p.teamId === U()) risk *= 1 - (facLevel('medical') - 1) * 0.06;

// How a team's competition actually ended: Champions, Runners-up, Semi-finalist or null (league only).
function isFinalFx(f) { return !!f && ['semi1', 'semi2', 'final'].includes(f.stage); }
function compOutcome(comp, team) {
  const fxs = game.season.fixtures.filter(f => f.comp === comp && isFinalFx(f) && (f.home === team || f.away === team));
  const fin = fxs.find(f => f.stage === 'final');
  if (game.season.champions[comp] === team) return 'Champions';
  if (fin && fin.result) return 'Runners-up';

}
// A readable line for the season review: "Champions · 4th after the league", "Runners-up · 2nd", "4th".
function outcomeLine(comp, team) {

function updateFinals(comp) {

  const lad = sortedLadder(comp).map(r => r.id);

}
function seasonDone() { return game.season.fixtures.every(f => f.result); }

function nextDay() {

  let stop = false;
  const rec = game.training === 'fitness' ? 1.25 : 1;
  const phys = {}; TEAM_DEFS.forEach(t => phys[t.id] = 0.85 + staffEff(t.id, 'physio') / 300);

}

// ---- Fixture clashes (the GM runs a state side and Australia) ----
// A multi-day match occupies the GM from its first day to its last. Any match of his other team
// that falls inside it is run by the staff, unless he has asked to choose (game.clashMode 'ask').
function matchLen(fx) { return COMPS[fx.comp].fmt === 'FC' ? (fx.comp === 'TEST' ? 5 : 4) : 1; }
// Days a finished match actually took. A Test won on day 3 frees the GM from day 4.
function daysPlayed(M) {
  if (!M || M.fmt !== 'FC' || !M.cond) return 1;
  const per = dayOpd(M), last = Math.max(0, (M.balls || 0) - 1);
  let cum = 0;
  for (let d = 0; d < M.cond.days.length; d++) { cum += (per - M.cond.days[d].lost) * 6; if (last < cum) return d + 1; }
  return M.cond.days.length;
}
function setBusy(fx, M) { if (!fx) return; const n = M ? clamp(daysPlayed(M), 1, matchLen(fx)) : matchLen(fx); game.busy = { team: myTeamOf(fx), from: fx.day, until: fx.day + n - 1, fx: fx.id }; }
// "Australia v West Indies (Test, 22 Nov to 26 Nov)"
function fxLabel(f) { const me = myTeamOf(f); return `${teamDef(me).nick} v ${teamDef(me === f.home ? f.away : f.home).nick} (${COMPS[f.comp].short}, ${dateStr(f.day, { weekday: undefined })})`; }
function busyLabel() {
  const b = game.busy, f = b && fixtureById(b.fx); if (!f) return b ? teamDef(b.team).nick : 'another match';
  const me = myTeamOf(f), d = o => dateStr(o, { weekday: undefined });
  return `${teamDef(me).nick} v ${teamDef(me === f.home ? f.away : f.home).nick} (${COMPS[f.comp].short}, ${b.until > b.from ? d(b.from) + ' to ' + d(b.until) : d(b.from)})`;
}
function myTeamOf(fx) { return isUserTeam(fx.home) ? fx.home : fx.away; }
// game.clashMode: 'intl' (default) internationals take priority, 'domestic' the state side does,
// 'ask' the GM chooses on match day. Whichever match he runs, the other is run by the staff.
function clashMode() { const m = game.clashMode; return m === 'domestic' || m === 'ask' ? m : 'intl'; }
// International-first: a state match that overlaps one of Australia's is handed to the staff.
function yieldsToIntl(fx) { return clashMode() === 'intl' && fx && fx.stage !== 'intl' && !isFinalFx(fx) && clashesWith(fx).some(f => f.stage === 'intl'); }
// Finals always ask: a domestic semi-final or final involved in a clash is never handed over silently.
function askClash(fx) { const cl = clashesWith(fx); return cl.length > 0 && (clashMode() === 'ask' || isFinalFx(fx) || cl.some(isFinalFx)); }
function isClash(fx) {

}
// Fixtures of the GM's other team that this match will clash with.
function clashesWith(fx) {
  const me = myTeamOf(fx), end = fx.day + matchLen(fx) - 1;
  return game.season.fixtures.filter(f => !f.result && f.id !== fx.id && f.day >= fx.day && f.day <= end && f.home && (isUserTeam(f.home) || isUserTeam(f.away)) && myTeamOf(f) !== me && (f.stage !== 'intl' || activeWindow()));
}
function staffPlay(fx, why) {
  const M = quickPlay(fx), team = myTeamOf(fx);
  const reason = why || (game.busy ? `You were at ${busyLabel()}.` : '');
  (game.awayLog = game.awayLog || []).push({ fx: fx.id, team, text: M.result.text, potm: M.potm || null, comp: fx.comp, why: reason });
  addNews('Staff', `Staff run ${teamDef(team).nick} v ${teamDef(team === fx.home ? fx.away : fx.home).nick}`, `${M.result.text}. ${reason}`);

}
function intlReason(fx) { const f = clashesWith(fx).find(x => x.stage === 'intl'); return f ? `Internationals take priority. You were needed for ${fxLabel(f)}.` : ''; }
// Main "Continue": sims forward to the next thing that needs the GM.
function continueGame() {
  if (!game) return;
  if (game.live) { go('live'); return; }
  if (game.phase !== 'season') { offseasonContinue(); return; }
  const pend = game.pendingFx && fixtureById(game.pendingFx);
  if (pend && !pend.result && isClash(pend) && !isFinalFx(pend)) { staffPlay(pend); game.pendingFx = null; }
  else if (pend && !pend.result && yieldsToIntl(pend)) { staffPlay(pend, intlReason(pend)); game.pendingFx = null; }
  else if (pend && !pend.result) { go('matchday'); return; }
  game.pendingFx = null;
  const done = page => { autosave(); go(page); showAwaySummary(); };
  for (let i = 0; i < 400; i++) {
    if (game.busy && game.day > game.busy.until) game.busy = null;
    playAIFixturesToday();
    let ufx, g2 = 0;
    while ((ufx = userFixtureToday()) && g2++ < 6) {
      if (isClash(ufx) && !isFinalFx(ufx)) staffPlay(ufx);
      else if (yieldsToIntl(ufx)) staffPlay(ufx, intlReason(ufx));

    }

    if (seasonDone()) { endSeason(); return done('home'); }

}
// "While you were away": results of matches the staff ran during a clash.
function showAwaySummary() {
  const log = game.awayLog || [];
  if (!log.length || typeof sheet !== 'function') return;
  game.awayLog = [];
  const rows = log.map(e => { const f = fixtureById(e.fx), opp = e.team === f.home ? f.away : f.home, won = f.result && f.result.winner === e.team;
    const lad = game.season.standings[e.comp] ? ` · now ${ordinal(ladderPos(e.comp, e.team))} on the ${COMPS[e.comp].short} ladder` : '';
    return `<div class="row tap" onclick="${game.scorecards[e.fx] ? `showScorecard('${e.fx}',0)` : ''}"><div class="stack"><div class="main-t">${chip(f.comp, COMPS[f.comp].short)} ${esc(teamDef(e.team).nick)} v ${esc(teamDef(opp).nick)} · ${dateStr(f.day)}</div><div class="sub-t" style="white-space:normal"><span class="${won ? 'win' : f.result.winner ? 'loss' : ''}">${esc(e.text)}</span>${e.potm ? ` · player of the match ${esc(pname(P(e.potm)))}` : ''}${lad}</div>${e.why ? `<div class="xs dim" style="margin-top:2px">${esc(e.why)}</div>` : ''}</div></div>`; }).join('');

// Sim several days, auto-playing the user's matches.
function simDays(n, untilEnd) {
  if (!game || game.live || game.phase !== 'season') return;
  const start = game.day;
  for (let i = 0; i < 400; i++) {
    playAIFixturesToday();
    let ufx, g2 = 0;
    while ((ufx = userFixtureToday()) && g2++ < 5) quickPlay(ufx);
    for (const w of game.season.windows) if (w.selecting) { w.locked = w.pick; w.selecting = false; }

// §11 NATIONAL DUTY, BOARD, AWARDS ---------------------------------------------
function windowStart(w) {
  ensureIntlSquad(w.opp);
  if (w.wc) { Object.keys(NATION_STRENGTH).forEach(ensureIntlSquad); if (!w.groups) setupWorldCup(w); }
  let ids = (game.nation.gm && w.locked) ? w.locked.filter(id => P(id) && !P(id).retired && P(id).teamId && !P(id).injury) : null;
  if (!ids || ids.length < 11) ids = recommendSquad(w);
  w.selecting = false;
  w.squad = ids;
  const chosen = ids.map(P);
  chosen.forEach(p => p.natDuty = w.id);
  const mine = chosen.filter(p => p.teamId === U());
  if (mine.length) game.gm.rep = clamp(game.gm.rep + mine.length, 0, 100);
  addNews('National', `Australia name ${w.label} squad`, `${w.size} players selected for the series against ${NATIONS[w.opp]}.` + (mine.length ? ` ${mine.map(pname).join(', ')} ${mine.length === 1 ? 'is' : 'are'} called up from your squad and will miss domestic matches until ${dateStr(w.end)}.` : ' None of your players were selected.'));
}
function windowEnd(w) {
  if (w.wc) {
    w.squad.map(P).forEach(p => { if (p) p.natDuty = null; });
    const fin = wcAusFinish(w);
    w.result = { wins: 0, losses: 0, draws: 0, finish: fin };
    game.season.fixtures.filter(f => f.comp === 'WC' && f.result && (f.home === 'AUS' || f.away === 'AUS')).forEach(f => { if (f.result.winner === 'AUS') w.result.wins++; else if (f.result.winner) w.result.losses++; else w.result.draws++; });
    if (game.nation.gm) { const d = { Champions: 20, 'Runners-up': 8, 'Semi-finalists': 0, 'Group stage': -15 }[fin]; game.nation.conf = clamp(game.nation.conf + d, 0, 100); game.nation.history.unshift({ year: game.year, label: 'T20 World Cup', opp: 'IND', wins: w.result.wins, losses: w.result.losses, draws: w.result.draws, finish: fin }); }
    addNews('National', `World Cup: Australia finish as ${fin.toLowerCase()}`, `${w.result.wins} won, ${w.result.losses} lost. Players return to their states.`);
    if (game.nation.gm && game.nation.conf < 20) { game.nation.gm = false; addNews('National', 'Removed as national selector', 'Cricket Australia has replaced you after the World Cup.'); }
    return;
  }
  if (w.fx && w.fx.length) {
    const fxs = w.fx.map(fixtureById).filter(Boolean);
    let wins = 0, losses = 0, draws = 0;
    fxs.forEach(f => { if (!f.result || f.result.noResult) return; if (f.result.winner === 'AUS') wins++; else if (f.result.winner) losses++; else draws++; });
    w.result = { wins, losses, draws };
    w.squad.map(P).forEach(p => { if (p) p.natDuty = null; });
    const res = wins > losses ? 'win' : wins < losses ? 'lose' : 'draw';
    if (game.nation.gm) { game.nation.conf = clamp(game.nation.conf + (res === 'win' ? 10 : res === 'lose' ? -12 : 0), 0, 100); game.nation.history.unshift({ year: game.year, label: w.label, opp: w.opp, wins, losses, draws }); }
    addNews('National', `Australia ${res} the ${w.label.toLowerCase()} against ${NATIONS[w.opp]}`, `${wins} won, ${losses} lost${draws ? ', ' + draws + ' drawn' : ''}. Players return to their states.${game.nation.gm ? ' National board confidence: ' + game.nation.conf + '.' : ''}`);
    if (game.nation.gm && game.nation.conf < 20) { game.nation.gm = false; addNews('National', 'Removed as national selector', 'After a poor run of results Cricket Australia has replaced you as national selector.'); }
    return;
  }
  const sq = w.squad.map(P);
  const aus = mean(sq.map(p => overall(p, w.fmt)).sort((a, b) => b - a).slice(0, 11));
  const opp = NATION_STRENGTH[w.opp] + randn() * 2;
  let wins = 0, losses = 0, draws = 0;
  for (let i = 0; i < w.matches; i++) {
    const pw = 1 / (1 + Math.exp(-(aus - opp) / 4));
    if (w.fmt === 'FC' && rand() < 0.22) draws++;

  }
  w.result = { wins, losses, draws };
  sq.forEach(p => {
    p.natDuty = null;
    if (p.retired) return;
    p.caps[w.fmt] += randInt(Math.ceil(w.matches / 2), w.matches);
    p.fitness = clamp(p.fitness - randInt(4, 10), 50, 100);
    p.form = clamp(p.form + randInt(-8, 10), 15, 92);
  });
  const res = wins > losses ? 'win' : wins < losses ? 'lose' : 'draw';
  addNews('National', `Australia ${res} the series against ${NATIONS[w.opp]}`, `Final tally: ${wins} won, ${losses} lost${draws ? ', ' + draws + ' drawn' : ''}. National players return to their states.`);
}

function teamStrength(teamId) {
  const sq = squadOf(teamId);
  return mean(FMT_LIST.map(f => mean(autoXI(teamId, f, sq).order.map(id => overall(P(id), f)))));
}
function strengthRank(teamId) {
  return TEAM_DEFS.map(t => ({ id: t.id, s: teamStrength(t.id) })).sort((a, b) => b.s - a.s).findIndex(x => x.id === teamId) + 1;
}
function makeObjectives(teamId) {

    { type:'trophy', text:'Win at least one trophy' },
    { type:'ladder', comp:'SHIELD', pos:2, text:'Finish top two in the Shield' },
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' }];
  if (r <= 4) return [
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' },

  return [
    { type:'ladder', comp:'T20C', pos:5, text:'Finish top five in the T20 Championship' },

}
function objectiveStatus(o) {
  if (o.type === 'trophy') return COMP_ORDER.some(c => game.season.champions[c] === U());
  if (o.type === 'ladder') return ladderPos(o.comp, U()) <= o.pos;

}
function evaluateBoard() {
  const b = game.board; const lines = [];
  let delta = 0;
  b.objectives.forEach(o => { const ok = objectiveStatus(o); delta += ok ? 12 : -11; lines.push({ text: o.text, ok }); game.gm.rep = clamp(game.gm.rep + (ok ? 1 : -2), 0, 100); });
  const trophies = COMP_ORDER.filter(c => game.season.champions[c] === U()).length;
  delta += trophies * 8;
  const pay = payroll(U());
  if (pay > SALARY_CAP) { delta -= 10; lines.push({ text: 'Stay under the salary cap', ok: false }); }
  if (game.fin) {
    const L = game.fin.ledger, profit = income(L) - spend(L);
    const ok = profit >= 0;
    delta += ok ? 5 : profit < -500000 ? -12 : -6;
    lines.push({ text: `Run the club at a profit (${profit >= 0 ? '+' : ''}${money(Math.round(profit))})`, ok });
    if (game.fin.cash < 0) { delta -= 15; lines.push({ text: 'Keep the club out of debt', ok: false }); }
  }
  b.confidence = clamp(b.confidence + delta, 0, 100);
  const fired = b.confidence < 20;
  return { lines, delta, trophies, confidence: b.confidence, fired };
}

function seasonImpact(p, fmt) {
  const s = p.stats.season[fmt];
  if (!s.m) return 0;
  if (fmt === 'FC') return s.r + s.w * 22 + s.ct * 3;
  if (fmt === 'OD') return s.r * 1.05 + s.w * 25 + (s.b > 100 ? (srOf(s) - 85) * 1.2 : 0);
  return s.r * 1.15 + s.w * 27 + (s.b > 80 ? (srOf(s) - 135) * 1.0 : 0) - (s.bb > 60 ? (econOf(s) - 8.3) * 12 : 0);
}
function computeAwards() {
  const ps = Object.values(game.players).filter(p => !p.retired && p.teamId);
  const top = (fn, filter) => { const arr = ps.filter(filter || (() => true)).map(p => ({ p, v: fn(p) })).sort((a, b) => b.v - a.v); return arr[0] && arr[0].v > 0 ? { id: arr[0].p.id, name: pname(arr[0].p), team: arr[0].p.teamId, v: Math.round(arr[0].v) } : null; };
  const total = p => seasonImpact(p, 'FC') + seasonImpact(p, 'OD') * 1.4 + seasonImpact(p, 'T20') * 1.5;
  const a = { poy: top(total), young: top(total, p => p.age <= 23), best: {}, runs: {}, wkts: {} };
  FMT_LIST.forEach(f => {
    a.best[f] = top(p => seasonImpact(p, f));
    a.runs[f] = top(p => p.stats.season[f].r);
    a.wkts[f] = top(p => p.stats.season[f].w);
  });
  return a;
}

// International season awards are scored from recorded scorecards only (not cumulative
// career totals or ratings). Background fixtures without scorecards are excluded.
function computeIntlSeasonAwards() {
  const tracked = {};
  let sampled = 0;
  for (const fx of game.season.fixtures) {
    if (!fx.result || !(fx.stage === 'intl' || fx.stage === 'world' || fx.stage === 'wtcfinal' || fx.comp === 'WC' || fx.event)) continue;
    const card = game.scorecards[fx.id];
    if (!card || !Array.isArray(card.innings) || !card.innings.length) continue;
    sampled++;
    const fmt = card.fmt;
    if (!['FC','OD','T20'].includes(fmt)) continue;
    const appearances = new Set();
    for (const inn of card.innings) {
      for (const b of (inn.card || [])) if (b.in && P(b.id)) {
        appearances.add(b.id);
        const r = tracked[b.id] || (tracked[b.id] = { id:b.id, m:0, runs:0, wickets:0, per:{} });
        const f = r.per[fmt] || (r.per[fmt] = {m:0,runs:0,wickets:0});
        r.runs += b.r || 0; f.runs += b.r || 0;
      }
      for (const b of (inn.bw || [])) if (P(b.id) && b.balls) {
        appearances.add(b.id);
        const r = tracked[b.id] || (tracked[b.id] = { id:b.id, m:0, runs:0, wickets:0, per:{} });
        const f = r.per[fmt] || (r.per[fmt] = {m:0,runs:0,wickets:0});
        r.wickets += b.w || 0; f.wickets += b.w || 0;
      }
    }
    for (const id of appearances) { const r = tracked[id]; r.m++; r.per[fmt] = r.per[fmt] || {m:0,runs:0,wickets:0}; r.per[fmt].m++; }
  }
  const rows = Object.values(tracked), eligible = rows.filter(x => x.m >= 2);
  const best = (arr, fn) => arr.length ? arr.slice().sort((a,b) => fn(b) - fn(a))[0] : null;
  const byFmt = f => eligible.filter(x => x.per[f] && x.per[f].m >= 2);
  const impact = x => x.runs + x.wickets * 27;
  const winners = { overall:best(eligible,impact),young:best(eligible.filter(x => P(x.id).age <= 23),impact),bat:best(eligible,x=>x.runs),bowl:best(eligible,x=>x.wickets) };
  for (const f of ['FC','OD','T20']) winners[f] = best(byFmt(f),x=>x.per[f].runs+x.per[f].wickets*27);
  const leaders = {};
  for (const f of ['FC','OD','T20']) {
    const relevant=rows.filter(x=>x.per[f] && x.per[f].m);
    const r=best(relevant,x=>x.per[f].runs), w=best(relevant,x=>x.per[f].wickets);
    leaders[f]={runs:r?{id:r.id,value:r.per[f].runs}:null,wickets:w?{id:w.id,value:w.per[f].wickets}:null};
  }
  return {year:game.year,sampled,winners:Object.fromEntries(Object.entries(winners).map(([k,v])=>[k,v?{id:v.id}:null])),leaders};
}

// §12 TRADES, CONTRACTS, FREE AGENCY ---------------------------------------------
function payroll(teamId) { return squadOf(teamId).reduce((a, p) => a + (p.contract ? p.contract.salary : 0), 0) + (teamId === U() ? game.deadMoney : 0); }
function capSpace(teamId) { return SALARY_CAP - payroll(teamId); }
function overseasCount(teamId) { return squadOf(teamId).filter(p => p.nat !== 'AUS').length; }
function freeAgents() { return Object.values(game.players).filter(p => !p.retired && !p.teamId && !p.prospect && !p.academy); }

function groupNeeds(teamId, removeIds, addIds) {
  removeIds = removeIds || []; addIds = addIds || [];
  const sq = squadOf(teamId).filter(p => !removeIds.includes(p.id)).concat(addIds.map(P));
  const avgO = mean(sq.map(peakOvr));
  const need = {};
  Object.keys(IDEAL_GROUPS).forEach(g => {
    const n = sq.filter(p => group(p) === g && peakOvr(p) >= avgO - 6).length;
    need[g] = clamp((IDEAL_GROUPS[g] - n) / IDEAL_GROUPS[g], 0, 1);
  });
  return need;
}
function tradeCheck(partner, giveIds, getIds) {
  const msgs = [];
  const giveSal = giveIds.reduce((a, id) => a + P(id).contract.salary, 0);
  const getSal = getIds.reduce((a, id) => a + P(id).contract.salary, 0);
  if (payroll(U()) - giveSal + getSal > SALARY_CAP) msgs.push('This would put you over the salary cap.');
  if (payroll(partner) - getSal + giveSal > SALARY_CAP) msgs.push(`${teamName(partner)} cannot fit the incoming salary under their cap.`);
  const uSize = squadOf(U()).length - giveIds.length + getIds.length;
  const pSize = squadOf(partner).length - getIds.length + giveIds.length;
  if (uSize < SQUAD_MIN || uSize > SQUAD_MAX) msgs.push(`Your squad would have ${uSize} players (allowed ${SQUAD_MIN}–${SQUAD_MAX}).`);
  if (pSize < SQUAD_MIN || pSize > SQUAD_MAX) msgs.push(`${teamName(partner)} would have ${pSize} players.`);
  const os = (ids) => ids.filter(id => P(id).nat !== 'AUS').length;
  if (overseasCount(U()) - os(giveIds) + os(getIds) > OVERSEAS_MAX) msgs.push('You would exceed the overseas player limit.');
  if (overseasCount(partner) - os(getIds) + os(giveIds) > OVERSEAS_MAX) msgs.push(`${teamName(partner)} would exceed the overseas limit.`);
  return msgs;
}
// AI judges a trade by value, weighted by what it needs and what it loses.
function evaluateTrade(partner, giveIds, getIds) {
  if (!giveIds.length || !getIds.length) return { accept: false, reason: 'A trade needs at least one player each way.' };
  const msgs = tradeCheck(partner, giveIds, getIds);
  if (msgs.length) return { accept: false, reason: msgs.join(' ') };
  const needNow = groupNeeds(partner);
  const needAfter = groupNeeds(partner, getIds, []);
  const inV = giveIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needNow[group(P(id))]), 0);
  const outV = getIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needAfter[group(P(id))]), 0);
  const ratio = inV / Math.max(0.1, outV);
  if (ratio >= 1.08) return { accept: true, ratio, reason: `${teamName(partner)} accept. They rate the package at ${Math.round(ratio * 100)}% of what they give up.` };
  const short = ratio >= 0.9 ? 'Close, but they want a little more.' : ratio >= 0.7 ? 'They see a clear gap in value.' : 'Not interested at that price.';
  return { accept: false, ratio, reason: `${short} (${Math.round(ratio * 100)}% of the value they need.)` };
}
function tradeWindowOpen() { return game.phase !== 'season' ? game.phase === 'freeagency' : game.day <= CAL.TRADE_DEADLINE; }
function executeTrade(partner, giveIds, getIds) {
  giveIds.forEach(id => { const p = P(id); p.teamId = partner; removeFromUserXI(id); });
  getIds.forEach(id => { P(id).teamId = U(); });
  const txt = `Traded ${giveIds.map(id => pname(P(id))).join(', ')} to ${teamName(partner)} for ${getIds.map(id => pname(P(id))).join(', ')}.`;
  logTx(txt); addNews('Trade', 'Trade completed', txt);
  if (giveIds.includes(game.captain)) game.captain = null;
}
function removeFromUserXI(id) { FMT_LIST.forEach(f => game.userXI[f] = (game.userXI[f] || []).filter(x => x !== id)); }

function maybeAIOffer() {
  if (!tradeWindowOpen() || game.phase !== 'season' || game.offers.length >= 2 || rand() > 0.05) return false;
  const partner = pick(TEAM_DEFS.filter(t => t.id !== U())).id;
  const need = groupNeeds(partner);
  const g = Object.keys(need).sort((a, b) => need[b] - need[a])[0];
  const targets = squadOf(U()).filter(p => group(p) === g && !p.injury && !p.natDuty).sort((a, b) => tradeValue(b) - tradeValue(a));
  if (!targets.length) return false;
  const target = targets[Math.min(targets.length - 1, randInt(0, 2))];
  const want = tradeValue(target) * (1 + 0.45 * need[g]) * 1.05;
  const cands = squadOf(partner).filter(p => group(p) !== g && !p.injury).sort((a, b) => tradeValue(b) - tradeValue(a));
  const pkg = []; let sum = 0;
  for (const c of cands) {
    if (sum >= want * 0.95 || pkg.length >= 2) break;
    const v = tradeValue(c);
    if (sum + v <= want * 1.3) { pkg.push(c.id); sum += v; }
  }
  if (!pkg.length || sum < want * 0.85) return false;
  if (tradeCheck(partner, [target.id], pkg).length) return false;
  game.offers.push({ id: 'o' + game.day + '_' + randInt(100, 999), from: partner, want: [target.id], give: pkg, expires: game.day + 7 });
  addNews('Trade', `${teamName(partner)} make an offer`, `They want ${pname(target)} and are offering ${pkg.map(id => pname(P(id))).join(' and ')}. The offer expires in a week. Review it in the Office.`);
  return true;
}

function signingAsk(p) { return askingSalary(p); }
// Fills the user's squad from free agency. Minimum-salary deals are allowed over the cap
// so a squad can always reach SQUAD_MIN.
function autoFillSquad(target) {
  const signed = [];
  let guard = 0;
  while (squadOf(U()).length < target && guard++ < 30) {
    const need = groupNeeds(U());
    const room = capSpace(U());
    const underMin = squadOf(U()).length < SQUAD_MIN;
    const cand = freeAgents().filter(p => (p.nat === 'AUS' || overseasCount(U()) < OVERSEAS_MAX) && (askingSalary(p) <= room || (underMin && askingSalary(p) <= MIN_SALARY * 1.5)))
      .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
    if (!cand) break;
    const sal = askingSalary(cand.p) <= room ? askingSalary(cand.p) : MIN_SALARY;
    cand.p.teamId = U(); cand.p.contract = { salary: sal, years: 1 };
    signed.push(cand.p);
    logTx(`Signed ${pname(cand.p)} (${money(sal)} × 1 yr) to fill the squad.`);
  }
  if (signed.length) addNews('Signing', `${signed.length} player${signed.length > 1 ? 's' : ''} signed to fill the squad`, signed.map(pname).join(', ') + '.');
  return signed;
}
function contractDecision(p, salary, years) {
  const ask = signingAsk(p);
  if (years < 1 || years > 4) return { ok: false, reason: 'Contracts run 1 to 4 years.' };
  if (p.age >= 33 && years > 2) return { ok: false, reason: `${p.last} wants a shorter deal at this stage of his career.` };
  const repAdj = 1 - (game.gm.rep - 35) / 400;
  const per = ensurePersona(p);
  const own = p.teamId === U();
  const adj = (per === 'ambitious' ? 1.1 : 1) * (per === 'loyal' && own ? 0.9 : 1) * (own && p.morale < 45 ? 1.15 : 1);
  if (own && p.wantsOut) return { ok: false, reason: `${p.last} has asked for a trade and will not discuss a new deal.` };
  if (salary < ask * 0.95 * repAdj * adj) return { ok: false, reason: `${p.last} is asking for around ${money(Math.round(ask * adj / 5000) * 5000)} a season.` };
  return { ok: true };
}
function signFreeAgent(id, salary, years) {
  const p = P(id);
  if (squadOf(U()).length >= SQUAD_MAX) return { ok: false, reason: `Squad is full (${SQUAD_MAX}). Release someone first.` };
  if (salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space.' };
  if (p.nat !== 'AUS' && overseasCount(U()) >= OVERSEAS_MAX) return { ok: false, reason: `You already have ${OVERSEAS_MAX} overseas players.` };
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  p.teamId = U(); p.contract = { salary, years };
  logTx(`Signed ${pname(p)} (${money(salary)} × ${years} yr${years > 1 ? 's' : ''}).`);
  addNews('Signing', `${pname(p)} signs with ${teamName(U())}`, `${ROLES[p.role].label}, ${p.age}. ${money(salary)} a season for ${years} year${years > 1 ? 's' : ''}.`);
  return { ok: true };
}
function releasePlayer(id) {
  const p = P(id);
  if (squadOf(U()).length <= SQUAD_MIN) return { ok: false, reason: `You need at least ${SQUAD_MIN} contracted players.` };
  if (game.phase === 'season') game.deadMoney += Math.round(p.contract.salary * 0.5 / 5000) * 5000;
  p.teamId = null; p.contract = null;
  removeFromUserXI(id);
  if (game.captain === id) game.captain = null;
  logTx(`Released ${pname(p)}.`);
  return { ok: true };
}
function extendPlayer(id, salary, years) {
  const p = P(id);
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  if (salary - p.contract.salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space for the raise.' };
  p.contract = { salary, years: p.contract.years + years };
  logTx(`Extended ${pname(p)} (${money(salary)}, now ${p.contract.years} yrs).`);
  return { ok: true };
}

// AI teams fill squads from free agency using a need-aware score.
function aiFreeAgency() {
  TEAM_DEFS.forEach(t => {
    if (t.id === U()) return;
    let sq = squadOf(t.id);
    while (sq.length > SQUAD_MAX || (payroll(t.id) > SALARY_CAP && sq.length > SQUAD_MIN)) {
      const w = sq.sort((a, b) => tradeValue(a) / a.contract.salary - tradeValue(b) / b.contract.salary)[0];
      w.teamId = null; w.contract = null; sq = squadOf(t.id);
    }
    let guard = 0;
    while (sq.length < 20 && guard++ < 10) {
      const need = groupNeeds(t.id);
      const cand = freeAgents().filter(p => askingSalary(p) <= capSpace(t.id) && (p.nat === 'AUS' || overseasCount(t.id) < OVERSEAS_MAX))
        .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
      if (!cand) break;
      cand.p.teamId = t.id; cand.p.contract = { salary: askingSalary(cand.p), years: randInt(1, 2) };
      sq = squadOf(t.id);
    }
  });
}

// Random squads can come out batting-heavy or bowling-heavy, which skews a whole career's scoring.
// After generation, nudge batting and bowling skills league-wide so the gap between each side's top
// seven batters and top five bowlers sits at the level the engine is calibrated for.
const LEAGUE_BAT_BOWL_GAP = -0.45; // median of freshly generated worlds
function balanceLeague() {
  const gap = mean(FMT_LIST.map(f => mean(TEAM_DEFS.map(t => {
    const xi = autoXI(t.id, f).order.map(P);
    return mean(xi.slice(0, 7).map(p => batRating(p, f))) - mean(xi.filter(canBowl).map(p => bowlRating(p, f)).sort((a, b) => b - a).slice(0, 5));
  }))));
  const d = clamp(gap - LEAGUE_BAT_BOWL_GAP, -6, 6) / 2;
  if (Math.abs(d) < 0.25) return;
  Object.values(game.players).filter(p => TEAM_DEFS.some(t => t.id === p.teamId) || (!p.teamId && !p.prospect)).forEach(p => {
    ['tech','temp','power','rot'].forEach(k => p.sk[k] = clamp(p.sk[k] - d, 15, 99));
    if (canBowl(p) && p.sk.bowl > 35) ['bowl','acc','vari','death'].forEach(k => p.sk[k] = clamp(p.sk[k] + d, 15, 99));
  });
}
function developPlayer(p) {
  const cur = peakOvr(p), head = p.pot - cur;
  let g;
  if (p.age <= 20) g = 2 + rand() * 4;
  else if (p.age <= 23) g = 1 + rand() * 3.5;
  else if (p.age <= 26) g = rand() * 2.5 - 0.3;
  else if (p.age <= 29) g = rand() * 1.6 - 0.8;
  else if (p.age <= 31) g = -0.8 - rand() * 1.6;
  else if (p.age <= 33) g = -1.5 - rand() * 2;
  else g = -2.5 - rand() * 2.5;
  const s = p.stats.season, played = s.FC.m + s.OD.m + s.T20.m;
  if (g > 0 && played >= 12) g += 0.6;
  if (p.age <= 22 && rand() < 0.06) g += 4;
  if (g > 0) g = head <= 0 ? 0 : Math.min(g, Math.max(0.3, head * 0.5));
  if (g > 0 && p.teamId === U()) g *= 1 + (facLevel('training') - 1) * 0.05;
  let batM = 1, bowlM = 1;
  if (p.teamId && teamDef(p.teamId) && !teamDef(p.teamId).intl) {
    const hm = 0.9 + staffEff(p.teamId, 'head') / 500;
    batM = hm * (0.85 + staffEff(p.teamId, 'bat') / 300);
    bowlM = hm * (0.85 + staffEff(p.teamId, 'bowl') / 300);
  }
  if (p.teamId === U()) {
    if (game.training === 'batting') { batM *= 1.35; bowlM *= 0.7; }
    else if (game.training === 'bowling') { batM *= 0.7; bowlM *= 1.35; }
    else if (game.training === 'fitness') { batM *= 0.85; bowlM *= 0.85; p.sk.stamina = clamp(p.sk.stamina + 2, 15, 99); }
  }
  const grp = group(p);
  const focus = DEV_FOCUS[p.focus || 'none'].skills;
  const prof = ensurePersona(p) === 'professional' && g > 0 ? 1.1 : 1;
  const bs = staffSpec(p.teamId, 'bat'), ws = staffSpec(p.teamId, 'bowl');
  const specK = k => g <= 0 ? 1 : ((bs === 'technique' && (k === 'tech' || k === 'temp')) || (bs === 'power' && k === 'power') ? 1.1 : 1) * (['bowl','acc','vari','death'].includes(k) && ws ? (ws === (isSpin(p) ? 'spin' : 'pace') ? 1.12 : 0.92) : 1);
  const bump = (k, m) => { const fm = g > 0 ? (focus.length ? (focus.includes(k) ? 1.6 : 0.85) : 1) : 1; p.sk[k] = clamp(Math.round(p.sk[k] + g * m * fm * prof * specK(k) * (0.7 + rand() * 0.6)), 15, 99); };
  if (g > 0 && focus.length) focus.forEach(k => { if (k === 'keep' && grp !== 'WK') bump('keep', 0.8); if (k === 'stamina') bump('stamina', 0.8); if (['bowl','acc','vari'].includes(k) && grp === 'BAT') bump(k, 0.7); });
  const bat = ['tech','temp','power','rot'], bowl = ['bowl','acc','vari','death'];
  if (grp === 'BAT' || grp === 'WK') bat.forEach(k => bump(k, g > 0 ? batM : 1));
  if (grp === 'WK') bump('keep', 1);
  if (grp === 'AR') { bat.forEach(k => bump(k, g > 0 ? batM : 1)); if (canBowl(p)) bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); }
  if (grp === 'PACE' || grp === 'SPIN') { bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); if (isPace(p) && p.age >= 31) p.sk.bowl = clamp(p.sk.bowl - 1, 15, 99); }
  bump('field', 0.6);
  if (g < 0) p.sk.stamina = clamp(p.sk.stamina - randInt(0, 2), 15, 99);
  if (p.age >= 27) p.pot = Math.max(peakOvr(p), p.pot - 1);
  p.pot = Math.max(p.pot, peakOvr(p));
  return peakOvr(p) - cur;
}
function retires(p) {
  const o = peakOvr(p);
  let ch = 0;
  if (p.age >= 33) ch = 0.12 + (p.age - 33) * 0.16;
  if (p.age >= 31 && o < 62 + RATING_SHIFT) ch += 0.25;
  if (!p.teamId && p.age >= 30) ch += 0.3;
  if (p.age >= 38) ch = 1;
  return rand() < ch;
}
function runDevelopment() {
  const rep = { up: [], down: [], retired: [] };
  Object.values(game.players).forEach(p => {
    if (p.retired || p.prospect) return;
    p.age++;
    const d = developPlayer(p);
    if (p.teamId === U()) { if (d >= 2) rep.up.push([p.id, d]); else if (d <= -2) rep.down.push([p.id, d]); }
    p.form = Math.round(50 + (p.form - 50) * 0.3); p.fitness = 100; p.injury = null; p.natDuty = null;
    if (retires(p)) {
      const wasMine = p.teamId === U();
      rep.retired.push({ id: p.id, team: p.teamId, mine: wasMine });
      p.retired = true; p.teamId = null; p.contract = null; removeFromUserXI(p.id);
      if (game.captain === p.id) game.captain = null;
    }
  });
  rep.up.sort((a, b) => b[1] - a[1]); rep.down.sort((a, b) => a[1] - b[1]);
  game.offseason.dev = rep;
  const mine = rep.retired.filter(r => r.mine).map(r => pname(P(r.id)));
  addNews('League', `${rep.retired.length} players retire`, mine.length ? `From your squad: ${mine.join(', ')}.` : 'None from your squad.');
}
function processContracts() {
  const expiring = [];
  Object.values(game.players).forEach(p => {
    if (p.retired || !p.teamId || !p.contract) return;
    p.contract.years--;
    if (p.contract.years > 0) return;
    if (p.teamId === U()) { const per = ensurePersona(p); expiring.push({ id: p.id, ask: Math.round(askingSalary(p) * (p.morale < 50 ? 1.15 : 1) * (per === 'loyal' ? 0.9 : per === 'ambitious' ? 1.1 : 1) / 5000) * 5000, years: p.age >= 32 ? 1 : 2, status: p.wantsOut ? 'released' : 'pending' }); return; }
    const ask = askingSalary(p);
    const keep = playerValueScore(p) > 0.12 && p.age <= 33 && rand() < 0.8 && payroll(p.teamId) - p.contract.salary + ask <= SALARY_CAP;
    if (keep) p.contract = { salary: ask, years: randInt(1, 3) };
    else { p.teamId = null; p.contract = null; }
  });
  game.offseason.expiring = expiring;
  game.deadMoney = 0;
}
function resignExpiring(id) {
  const e = game.offseason.expiring.find(x => x.id === id);
  if (!e) return;
  const p = P(id);
  const others = payroll(U()) - p.contract.salary;

  p.contract = { salary: e.ask, years: e.years }; e.status = 'signed';

}
function letGoExpiring(id) { const e = game.offseason.expiring.find(x => x.id === id); if (e) e.status = 'released'; }
function finaliseExpiring() {
  game.offseason.expiring.forEach(e => {

    logTx(`${pname(p)} left as a free agent.`);
  });
}

function setupDraft() {
  game.offseason.academy = academyIntake();

  const score = id => COMP_ORDER.reduce((a, c) => a + ladderPos(c, id) + (game.season.champions[c] === id ? -2 : 0), 0);
  const order = TEAM_DEFS.map(t => t.id).sort((a, b) => score(b) - score(a));

  addNews('Draft', 'Rookie draft order set', `${teamName(order[0])} hold the first pick. Two rounds, twelve picks.`);
}
function draftPool() { return Object.values(game.players).filter(p => p.prospect && !p.teamId && !p.retired); }
function draftOnClock() { const d = game.offseason.draft; return d && d.pick < d.order.length ? d.order[d.pick] : null; }
function makeDraftPick(teamId, id) {
  const d = game.offseason.draft;
  if (id) {
    const p = P(id);
    p.teamId = teamId; p.prospect = false; p.contract = { salary: ROOKIE_SALARY, years: 2 };
    d.picks.push({ n: d.pick + 1, team: teamId, id });
    if (teamId === U()) { logTx(`Drafted ${pname(p)} with pick ${d.pick + 1}.`); addNews('Draft', `${pname(p)} drafted`, `${ROLES[p.role].label}, ${p.age}. Scouts rate his potential ${potGrade(p)}.`); }
  } else d.picks.push({ n: d.pick + 1, team: teamId, id: null });

}
function aiDraftChoice(teamId) {
  if (squadOf(teamId).length >= SQUAD_MAX || capSpace(teamId) < ROOKIE_SALARY) return null;
  const need = groupNeeds(teamId);
  const c = draftPool().map(p => ({ p, s: p.pot * 0.65 + peakOvr(p) * 0.35 + need[group(p)] * 8 + rand() * 3 })).sort((a, b) => b.s - a.s)[0];
  return c ? c.p.id : null;
}
function runDraftUntilUser(autoUser) {
  const d = game.offseason.draft;
  while (d.pick < d.order.length) {
    const t = d.order[d.pick];
    if (t === U() && !autoUser) return false;
    makeDraftPick(t, aiDraftChoice(t));
  }
  // Leftover prospects: the best few become free agents, the rest go back to club cricket.
  (game.offseason.academy || []).forEach(id => { const p = P(id); if (p && !p.teamId) delete game.players[id]; });
  game.offseason.academy = [];
  draftPool().sort((a, b) => b.pot - a.pot).forEach((p, i) => {
    if (i < 4) p.prospect = false; else delete game.players[p.id];
  });
  return true;
}

function startNewSeason() {
  Object.values(game.players).forEach(p => { p.stats.season = blankStats3(); p.natDuty = null; });
  game.year++;
  game.season = buildSeason(game.year);
  rolloverWtc(game.year);
  game.day = 0; game.scorecards = {}; game.pendingFx = null; game.offers = []; game.live = null;

// Saves go to IndexedDB (large, durable) with a localStorage mirror. If the browser
// keeps neither (private mode, some file previews), the game says so and the player
// can export the career to a file and import it later.
const Store = {
  db: null, idbOk: false, lsOk: false, status: 'unknown', lastSaved: null, lastError: null,
  async init() {
    try { localStorage.setItem('__mmc_test', '1'); this.lsOk = localStorage.getItem('__mmc_test') === '1'; localStorage.removeItem('__mmc_test'); } catch (e) { this.lsOk = false; }
    try {
      this.db = await new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('minime_cricket', 1);
        r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('saves')) db.createObjectStore('saves'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('idb timeout')), 3000);
      });
      this.idbOk = true;
    } catch (e) { this.idbOk = false; }
    this.status = this.idbOk || this.lsOk ? 'ok' : 'none';
    if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
    return this.status;
  },
  _tx(mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction('saves', mode); const st = tx.objectStore('saves'); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  async put(slot, str, meta) {
    let ok = false;
    if (this.idbOk) { try { await this._tx('readwrite', st => { st.put(str, 'slot' + slot); st.put(meta, 'meta' + slot); }); ok = true; } catch (e) { this.lastError = String(e); } }
    if (this.lsOk) {
      try { localStorage.setItem(SAVE_PREFIX + 'meta' + slot, JSON.stringify(meta)); } catch (e) {}
      try { localStorage.setItem(SAVE_PREFIX + slot, str); ok = true; } catch (e) { if (!ok) this.lastError = 'Browser storage is full.'; try { localStorage.removeItem(SAVE_PREFIX + slot); } catch (e2) {} }
    }
    if (ok) this.lastSaved = new Date();
    return ok;
  },
  async get(slot) {
    if (this.idbOk) { try { const v = await this._tx('readonly', st => st.get('slot' + slot)); if (v) return v; } catch (e) {} }
    if (this.lsOk) { try { return localStorage.getItem(SAVE_PREFIX + slot); } catch (e) {} }
    return null;
  },
  async meta(slot) {
    if (this.idbOk) { try { const v = await this._tx('readonly', st => st.get('meta' + slot)); if (v) return v; } catch (e) {} }
    if (this.lsOk) {
      try { const m = localStorage.getItem(SAVE_PREFIX + 'meta' + slot); if (m) return JSON.parse(m); } catch (e) {}
      try { const raw = localStorage.getItem(SAVE_PREFIX + slot); if (raw) return metaOf(JSON.parse(raw)); } catch (e) {}
    }
    return null;
  },
  async del(slot) {
    if (this.idbOk) { try { await this._tx('readwrite', st => { st.delete('slot' + slot); st.delete('meta' + slot); }); } catch (e) {} }
    if (this.lsOk) { try { localStorage.removeItem(SAVE_PREFIX + slot); localStorage.removeItem(SAVE_PREFIX + 'meta' + slot); } catch (e) {} }
  },
  async list() { const out = []; for (let i = 1; i <= SAVE_SLOTS; i++) out.push(await this.meta(i)); return out; }
};
function metaOf(g) { return { name: g.gm.name, team: g.gm.teamId, label: g.season.label, phase: g.phase, day: g.day, year: g.year, wins: g.gm.wins, losses: g.gm.losses, build: g.meta.build, saved: g.meta.saved || null, edited: !!g.edited }; }

function saveGame(slot, notify) {

  const str = serialiseGame(), meta = metaOf(game);
  _saving = _saving.then(() => Store.put(slot, str, meta)).then(ok => {
    if (notify) flash(ok ? `Saved to slot ${slot}.` : 'Save failed: this browser is not keeping data. Use Export save.');

  window._pickedTeam = 'NSW'; window._nationGm = false;
  sheet('New career', 'Create your GM', `
    <div class="grid g2"><div><label class="lbl">GM name</label><input class="input" id="gmName" value="FitzO" maxlength="24"></div><div><label class="lbl">Save slot</label><select id="slotSel" class="full">${slots.map(([v, l]) => `<option value="${v}" ${v === empty ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>

function startCareer() {
  const name = ($('gmName').value || '').trim() || 'FitzO', slot = +$('slotSel').value || 1;

function showHelp() {
  sheet('Guide', 'How to play', `<div class="help">
    <h4>The loop</h4><p>Continue moves the calendar on and stops whenever you are needed: a match, a trade offer, a national call-up. On match day, play live ball by ball or quick-sim.</p>
    <h4>Competitions</h4><p>The Sheffield Shield is four-day cricket with draws, follow-ons and declarations. The One-Day Cup is 50 overs. The T20 Championship runs through summer with semi-finals and a final. Shield and One-Day finals go to the top two; a drawn Shield final goes to the home side.</p>
    <h4>Selection and workloads</h4><p>Each format has its own XI, picked by staff on Auto or by you on Manual. Fitness falls with every match and fastest for quicks. Tired bowlers lose effectiveness and break down more often, so rotate during the T20 block.</p>
    <h4>You are the GM</h4><p>Build your squad and hire the staff. The coach manages match tactics. You can encourage the team at key breaks.</p>
    <h4>Staff</h4><p>Hire a head coach, batting and bowling coaches, a performance analyst, a physio and a talent scout from a separate staff budget. Coaches speed development, the analyst builds the bowling plan for each opposition batter, the physio cuts injuries, and the scout sharpens potential grades.</p>
    <h4>Scouting</h4><p>Every batter has strengths and weaknesses. Commission scouting on match day so your analyst can target them. Your analyst also learns about batters your bowlers bowl at. AI sides do the same to you.</p>
    <h4>Australia</h4><p>Take on the national selector role to pick every Australia squad. Tests and white-ball matches are played out in full. Picking your own state's players weakens your state while they are away.</p>
    <h4>The locker</h4><p>Every player has a personality and a mood. Mood moves with playing time, results, pay and how well your head coach manages people. The coach settles unsettled players each week. You step in when a player asks for a trade, is Unhappy, was let down on a promise or wants a better contract: talk to him to reassure him, promise him games or challenge him. Unhappy players lose form, refuse new contracts and eventually ask for a trade.</p>
    <h4>Development</h4><p>Put players on individual programmes (technique, power, bowling, control, variations, keeping, fitness, or learning to bowl). Your head coach decides how many programmes you can run. Programmes add monthly progress during the season and faster growth in the off-season.</p>
    <h4>World cricket</h4><p>International tours run throughout the season, with rankings and series results tracked.</p>
    <h4>Club business</h4><p>The Club tab in the Office shows your bank balance, gate takings, sponsorship and wages. Set ticket prices and upgrade the training centre, medical centre, youth academy and stadium. The board now judges profit and debt as well as results. Decisions also arrive in your inbox: sponsors, media, discipline and rival clubs circling your players.</p>
    <h4>Contract talks</h4><p>Every player has an agent. Make an offer, hear a counter, and settle or walk away. Hard-nosed agents give little ground; lowball offers burn their patience.</p>
    <h4>Records and profiles</h4><p>The League tab holds the records book (highest scores, best bowling, team totals, partnerships and career leaders). Tap a team on any ladder for its profile.</p>
    <h4>Editor</h4><p>Turn on Editor mode in the menu to edit any player or team, or create players. Edited careers are marked as edited.</p>
    <h4>Saving</h4><p>The game saves to your browser automatically. Private browsing and some file previews do not keep data; if the menu says saves are not being kept, export a save file and import it next time.</p>
    <h4>Weather and pitches</h4><p>Each match gets a pitch and a forecast. Overcast days help swing, hot days tire players, and rain costs overs or washes matches out.</p>
    <h4>Front office</h4><p>${money(SALARY_CAP)} salary cap, ${SQUAD_MIN}–${SQUAD_MAX} players, up to ${OVERSEAS_MAX} overseas. Trade until the deadline, sign free agents, extend and release (half the salary stays on your cap this season). AI states value quality, age, contract and what they are short of.</p>
    <h4>The board and the off-season</h4><p>Meet objectives to keep the board happy; fall below 20 and you are sacked. After the season come awards, development and retirements, renewals, a rookie draft and free agency.</p></div>`);
}

// §17 HOME -------------------------------------------------------------------------
function nextUserFx() { return game.season.fixtures.find(f => !f.result && f.home && (isUserTeam(f.home) || isUserTeam(f.away))); }
function recentForm(n, team = U()) {
  return game.season.fixtures.filter(f => f.result && (f.home === team || f.away === team)).sort((a,b) => a.day-b.day).slice(-n).map(f => {
    const r = f.result.winner === team ? 'W' : f.result.winner ? 'L' : f.result.noResult ? 'N' : f.result.tie ? 'T' : 'D';
    return `<span class="res ${r}" title="${esc(f.result.text)}">${r}</span>`;
  }).join('');
}
// Dashboard notifications are UI-only: dismissing one never resolves the underlying
// trade, injury, selection or board issue. Notices are scoped to save and season.
function homeNotices() {
  const sq = squadOf(U());
  const notices = [];
  const add = (id, title, description, action, destination, count) => notices.push({
    id: `${id}:${count == null ? '' : count}`, title, description, action, destination
  });
  const inj = sq.filter(p => p.injury), duty = sq.filter(p => p.natDuty);
  const tired = sq.filter(p => !p.injury && !p.natDuty && p.fitness < 75);
  if (game.offers.length) add('offers', `${game.offers.length} trade offer${game.offers.length===1?'':'s'}`, 'Review incoming offers before deciding.', true, 'offers', game.offers.length);
  if (openInbox().length) add('inbox', `${openInbox().length} inbox decision${openInbox().length===1?'':'s'}`, 'Open your inbox to review outstanding decisions.', true, 'inbox', openInbox().length);
  if (sq.some(p=>p.wantsOut)) add('requests', 'Player trade request', 'Review player concerns in the dressing room.', true, 'requests', sq.filter(p=>p.wantsOut).length);
  if (game.nation.gm && game.season.windows.some(w=>w.selecting)) add('national', 'Australia squad selection', 'Select the national squad for the upcoming window.', true, 'national');
  const myFinal = game.season.fixtures.find(f => isFinalFx(f) && !f.result && (f.home===U() || f.away===U()));
  if (myFinal) add('final', `${COMPS[myFinal.comp].short} final coming up`, `v ${teamDef(myFinal.home===U()?myFinal.away:myFinal.home).nick} · ${dateStr(myFinal.day)}`, true, `final:${myFinal.comp}`, myFinal.id);
  const vacant = STAFF_ORDER.filter(r=>!staffIn(U(),r));
  if (vacant.length) add('staff', `${vacant.length} staff vacanc${vacant.length===1?'y':'ies'}`, 'Review club staffing.', true, 'staff', vacant.length);
  if (sq.length < SQUAD_MIN) add('short', `Squad short: ${sq.length}/${SQUAD_MIN}`, 'Review free agents and squad depth.', true, 'short', sq.length);
  if (inj.length) add('injuries', `${inj.length} player${inj.length===1?'':'s'} injured`, 'View injury status and recovery dates.', false, 'injuries', inj.map(p=>`${p.id}:${p.injury.until}`).sort().join(','));
  if (duty.length) add('duty', `${duty.length} with Australia`, 'These players are unavailable during international duty.', false, 'duty', duty.map(p=>p.id).sort().join(','));
  if (tired.length) add('fitness', `${tired.length} below 75% fitness`, 'Consider resting players before their next match.', false, 'fitness', tired.map(p=>p.id).sort().join(','));
  return notices;
}
function noticeStoreKey() {
  return `legacy_cricket_notices_${game.meta.slot || 1}_${game.season.label}_${U()}`;
}
function noticeRead() {
  try { const list=JSON.parse(localStorage.getItem(noticeStoreKey()) || '[]'); return Array.isArray(list)?list:[]; }
  catch (_) { return []; }
}
const dismissedNoticesThisSession = new Set();
function noticeDismissed(n) { return dismissedNoticesThisSession.has(noticeStoreKey() + ':' + n.id) || noticeRead().includes(n.id); }
function noticeMark(id) {
  dismissedNoticesThisSession.add(noticeStoreKey() + ':' + id);
  try { const list = noticeRead(); if (!list.includes(id)) { list.push(id); localStorage.setItem(noticeStoreKey(),JSON.stringify(list.slice(-100))); } } catch (_) {}
}
function noticeAct(index) {
  const n = homeNotices()[index]; if (!n) return;
  noticeMark(n.id); closeModal();
  switch(n.destination) {
    case 'offers': ui.officeTab='trades';go('office');break;
    case 'inbox': ui.officeTab='inbox';go('office');break;
    case 'requests': ui.squadTab='room';go('squad');break;
    case 'national': go('natsel');break;
    case 'staff': ui.clubTab='staff';go('club');break;
    case 'short': ui.officeTab='fa';go('office');break;
    case 'injuries':playerListSheet('Injuries','injured');break;
    case 'duty':playerListSheet('National duty','duty');break;
    case 'fitness':playerListSheet('Fitness watch','tired');break;
    default: if(n.destination.startsWith('final:')){ui.leagueTab='ladders';ui.ladComp=n.destination.split(':')[1];go('league');}
  }
}
function noticeDismiss(index) {
  const n=homeNotices()[index]; if(!n)return;
  noticeMark(n.id);
  // Close the modal before refreshing its contents; reopening from render can otherwise look like a failed dismissal.
  closeModal(); render();
  const remaining=homeNotices().filter(a=>!noticeDismissed(a));
  if(remaining.length) attentionSheet();
}
function attentionSheet() {
  const all=homeNotices();
  const pending=all.map((n,i)=>({...n,i})).filter(n=>!noticeDismissed(n));
  const body=pending.length ? pending.map(n=>`<div class="attention-item"><div class="attention-item-head"><span class="attention-status ${n.action?'required':''}">${n.action?'ACTION':'INFO'}</span><strong>${esc(n.title)}</strong></div><div class="attention-detail">${esc(n.description)}</div><div class="attention-buttons"><button class="btn ${n.action?'pri':'ghost'}" onclick="noticeAct(${n.i})">${n.action?'Review':'View details'}</button><button class="btn ghost" onclick="noticeDismiss(${n.i})">Dismiss</button></div></div>`).join('') : '<div class="empty">You’re all caught up.</div>';
  sheet('Club updates', pending.length ? `${pending.length} update${pending.length===1?'':'s'}` : 'All caught up', body, {flush:true, foot: pending.length?'<button class="btn ghost block" onclick="closeModal()">Close</button>':''});
}

 const n = game.nation || {};
 const rankings = n.rankings || {};
 const rank = Object.keys(rankings).sort((a,b)=>rankings[b]-rankings[a]).indexOf('AUS')+1;
 return `<div class="kpis nation-home-kpis"><div class="kpi"><div class="v">${rank ? ordinal(rank) : '–'}</div><div class="l">World rank</div></div><div class="kpi"><div class="v">${n.conf ?? '–'}</div><div class="l">National board</div></div><div class="kpi"><div class="v">Australia</div><div class="l">Nation</div></div></div>`;
}
function worldHomeRankings() {
 const ranks = (game.nation || {}).rankings || {};
 return Object.keys(ranks).sort((a,b)=>ranks[b]-ranks[a]).slice(0,8).map((n,i)=>`<div class="kv"><span>${i+1}. ${nationTag(n)} ${esc(NATIONS[n]||n)}</span><b>${Math.round(ranks[n])}</b></div>`).join('') || '<div class="empty">Rankings not yet available.</div>';
}
function renderHome() {
  if (game.phase !== 'season') return renderOffseason();
  const me = teamDef(U()), fx = nextUserFx(), sq = squadOf(U());
  const homeNation = ui.homeMode === 'nation' || (ui.homeMode !== 'club' && fx && (fx.home === 'AUS' || fx.away === 'AUS'));
  let hero, acts = '';
  if (game.live) {
    hero = `<div class="hero"><div class="mid"><div class="comp">Match in progress</div><div class="vs">${teamName(game.live.home)} v ${teamName(game.live.away)}</div></div></div>`;
    acts = `<button class="btn pri block home-acts" onclick="go('live')">Return to the match</button>`;
  } else if (fx) {
    const mine = isUserTeam(fx.home) ? fx.home : fx.away, opp = mine === fx.home ? fx.away : fx.home, days = fx.day - game.day;
    hero = `<div class="hero">${badge(mine, true)}<div class="mid"><div class="comp">${chip(fx.comp, COMPS[fx.comp].short)} ${fx.stage === 'league' ? 'Round ' + fx.round : fx.round}</div>
      <div class="vs ell">${mine === fx.home ? 'v' : '@'} ${teamName(opp)}</div><div class="meta">${dateStr(fx.day)} · ${teamDef(fx.venue || fx.home).ground} · ${days > 0 ? `in ${days} day${days > 1 ? 's' : ''}` : 'today'}</div></div>${badge(opp, true)}</div>`;
    acts = `<div class="actions home-acts"><button class="btn pri" onclick="continueGame()">${game.pendingFx ? 'Match day ▸' : 'Continue to match ▸'}</button><button class="btn" onclick="simDays(7)">Sim week</button><button class="btn icon" onclick="simMenu()">⋯</button></div>`;
  } else {
    hero = `<div class="hero"><div class="mid"><div class="comp">Season</div><div class="vs">No fixtures left for ${me.nick}</div><div class="meta">Remaining matches play out before the review.</div></div></div>`;
    acts = `<button class="btn pri block home-acts" onclick="continueGame()">Continue ▸</button>`;
  }
  const form = recentForm(5, homeNation ? 'AUS' : U());
  const formLine = `<div class="home-recent-form"><span>Recent form</span><div class="home-form-results">${form || '<span class="dim xs">No completed matches</span>'}</div></div>`;
  const contextName = homeNation ? 'Australia' : me.nick;
  const homeSwitch = `<div class="home-mode"><button class="${homeNation?'':'on'}" onclick="ui.homeMode='club';render()">Club</button><button class="${homeNation?'on':''}" onclick="ui.homeMode='nation';render()">Nation</button></div>`;
  const nationRankings = `<div class="rows">${worldHomeRankings()}</div>`;
  const pos = c => game.season.standings[c][U()].P ? ordinal(ladderPos(c, U())) : '–';
  const kpis = `<div class="kpis">
    <div class="kpi" onclick="ui.leagueTab='ladders';ui.ladComp='SHIELD';go('league')"><div class="v">${pos('SHIELD')}</div><div class="l">Shield</div></div>
    <div class="kpi" onclick="ui.leagueTab='ladders';ui.ladComp='ODC';go('league')"><div class="v">${pos('ODC')}</div><div class="l">One-Day</div></div>
    <div class="kpi" onclick="ui.leagueTab='ladders';ui.ladComp='T20C';go('league')"><div class="v">${pos('T20C')}</div><div class="l">T20</div></div>
    <div class="kpi" onclick="ui.officeTab='board';go('office')"><div class="v ${game.board.confidence < 35 ? 'loss' : ''}">${game.board.confidence}</div><div class="l">Board</div></div>
    <div class="kpi" onclick="ui.squadTab='contracts';go('squad')"><div class="v">${money(capSpace(U()))}</div><div class="l">Cap space</div></div></div>`;
  const alerts = homeNotices();
  const visible = alerts.filter(a => !noticeDismissed(a));
  const decisions = visible.filter(a => a.action);
  const information = visible.filter(a => !a.action);
  const attention = visible.length ? `<button class="attention-link" onclick="attentionSheet()" aria-label="Open ${visible.length} club updates"><span class="attention-icon">${decisions.length ? '!' : 'i'}</span><span class="attention-copy"><b>${decisions.length ? `${decisions.length} decision${decisions.length === 1 ? '' : 's'} to review` : `${information.length} club update${information.length === 1 ? '' : 's'}`}</b><small>${decisions.length && information.length ? `${information.length} other update${information.length === 1 ? '' : 's'} · Tap to review` : 'Tap to review or dismiss'}</small></span><span class="attention-chevron">›</span></button>` : '';
  // The home ladder only shows domestic competitions; an international fixture next falls back to the Shield.
  const hc = COMP_ORDER.includes(ui.homeComp) ? ui.homeComp : fx && COMP_ORDER.includes(fx.comp) ? fx.comp : 'SHIELD';
  return `<div class="grid home-dashboard">
    ${panel(`${contextName} · ${game.season.label}`, hero)}

    <div class="grid g2 home-bottom">
      <div class="grid home-primary">${homeNation ? panel('World rankings', nationRankings, {flush:true}) : panel('Ladder', ladderTable(hc, true), { flush: true, end: `<span class="home-comp-select">${sel(COMP_ORDER.map(c => [c, COMPS[c].short]), hc, "ui.homeComp=this.value;render()")}</span>` })}${acts}</div>
      <div class="grid">
        ${wcHomeCard()}${homeExtras()}

      </div>
    </div></div>`;

function playerListSheet(title, kind) {
  const sq = squadOf(U()).filter(p => kind === 'injured' ? p.injury : kind === 'duty' ? p.natDuty : (!p.injury && !p.natDuty && p.fitness < 75)).sort((a, b) => a.fitness - b.fitness);
  sheet('Squad', title, `<div class="rows">${sq.map(p => playerRow(p, { sub: kind === 'injured' ? `${esc(p.injury.type)} · back ${dateStr(p.injury.until)}` : null })).join('') || '<div class="empty">Nobody.</div>'}</div>`, { flush: true });
}
function ladderTable(comp, compact) {
  const fc = COMPS[comp].fmt === 'FC';

function intlSeasonAwardsHtml(a) {
  if (!a || !a.sampled) return '<div class="empty">No complete international match scorecards available for this season.</div>';
  const labels = [['overall','International player of the year'],['FC','Test player of the year'],['OD','ODI player of the year'],['T20','T20I player of the year'],['young','Young international player'],['bat','International batter'],['bowl','International bowler']];
  const rows = labels.map(([key,title]) => {
    const item = a.winners[key];
    return `<div class="kv"><span>${title}</span><span>${item && P(item.id) ? `${natTag(P(item.id))} ${plink(P(item.id), pname(P(item.id)))}` : '<span class="dim">Insufficient data</span>'}</span></div>`;
  });
  for (const fmt of ['FC','OD','T20']) {
    for (const [k,label] of [['runs','runs'],['wickets','wickets']]) {
      const item = a.leaders[fmt] && a.leaders[fmt][k];
      rows.push(`<div class="kv"><span>${fmt === 'FC' ? 'Test' : fmt === 'OD' ? 'ODI' : 'T20I'} ${label}</span><span>${item && P(item.id) ? `${plink(P(item.id), pname(P(item.id)))} · ${item.value}` : '<span class="dim">—</span>'}</span></div>`);
    }
  }
  return `<div class="rows">${rows.join('')}</div><div class="xs muted pb">Based on ${a.sampled} completed international scorecards retained this season. Awards require at least two recorded appearances.</div>`;
}

const GROUP_OPTS = [['ALL','All roles'],['BAT','Batters'],['WK','Keepers'],['AR','All-rounders'],['PACE','Pace'],['SPIN','Spin']];
function sortPlayers(arr, key, fmt) {
  const f = { ovr: p => -overall(p, fmt), age: p => p.age, role: p => Object.keys(ROLES).indexOf(p.role), fit: p => p.fitness, pot: p => -p.pot, sal: p => -(p.contract ? p.contract.salary : askingSalary(p)), form: p => -p.form }[key] || (p => -overall(p, fmt));
  return arr.slice().sort((a, b) => f(a) - f(b));
}

function wormSvg(innings, fmt) {
  if (fmt === 'FC') return '';
  const valid = (innings || []).filter(i => i && Array.isArray(i.overRuns) && i.overRuns.length);
  if (!valid.length) return '<div class="empty">Run progression appears after the first over.</div>';
  const maxO = Math.max(1, FORMATS[fmt].overs || 20, ...valid.map(i => i.maxOvers || 0));
  const runs = valid.map(i => { let c = 0; return [0, ...i.overRuns.map(r => c += r)]; });
  const maxR = Math.max(20, Math.ceil(Math.max(...runs.map(r => Math.max(...r))) / 25) * 25);
  const W = 600, H = 165, L = 34, R = 10, T = 12, B = 24;
  const x = o => L + Math.min(1, o / maxO) * (W - L - R);
  const y = r => H - B - Math.max(0, r) / maxR * (H - T - B);
  const palette = ['#f1c64f', '#76c9fa'];
  const grid = [0,.25,.5,.75,1].map(f => { const r = Math.round(maxR*f); return `<line x1="${L}" y1="${y(r)}" x2="${W-R}" y2="${y(r)}" stroke="#294150" stroke-width=".7"/><text x="${L-5}" y="${y(r)+3}" fill="#8fa5b4" font-size="11" text-anchor="end">${r}</text>`; }).join('');
  const ticks = [0,.25,.5,.75,1].map(f => `<text x="${x(maxO*f)}" y="${H-5}" fill="#8fa5b4" font-size="11" text-anchor="middle">${Math.round(maxO*f)}</text>`).join('');
  const paths = runs.map((r,k) => `<polyline fill="none" stroke="${palette[k%2]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="${r.map((v,o)=>x(o)+','+y(v)).join(' ')}"/>`).join('');
  const legends = valid.map((i,k) => `<span class="worm-key"><i style="background:${palette[k%2]}"></i>${esc(teamDef(i.bat).short || i.bat)} ${i.runs}/${i.wkts}</span>`).join('');
  const chase = valid[1];
  const activeChase = chase && chase.target && !chase.closed && !chase.allOut && chase.runs < chase.target && chase.balls < maxO * 6;
  const target = activeChase ? `<span class="worm-target">Target ${chase.target} · ${Math.max(0,chase.target-chase.runs)} needed</span>` : '';
  return `<div class="worm-wrap"><div class="worm-legend">${legends}${target}</div><svg class="worm" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cumulative runs by over for ${valid.map(i=>teamDef(i.bat).name).join(' and ')}">${grid}${ticks}${paths}</svg><div class="worm-axis">Overs</div></div>`;
}
function innLabel(S, k) { return `Inn ${k + 1}`; }
function scorecardHtml(S, k, fnName, noWorm) {
