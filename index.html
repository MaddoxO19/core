}
// §9 NEW GAME + APPLYING RESULTS ---------------------------------------------
let game = null;

function createGame(gmName, teamId, year) {
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  seedRng(seed);
  game = {
    meta: { created: new Date().toISOString(), build: BUILD.version, seed, slot: 1 },
    gm: { name: gmName || 'FitzO', teamId, rep: 35, wins: 0, losses: 0, draws: 0, titles: [], seasons: 0, fired: false, jobs: [{ teamId, from: year }] },
    year, phase: 'season', day: 0,
    players: {}, nextPid: 1,
    season: null, scorecards: {}, news: [], offers: [], transactions: [],
    tactics: { FC:{ bat:'balanced', field:'balanced', bowl:'balanced' }, OD:{ bat:'balanced', field:'balanced', bowl:'balanced' }, T20:{ bat:'balanced', field:'balanced', bowl:'balanced' } },
    autoXI: { FC:true, OD:true, T20:true }, userXI: { FC:[], OD:[], T20:[] }, captain: null,
    training: 'balanced', deadMoney: 0, plans: {}, scout: {}, scoutedFx: {},
    defaultPlan: { FC: Object.assign({}, DEFAULT_PLAN), OD: Object.assign({}, DEFAULT_PLAN), T20: Object.assign({}, DEFAULT_PLAN) },
    board: { confidence: 60, objectives: [] },
    history: [], live: null, pendingFx: null, offseason: null, rng: 0
  };
  // Squads
  TEAM_DEFS.forEach(t => {
    const base = 64 + randInt(0, 5);
    const stars = shuffle([...Array(SQUAD_TEMPLATE.length).keys()]).slice(0, 2);
    SQUAD_TEMPLATE.forEach((role, i) => {
      const q = base + randn() * 5 + (stars.includes(i) ? 11 : 0);
      const age = clamp(Math.round(26.5 + randn() * 4), 19, 36);
      const p = makePlayer({ role, q, age, teamId: t.id });
      seedCareer(p);
    });
    // Keep every squad comfortably under the cap.
    const sq = squadOf(t.id);
    const pay = sq.reduce((a, p) => a + p.contract.salary, 0);
    if (pay > SALARY_CAP * 0.9) { const f = SALARY_CAP * 0.9 / pay; sq.forEach(p => p.contract.salary = Math.max(MIN_SALARY, Math.round(p.contract.salary * f / 5000) * 5000)); }
  });
  // Free agents: local depth plus a handful of overseas professionals.
  for (let i = 0; i < 14; i++) { const p = makePlayer({ role: pick(Object.keys(ROLES)), q: randInt(54, 68), age: randInt(20, 35) }); seedCareer(p); }
  const osNats = Object.keys(NATIONS).filter(n => n !== 'AUS');
  for (let i = 0; i < 10; i++) { const p = makePlayer({ role: pick(['OPEN','TOP','MID','BAR','PACE','PACE','LEG','OFF','BWAR']), q: randInt(66, 80), age: randInt(24, 33), nat: pick(osNats) }); seedCareer(p); }
  game.captain = squadOf(teamId).sort((a, b) => (peakOvr(b) + b.age * 0.6) - (peakOvr(a) + a.age * 0.6))[0].id;
  game.season = buildSeason(year);
  game.board.objectives = makeObjectives(teamId);
  addNews('Club', `${gmName} appointed GM of ${teamName(teamId)}`, `The board has handed you control of the ${teamDef(teamId).nick} for the ${game.season.label} season. Objectives are waiting in the Office.`);
  addNews('League', 'Season fixtures released', 'The One-Day Cup opens the summer, followed by the Sheffield Shield. The T20 Championship runs through December and January.');
  return game;
}

function addNews(tag, title, body) {
  game.news.unshift({ tag, title, body: body || '', day: game.day, year: game.year });
  if (game.news.length > 60) game.news.length = 60;
}
function logTx(text) { game.transactions.unshift({ text, day: game.day, year: game.year }); if (game.transactions.length > 80) game.transactions.length = 80; }
function fixtureById(id) { return game.season.fixtures.find(f => f.id === id); }

function compactScorecard(M) {
  return {
    condText: condSummary(M), overs: M.overs || null,
    comp: M.comp, fmt: M.fmt, home: M.home, away: M.away, venue: M.venue, stage: M.stage, toss: M.toss, result: M.result, potm: M.potm, xi: M.xi,
    innings: M.innings.map(i => ({ maxOvers: M.overs || null, bat: i.bat, bowl: i.bowl, runs: i.runs, wkts: i.wkts, balls: i.balls, ext: i.ext, declared: i.declared, allOut: i.allOut, followOn: i.followOn, target: i.target,
      card: i.card.map(c => ({ id: c.id, r: c.r, b: c.b, f4: c.f4, f6: c.f6, out: c.out, in: c.in })),
      bw: Object.keys(i.bw).map(id => Object.assign({ id }, i.bw[id])), fow: i.fow, overRuns: i.overRuns }))
  };
}

function matchPerformance(M, id) {
  const fmt = M.fmt; const parR = { FC:28, OD:28, T20:20 }[fmt];
  let bat = null, bowl = null;
  M.innings.forEach(inn => {
    const c = inn.card.find(x => x.id === id && x.in);
    if (c) bat = (bat || 0) + c.r;
    const b = inn.bw[id];
    if (b && b.balls) { bowl = bowl || { w:0, r:0, balls:0 }; bowl.w += b.w; bowl.r += b.r; bowl.balls += b.balls; }
  });
  const parts = [];
  if (bat != null) parts.push(50 + (bat - parR) * (fmt === 'T20' ? 1.0 : 0.6));
  if (bowl && bowl.balls >= 12) {
    const rr = bowl.r / (bowl.balls / 6), parRR = FORMATS[fmt].baseRR;
    parts.push(50 + (bowl.w - (fmt === 'FC' ? 2.5 : 1.3)) * 12 - (fmt !== 'FC' ? (rr - parRR) * 3 : 0));
  }
  return parts.length ? clamp(Math.max(...parts), 10, 95) : 50;
}

const INJURIES = {
  pace: [['Side strain',21,42,3],['Hamstring strain',10,24,3],['Back stress fracture',60,110,1],['Ankle sprain',7,20,2],['Finger fracture',14,35,1]],
  other: [['Hamstring strain',10,24,3],['Finger fracture',14,35,2],['Calf strain',10,21,2],['Concussion',7,12,1],['Ankle sprain',7,20,2]]
};
function injure(p) {
  const list = isPace(p) ? INJURIES.pace : INJURIES.other;
  const t = weightedPick(list, x => x[3]);
  const days = randInt(t[1], t[2]);
  p.injury = { type: t[0], until: game.day + days, days };
  if (p.teamId === U()) addNews('Medical', `${pname(p)} injured`, `${t[0]}. Expected to miss about ${Math.ceil(days / 7)} week${days > 7 ? 's' : ''}.`);
}

function applyMatch(M) {
  const fx = fixtureById(M.fxId);
  const comp = COMPS[M.comp], fmt = M.fmt;
  const inXI = M.abandoned ? [] : [...M.xi[M.home], ...M.xi[M.away]];
  inXI.forEach(id => addStat(P(id), fmt, s => s.m++));
  learnFromMatch(M);
  M.innings.forEach(inn => {
    inn.card.forEach(c => {
      if (!c.in) return;
      addStat(P(c.id), fmt, s => {
        s.inn++; if (!c.out) s.no++;
        s.r += c.r; s.b += c.b; s.f4 += c.f4; s.f6 += c.f6;
        if (c.r >= 100) s.c100++; else if (c.r >= 50) s.c50++;
        if (c.r > s.hs || (c.r === s.hs && !c.out)) { s.hs = c.r; s.hsNo = !c.out; }
      });
      if (c.out && c.out.fielder && c.out.how !== 'run out') addStat(P(c.out.fielder), fmt, s => { if (c.out.how === 'stumped') s.st++; else s.ct++; });
    });
    Object.keys(inn.bw).forEach(id => {
      const b = inn.bw[id];
      addStat(P(id), fmt, s => {
        s.bb += b.balls; s.rc += b.r; s.w += b.w; if (b.w >= 5) s.w5++;
        if (b.w > s.bbw || (b.w === s.bbw && b.w > 0 && b.r < s.bbr)) { s.bbw = b.w; s.bbr = b.r; }
      });
    });
  });

  // Result + ladder
  const res = Object.assign({}, M.result);
  if (fx.stage !== 'league' && !res.winner) {
    res.winner = fx.home; res.advanced = true;
    res.text += `. ${teamName(fx.home)} ${fx.stage === 'final' ? 'take the title' : 'advance'} on ladder position.`;
  }
  if (fx.stage === 'league') {
    const st = game.season.standings[M.comp];
    st[M.home].P++; st[M.away].P++;
    if (res.winner) { const l = res.winner === M.home ? M.away : M.home; st[res.winner].W++; st[res.winner].Pts += comp.win; st[l].L++; }
    else if (res.noResult) { [M.home, M.away].forEach(t => { st[t].NR = (st[t].NR || 0) + 1; st[t].Pts += comp.draw; }); }
    else if (res.tie) { [M.home, M.away].forEach(t => { st[t].T++; st[t].Pts += comp.tie; }); }
    else { [M.home, M.away].forEach(t => { st[t].D++; st[t].Pts += comp.draw; }); }
    M.innings.forEach(inn => {
      const F = FORMATS[fmt];
      const balls = (F.overs && inn.allOut) ? mOvers(M) * 6 : inn.balls;
      st[inn.bat].rf += inn.runs; st[inn.bat].bf += balls; st[inn.bat].wl += inn.wkts;
      st[inn.bowl].ra += inn.runs; st[inn.bowl].ba += balls; st[inn.bowl].wt += inn.wkts;
    });
  }
  fx.result = { winner: res.winner, draw: !!res.draw && !res.advanced, tie: !!res.tie, noResult: !!res.noResult && !res.advanced, text: res.text, summary: M.abandoned ? 'No play' : matchSummary(M), potm: M.potm, cond: condSummary(M) };
  if (M.home === U() || M.away === U() || fx.stage !== 'league') game.scorecards[fx.id] = compactScorecard(M);

  // Fitness, injuries, form
  const cond = game.training === 'fitness';
  inXI.forEach(id => {
    const p = P(id);
    let overs = 0; M.innings.forEach(inn => { if (inn.bw[id]) overs += inn.bw[id].balls / 6; });
    let load = (fmt === 'FC' ? 6 : fmt === 'OD' ? 3 : 2) * (M.cond && M.cond.days.some(d => d.sky === 'hot') ? 1.25 : 1);
    load += overs * (isPace(p) ? (fmt === 'FC' ? 0.32 : fmt === 'OD' ? 0.8 : 1.5) : (fmt === 'FC' ? 0.12 : 0.4));
    p.fitness = clamp(p.fitness - load * (1.15 - p.sk.stamina / 200), 35, 100);
    let risk = 0.004 + Math.max(0, 78 - p.fitness) * 0.0016 + (isPace(p) ? overs * (fmt === 'FC' ? 0.0005 : 0.0015) : 0);
    if (cond && p.teamId === U()) risk *= 0.75;
    if (!p.injury && rand() < risk) injure(p);
    p.form = clamp(Math.round(p.form * 0.75 + matchPerformance(M, id) * 0.25), 15, 92);
  });

  // User consequences
  if (M.home === U() || M.away === U()) {
    const opp = M.home === U() ? M.away : M.home;
    if (fx.result.winner === U()) { game.gm.wins++; game.season.userWins++; }
    else if (fx.result.winner) { game.gm.losses++; game.season.userLosses++; }
    else game.gm.draws++;
    const potm = M.potm ? P(M.potm) : null;
    addNews(COMPS[M.comp].short, `${fx.result.winner === U() ? 'Win' : fx.result.winner ? 'Loss' : fx.result.tie ? 'Tie' : 'Draw'} vs ${teamName(opp)}`, `${fx.result.text}. ${fx.result.summary}.${potm ? ' Player of the match: ' + pname(potm) + '.' : ''}`);
  }
  updateFinals(M.comp);
}

function updateFinals(comp) {
  const fxs = game.season.fixtures.filter(f => f.comp === comp);
  if (fxs.some(f => f.stage === 'league' && !f.result)) return;
  const lad = sortedLadder(comp).map(r => r.id);
  const seed = id => lad.indexOf(id);
  const fin = fxs.find(f => f.stage === 'final');
  if (comp === 'T20C') {
    const s1 = fxs.find(f => f.stage === 'semi1'), s2 = fxs.find(f => f.stage === 'semi2');
    if (!s1.home) {
      s1.home = lad[0]; s1.away = lad[3]; s2.home = lad[1]; s2.away = lad[2];
      addNews('T20', 'T20 semi-finals set', `${teamName(lad[0])} host ${teamName(lad[3])}; ${teamName(lad[1])} host ${teamName(lad[2])}.`);
    }
    if (s1.result && s2.result && !fin.home) {
      const w1 = s1.result.winner, w2 = s2.result.winner;
      [fin.home, fin.away] = seed(w1) < seed(w2) ? [w1, w2] : [w2, w1];
      addNews('T20', 'T20 final set', `${teamName(fin.home)} will host ${teamName(fin.away)}.`);
    }
  } else if (!fin.home) {
    fin.home = lad[0]; fin.away = lad[1];
    addNews(COMPS[comp].short, `${COMPS[comp].name} final set`, `${teamName(lad[0])} host ${teamName(lad[1])}. A draw or tie hands the title to the home side.`);
  }
  if (fin.result && !game.season.champions[comp]) {
    const w = fin.result.winner;
    game.season.champions[comp] = w;
    addNews(COMPS[comp].short, `${teamName(w)} win the ${COMPS[comp].name}`, fin.result.text + '.');
    if (w === U()) { game.gm.titles.push({ comp, year: game.year }); game.gm.rep = clamp(game.gm.rep + 3, 0, 100); }
  }
}

// §10 CALENDAR + CONTINUE LOOP ------------------------------------------------
function userFixtureToday() { return game.season.fixtures.find(f => f.day === game.day && !f.result && f.home && (f.home === U() || f.away === U())); }
function quickPlay(fx) {
  const M = createMatch(fx);
  doToss(M); setTossDecision(M, tossDecisionAI(M));
  playMatchFast(M);
  applyMatch(M);
  return M;
}
function playAIFixturesToday() {
  for (const fx of game.season.fixtures) {
    if (fx.day === game.day && !fx.result && fx.home && fx.home !== U() && fx.away !== U()) quickPlay(fx);
  }
}
function seasonDone() { return game.season.fixtures.every(f => f.result); }

function nextDay() {
  game.day++;
  let stop = false;
  const rec = game.training === 'fitness' ? 1.25 : 1;
  for (const p of Object.values(game.players)) {
    if (p.retired) continue;
    if (p.injury) {
      if (game.day >= p.injury.until) {
        p.injury = null; p.fitness = Math.max(p.fitness, 85);
        if (p.teamId === U()) addNews('Medical', `${pname(p)} cleared to play`, 'Back in full training and available for selection.');
      }
    } else p.fitness = Math.min(100, p.fitness + (2.5 + p.sk.stamina / 60) * (p.teamId === U() ? rec : 1));
  }
  for (const w of game.season.windows) {
    if (game.day === w.start) { windowStart(w); if (w.squad.some(id => P(id).teamId === U())) stop = true; }
    if (game.day === w.end) windowEnd(w);
  }
  if (game.day === CAL.TRADE_DEADLINE) addNews('League', 'Trade deadline passed', 'No more trades until the off-season. Free agents can still be signed.');
  game.offers = game.offers.filter(o => o.expires >= game.day);
  if (maybeAIOffer()) stop = true;
  return stop;
}

// Main "Continue": sims forward to the next thing that needs the GM.
function continueGame() {
  if (!game) return;
  if (game.live) { go('live'); return; }
  if (game.phase !== 'season') { offseasonContinue(); return; }
  const pend = game.pendingFx && fixtureById(game.pendingFx);
  if (pend && !pend.result) { go('matchday'); return; }
  game.pendingFx = null;
  for (let i = 0; i < 400; i++) {
    playAIFixturesToday();
    const ufx = userFixtureToday();
    if (ufx) { game.pendingFx = ufx.id; autosave(); go('matchday'); return; }
    if (seasonDone()) { endSeason(); autosave(); go('home'); return; }
    if (nextDay()) { autosave(); go('home'); return; }
  }
}
// Sim several days, auto-playing the user's matches.
function simDays(n, untilEnd) {
  if (!game || game.live || game.phase !== 'season') return;
  const start = game.day;
  for (let i = 0; i < 400; i++) {
    playAIFixturesToday();
    const ufx = userFixtureToday();
    if (ufx) quickPlay(ufx);
    if (seasonDone()) { game.pendingFx = null; endSeason(); break; }
    if (!untilEnd && game.day - start >= n) break;
    nextDay();
  }
  game.pendingFx = null;
  autosave(); go('home');
}

// §11 NATIONAL DUTY, BOARD, AWARDS ---------------------------------------------
function windowStart(w) {
  const pool = Object.values(game.players).filter(p => !p.retired && p.teamId && p.nat === 'AUS' && !p.injury);
  const fmt = w.fmt;
  const sc = p => overall(p, fmt) + formMod(p) * 1.3 + (p.caps[fmt] > 0 ? 1.5 : 0);
  const chosen = [];
  const takeN = (n, filter, score) => { pool.filter(p => !chosen.includes(p) && filter(p)).sort((a, b) => score(b) - score(a)).slice(0, n).forEach(p => chosen.push(p)); };
  takeN(1, p => p.sk.keep >= 55, p => keeperScore(p, fmt) + formMod(p));
  takeN(6, p => group(p) === 'BAT' || group(p) === 'WK', p => batRating(p, fmt) + formMod(p) * 1.3);
  takeN(fmt === 'FC' ? 1 : 2, p => group(p) === 'AR', sc);
  takeN(fmt === 'FC' ? 4 : 4, p => isPace(p) && group(p) !== 'BAT', p => bowlRating(p, fmt) + formMod(p) * 1.3);
  takeN(2, p => isSpin(p) && group(p) !== 'BAT', p => bowlRating(p, fmt) + formMod(p) * 1.3);
  takeN(w.size - chosen.length, () => true, sc);
  w.squad = chosen.map(p => p.id);
  chosen.forEach(p => p.natDuty = w.id);
  const mine = chosen.filter(p => p.teamId === U());
  if (mine.length) game.gm.rep = clamp(game.gm.rep + mine.length, 0, 100);
  addNews('National', `Australia name ${w.label} squad`, `${w.size} players selected for the series against ${NATIONS[w.opp]}.` + (mine.length ? ` ${mine.map(pname).join(', ')} ${mine.length === 1 ? 'is' : 'are'} called up from your squad and will miss domestic matches until ${dateStr(w.end)}.` : ' None of your players were selected.'));
}
function windowEnd(w) {
  const sq = w.squad.map(P);
  const aus = mean(sq.map(p => overall(p, w.fmt)).sort((a, b) => b - a).slice(0, 11));
  const opp = NATION_STRENGTH[w.opp] + randn() * 2;
  let wins = 0, losses = 0, draws = 0;
  for (let i = 0; i < w.matches; i++) {
    const pw = 1 / (1 + Math.exp(-(aus - opp) / 4));
    if (w.fmt === 'FC' && rand() < 0.22) draws++;
    else if (rand() < pw) wins++; else losses++;
  }
  w.result = { wins, losses, draws };
  sq.forEach(p => {
    p.natDuty = null;
    if (p.retired) return;
    p.caps[w.fmt] += randInt(Math.ceil(w.matches / 2), w.matches);
    p.fitness = clamp(p.fitness - randInt(4, 10), 50, 100);
    p.form = clamp(p.form + randInt(-8, 10), 15, 92);
  });
  const res = wins > losses ? 'win' : wins < losses ? 'lose' : 'draw';
  addNews('National', `Australia ${res} the series against ${NATIONS[w.opp]}`, `Final tally: ${wins} won, ${losses} lost${draws ? ', ' + draws + ' drawn' : ''}. National players return to their states.`);
}

function teamStrength(teamId) {
  const sq = squadOf(teamId);
  return mean(FMT_LIST.map(f => mean(autoXI(teamId, f, sq).order.map(id => overall(P(id), f)))));
}
function strengthRank(teamId) {
  return TEAM_DEFS.map(t => ({ id: t.id, s: teamStrength(t.id) })).sort((a, b) => b.s - a.s).findIndex(x => x.id === teamId) + 1;
}
function makeObjectives(teamId) {
  const r = strengthRank(teamId);
  if (r <= 2) return [
    { type:'trophy', text:'Win at least one trophy' },
    { type:'ladder', comp:'SHIELD', pos:2, text:'Finish top two in the Shield' },
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' }];
  if (r <= 4) return [
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' },
    { type:'ladder', comp:'SHIELD', pos:3, text:'Finish top three in the Shield' },
    { type:'ladder', comp:'ODC', pos:3, text:'Finish top three in the One-Day Cup' }];
  return [
    { type:'ladder', comp:'T20C', pos:5, text:'Finish top five in the T20 Championship' },
    { type:'ladder', comp:'SHIELD', pos:4, text:'Finish top four in the Shield' },
    { type:'wins', count:9, text:'Win at least 9 matches across all formats' }];
}
function objectiveStatus(o) {
  if (o.type === 'trophy') return COMP_ORDER.some(c => game.season.champions[c] === U());
  if (o.type === 'ladder') return ladderPos(o.comp, U()) <= o.pos;
  if (o.type === 'wins') return game.season.userWins >= o.count;
  return false;
}
function evaluateBoard() {
  const b = game.board; const lines = [];
  let delta = 0;
  b.objectives.forEach(o => { const ok = objectiveStatus(o); delta += ok ? 12 : -11; lines.push({ text: o.text, ok }); game.gm.rep = clamp(game.gm.rep + (ok ? 1 : -2), 0, 100); });
  const trophies = COMP_ORDER.filter(c => game.season.champions[c] === U()).length;
  delta += trophies * 8;
  const pay = payroll(U());
  if (pay > SALARY_CAP) { delta -= 10; lines.push({ text: 'Stay under the salary cap', ok: false }); }
  b.confidence = clamp(b.confidence + delta, 0, 100);
  const fired = b.confidence < 20;
  return { lines, delta, trophies, confidence: b.confidence, fired };
}

function seasonImpact(p, fmt) {
  const s = p.stats.season[fmt];
  if (!s.m) return 0;
  if (fmt === 'FC') return s.r + s.w * 22 + s.ct * 3;
  if (fmt === 'OD') return s.r * 1.05 + s.w * 25 + (s.b > 100 ? (srOf(s) - 85) * 1.2 : 0);
  return s.r * 1.15 + s.w * 27 + (s.b > 80 ? (srOf(s) - 135) * 1.0 : 0) - (s.bb > 60 ? (econOf(s) - 8.3) * 12 : 0);
}
function computeAwards() {
  const ps = Object.values(game.players).filter(p => !p.retired && p.teamId);
  const top = (fn, filter) => { const arr = ps.filter(filter || (() => true)).map(p => ({ p, v: fn(p) })).sort((a, b) => b.v - a.v); return arr[0] && arr[0].v > 0 ? { id: arr[0].p.id, name: pname(arr[0].p), team: arr[0].p.teamId, v: Math.round(arr[0].v) } : null; };
  const total = p => seasonImpact(p, 'FC') + seasonImpact(p, 'OD') * 1.4 + seasonImpact(p, 'T20') * 1.5;
  const a = { poy: top(total), young: top(total, p => p.age <= 23), best: {}, runs: {}, wkts: {} };
  FMT_LIST.forEach(f => {
    a.best[f] = top(p => seasonImpact(p, f));
    a.runs[f] = top(p => p.stats.season[f].r);
    a.wkts[f] = top(p => p.stats.season[f].w);
  });
  return a;
}

// §12 TRADES, CONTRACTS, FREE AGENCY ---------------------------------------------
function payroll(teamId) { return squadOf(teamId).reduce((a, p) => a + (p.contract ? p.contract.salary : 0), 0) + (teamId === U() ? game.deadMoney : 0); }
function capSpace(teamId) { return SALARY_CAP - payroll(teamId); }
function overseasCount(teamId) { return squadOf(teamId).filter(p => p.nat !== 'AUS').length; }
function freeAgents() { return Object.values(game.players).filter(p => !p.retired && !p.teamId && !p.prospect); }

function groupNeeds(teamId, removeIds, addIds) {
  removeIds = removeIds || []; addIds = addIds || [];
  const sq = squadOf(teamId).filter(p => !removeIds.includes(p.id)).concat(addIds.map(P));
  const avgO = mean(sq.map(peakOvr));
  const need = {};
  Object.keys(IDEAL_GROUPS).forEach(g => {
    const n = sq.filter(p => group(p) === g && peakOvr(p) >= avgO - 6).length;
    need[g] = clamp((IDEAL_GROUPS[g] - n) / IDEAL_GROUPS[g], 0, 1);
  });
  return need;
}
function tradeCheck(partner, giveIds, getIds) {
  const msgs = [];
  const giveSal = giveIds.reduce((a, id) => a + P(id).contract.salary, 0);
  const getSal = getIds.reduce((a, id) => a + P(id).contract.salary, 0);
  if (payroll(U()) - giveSal + getSal > SALARY_CAP) msgs.push('This would put you over the salary cap.');
  if (payroll(partner) - getSal + giveSal > SALARY_CAP) msgs.push(`${teamName(partner)} cannot fit the incoming salary under their cap.`);
  const uSize = squadOf(U()).length - giveIds.length + getIds.length;
  const pSize = squadOf(partner).length - getIds.length + giveIds.length;
  if (uSize < SQUAD_MIN || uSize > SQUAD_MAX) msgs.push(`Your squad would have ${uSize} players (allowed ${SQUAD_MIN}–${SQUAD_MAX}).`);
  if (pSize < SQUAD_MIN || pSize > SQUAD_MAX) msgs.push(`${teamName(partner)} would have ${pSize} players.`);
  const os = (ids) => ids.filter(id => P(id).nat !== 'AUS').length;
  if (overseasCount(U()) - os(giveIds) + os(getIds) > OVERSEAS_MAX) msgs.push('You would exceed the overseas player limit.');
  if (overseasCount(partner) - os(getIds) + os(giveIds) > OVERSEAS_MAX) msgs.push(`${teamName(partner)} would exceed the overseas limit.`);
  return msgs;
}
// AI judges a trade by value, weighted by what it needs and what it loses.
function evaluateTrade(partner, giveIds, getIds) {
  if (!giveIds.length || !getIds.length) return { accept: false, reason: 'A trade needs at least one player each way.' };
  const msgs = tradeCheck(partner, giveIds, getIds);
  if (msgs.length) return { accept: false, reason: msgs.join(' ') };
  const needNow = groupNeeds(partner);
  const needAfter = groupNeeds(partner, getIds, []);
  const inV = giveIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needNow[group(P(id))]), 0);
  const outV = getIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needAfter[group(P(id))]), 0);
  const ratio = inV / Math.max(0.1, outV);
  if (ratio >= 1.08) return { accept: true, ratio, reason: `${teamName(partner)} accept. They rate the package at ${Math.round(ratio * 100)}% of what they give up.` };
  const short = ratio >= 0.9 ? 'Close, but they want a little more.' : ratio >= 0.7 ? 'They see a clear gap in value.' : 'Not interested at that price.';
  return { accept: false, ratio, reason: `${short} (${Math.round(ratio * 100)}% of the value they need.)` };
}
function tradeWindowOpen() { return game.phase !== 'season' ? game.phase === 'freeagency' : game.day <= CAL.TRADE_DEADLINE; }
function executeTrade(partner, giveIds, getIds) {
  giveIds.forEach(id => { const p = P(id); p.teamId = partner; removeFromUserXI(id); });
  getIds.forEach(id => { P(id).teamId = U(); });
  const txt = `Traded ${giveIds.map(id => pname(P(id))).join(', ')} to ${teamName(partner)} for ${getIds.map(id => pname(P(id))).join(', ')}.`;
  logTx(txt); addNews('Trade', 'Trade completed', txt);
  if (giveIds.includes(game.captain)) game.captain = null;
}
function removeFromUserXI(id) { FMT_LIST.forEach(f => game.userXI[f] = (game.userXI[f] || []).filter(x => x !== id)); }

function maybeAIOffer() {
  if (!tradeWindowOpen() || game.phase !== 'season' || game.offers.length >= 2 || rand() > 0.05) return false;
  const partner = pick(TEAM_DEFS.filter(t => t.id !== U())).id;
  const need = groupNeeds(partner);
  const g = Object.keys(need).sort((a, b) => need[b] - need[a])[0];
  const targets = squadOf(U()).filter(p => group(p) === g && !p.injury && !p.natDuty).sort((a, b) => tradeValue(b) - tradeValue(a));
  if (!targets.length) return false;
  const target = targets[Math.min(targets.length - 1, randInt(0, 2))];
  const want = tradeValue(target) * (1 + 0.45 * need[g]) * 1.05;
  const cands = squadOf(partner).filter(p => group(p) !== g && !p.injury).sort((a, b) => tradeValue(b) - tradeValue(a));
  const pkg = []; let sum = 0;
  for (const c of cands) {
    if (sum >= want * 0.95 || pkg.length >= 2) break;
    const v = tradeValue(c);
    if (sum + v <= want * 1.3) { pkg.push(c.id); sum += v; }
  }
  if (!pkg.length || sum < want * 0.85) return false;
  if (tradeCheck(partner, [target.id], pkg).length) return false;
  game.offers.push({ id: 'o' + game.day + '_' + randInt(100, 999), from: partner, want: [target.id], give: pkg, expires: game.day + 7 });
  addNews('Trade', `${teamName(partner)} make an offer`, `They want ${pname(target)} and are offering ${pkg.map(id => pname(P(id))).join(' and ')}. The offer expires in a week. Review it in the Office.`);
  return true;
}

function signingAsk(p) { return askingSalary(p); }
// Fills the user's squad from free agency. Minimum-salary deals are allowed over the cap
// so a squad can always reach SQUAD_MIN.
function autoFillSquad(target) {
  const signed = [];
  let guard = 0;
  while (squadOf(U()).length < target && guard++ < 30) {
    const need = groupNeeds(U());
    const room = capSpace(U());
    const underMin = squadOf(U()).length < SQUAD_MIN;
    const cand = freeAgents().filter(p => (p.nat === 'AUS' || overseasCount(U()) < OVERSEAS_MAX) && (askingSalary(p) <= room || (underMin && askingSalary(p) <= MIN_SALARY * 1.5)))
      .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
    if (!cand) break;
    const sal = askingSalary(cand.p) <= room ? askingSalary(cand.p) : MIN_SALARY;
    cand.p.teamId = U(); cand.p.contract = { salary: sal, years: 1 };
    signed.push(cand.p);
    logTx(`Signed ${pname(cand.p)} (${money(sal)} × 1 yr) to fill the squad.`);
  }
  if (signed.length) addNews('Signing', `${signed.length} player${signed.length > 1 ? 's' : ''} signed to fill the squad`, signed.map(pname).join(', ') + '.');
  return signed;
}
function contractDecision(p, salary, years) {
  const ask = signingAsk(p);
  if (years < 1 || years > 4) return { ok: false, reason: 'Contracts run 1 to 4 years.' };
  if (p.age >= 33 && years > 2) return { ok: false, reason: `${p.last} wants a shorter deal at this stage of his career.` };
  const repAdj = 1 - (game.gm.rep - 35) / 400;
  if (salary < ask * 0.95 * repAdj) return { ok: false, reason: `${p.last} is asking for around ${money(ask)} a season.` };
  return { ok: true };
}
function signFreeAgent(id, salary, years) {
  const p = P(id);
  if (squadOf(U()).length >= SQUAD_MAX) return { ok: false, reason: `Squad is full (${SQUAD_MAX}). Release someone first.` };
  if (salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space.' };
  if (p.nat !== 'AUS' && overseasCount(U()) >= OVERSEAS_MAX) return { ok: false, reason: `You already have ${OVERSEAS_MAX} overseas players.` };
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  p.teamId = U(); p.contract = { salary, years };
  logTx(`Signed ${pname(p)} (${money(salary)} × ${years} yr${years > 1 ? 's' : ''}).`);
  addNews('Signing', `${pname(p)} signs with ${teamName(U())}`, `${ROLES[p.role].label}, ${p.age}. ${money(salary)} a season for ${years} year${years > 1 ? 's' : ''}.`);
  return { ok: true };
}
function releasePlayer(id) {
  const p = P(id);
  if (squadOf(U()).length <= SQUAD_MIN) return { ok: false, reason: `You need at least ${SQUAD_MIN} contracted players.` };
  if (game.phase === 'season') game.deadMoney += Math.round(p.contract.salary * 0.5 / 5000) * 5000;
  p.teamId = null; p.contract = null;
  removeFromUserXI(id);
  if (game.captain === id) game.captain = null;
  logTx(`Released ${pname(p)}.`);
  return { ok: true };
}
function extendPlayer(id, salary, years) {
  const p = P(id);
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  if (salary - p.contract.salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space for the raise.' };
  p.contract = { salary, years: p.contract.years + years };
  logTx(`Extended ${pname(p)} (${money(salary)}, now ${p.contract.years} yrs).`);
  return { ok: true };
}

// AI teams fill squads from free agency using a need-aware score.
function aiFreeAgency() {
  TEAM_DEFS.forEach(t => {
    if (t.id === U()) return;
    let sq = squadOf(t.id);
    while (sq.length > SQUAD_MAX || (payroll(t.id) > SALARY_CAP && sq.length > SQUAD_MIN)) {
      const w = sq.sort((a, b) => tradeValue(a) / a.contract.salary - tradeValue(b) / b.contract.salary)[0];
      w.teamId = null; w.contract = null; sq = squadOf(t.id);
    }
    let guard = 0;
    while (sq.length < 20 && guard++ < 10) {
      const need = groupNeeds(t.id);
      const cand = freeAgents().filter(p => askingSalary(p) <= capSpace(t.id) && (p.nat === 'AUS' || overseasCount(t.id) < OVERSEAS_MAX))
        .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
      if (!cand) break;
      cand.p.teamId = t.id; cand.p.contract = { salary: askingSalary(cand.p), years: randInt(1, 2) };
      sq = squadOf(t.id);
    }
  });
}

// §13 OFF-SEASON ------------------------------------------------------------------
function endSeason() {
  game.phase = 'review';
  const awards = computeAwards();
  const board = evaluateBoard();
  const finish = {}; COMP_ORDER.forEach(c => finish[c] = ladderPos(c, U()));
  game.history.unshift({ year: game.year, label: game.season.label, champions: Object.assign({}, game.season.champions), awards, team: U(), finish, record: [game.season.userWins, game.season.userLosses] });
  game.gm.seasons++;

    if (p.retired) return;
    const s = p.stats.season, tot = s.FC.m + s.OD.m + s.T20.m;
    if (tot) p.hist.push({ year: game.year, team: p.teamId, FC: { m: s.FC.m, r: s.FC.r, w: s.FC.w }, OD: { m: s.OD.m, r: s.OD.r, w: s.OD.w }, T20: { m: s.T20.m, r: s.T20.r, w: s.T20.w } });
  });
  game.offseason = { awards, board, dev: null, expiring: [], draft: null, jobOffers: [] };
  if (board.fired) {
    game.gm.fired = true;
    game.offseason.jobOffers = TEAM_DEFS.filter(t => t.id !== U()).map(t => t.id).sort(() => rand() - 0.5).slice(0, 2);
    addNews('Club', 'The board has terminated your contract', `Board confidence fell to ${board.confidence}. Two states have offered you a role.`);
  } else addNews('Club', 'Season review', `Board confidence is now ${board.confidence} (${board.delta >= 0 ? '+' : ''}${board.delta}).`);
}
function acceptJob(teamId) {

  game.gm.jobs.push({ teamId, from: game.year + 1 });

  game.offseason.jobOffers = [];

function developPlayer(p) {
  const cur = peakOvr(p), head = p.pot - cur;
  let g;
  if (p.age <= 20) g = 2 + rand() * 4;
  else if (p.age <= 23) g = 1 + rand() * 3.5;
  else if (p.age <= 26) g = rand() * 2.5 - 0.3;
  else if (p.age <= 29) g = rand() * 1.6 - 0.8;
  else if (p.age <= 31) g = -0.8 - rand() * 1.6;
  else if (p.age <= 33) g = -1.5 - rand() * 2;
  else g = -2.5 - rand() * 2.5;
  const s = p.stats.season, played = s.FC.m + s.OD.m + s.T20.m;
  if (g > 0 && played >= 12) g += 0.6;
  if (p.age <= 22 && rand() < 0.06) g += 4;
  if (g > 0) g = head <= 0 ? 0 : Math.min(g, Math.max(0.3, head * 0.5));
  let batM = 1, bowlM = 1;
  if (p.teamId === U()) {
    if (game.training === 'batting') { batM = 1.35; bowlM = 0.7; }
    else if (game.training === 'bowling') { batM = 0.7; bowlM = 1.35; }
    else if (game.training === 'fitness') { batM = 0.85; bowlM = 0.85; p.sk.stamina = clamp(p.sk.stamina + 2, 15, 99); }
  }
  const grp = group(p);
  const bump = (k, m) => { p.sk[k] = clamp(Math.round(p.sk[k] + g * m * (0.7 + rand() * 0.6)), 15, 99); };
  const bat = ['tech','temp','power'], bowl = ['bowl','acc','vari'];
  if (grp === 'BAT' || grp === 'WK') bat.forEach(k => bump(k, g > 0 ? batM : 1));
  if (grp === 'WK') bump('keep', 1);
  if (grp === 'AR') { bat.forEach(k => bump(k, g > 0 ? batM : 1)); if (canBowl(p)) bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); }
  if (grp === 'PACE' || grp === 'SPIN') { bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); if (isPace(p) && p.age >= 31) p.sk.bowl = clamp(p.sk.bowl - 1, 15, 99); }
  bump('field', 0.6);
  if (g < 0) p.sk.stamina = clamp(p.sk.stamina - randInt(0, 2), 15, 99);
  if (p.age >= 27) p.pot = Math.max(peakOvr(p), p.pot - 1);
  p.pot = Math.max(p.pot, peakOvr(p));
  return peakOvr(p) - cur;
}
function retires(p) {
  const o = peakOvr(p);
  let ch = 0;
  if (p.age >= 33) ch = 0.12 + (p.age - 33) * 0.16;
  if (p.age >= 31 && o < 62) ch += 0.25;
  if (!p.teamId && p.age >= 30) ch += 0.3;
  if (p.age >= 38) ch = 1;
  return rand() < ch;
}
function runDevelopment() {
  const rep = { up: [], down: [], retired: [] };
  Object.values(game.players).forEach(p => {
    if (p.retired || p.prospect) return;
    p.age++;
    const d = developPlayer(p);
    if (p.teamId === U()) { if (d >= 2) rep.up.push([p.id, d]); else if (d <= -2) rep.down.push([p.id, d]); }
    p.form = Math.round(50 + (p.form - 50) * 0.3); p.fitness = 100; p.injury = null; p.natDuty = null;
    if (retires(p)) {
      const wasMine = p.teamId === U();
      rep.retired.push({ id: p.id, team: p.teamId, mine: wasMine });
      p.retired = true; p.teamId = null; p.contract = null; removeFromUserXI(p.id);
      if (game.captain === p.id) game.captain = null;
    }
  });
  rep.up.sort((a, b) => b[1] - a[1]); rep.down.sort((a, b) => a[1] - b[1]);
  game.offseason.dev = rep;
  const mine = rep.retired.filter(r => r.mine).map(r => pname(P(r.id)));
  addNews('League', `${rep.retired.length} players retire`, mine.length ? `From your squad: ${mine.join(', ')}.` : 'None from your squad.');
}
function processContracts() {
  const expiring = [];
  Object.values(game.players).forEach(p => {
    if (p.retired || !p.teamId || !p.contract) return;
    p.contract.years--;
    if (p.contract.years > 0) return;
    if (p.teamId === U()) { expiring.push({ id: p.id, ask: Math.round(askingSalary(p) * (p.morale < 50 ? 1.15 : 1) / 5000) * 5000, years: p.age >= 32 ? 1 : 2, status: 'pending' }); return; }
    const ask = askingSalary(p);
    const keep = playerValueScore(p) > 0.12 && p.age <= 33 && rand() < 0.8 && payroll(p.teamId) - p.contract.salary + ask <= SALARY_CAP;
    if (keep) p.contract = { salary: ask, years: randInt(1, 3) };
    else { p.teamId = null; p.contract = null; }
  });
  game.offseason.expiring = expiring;
  game.deadMoney = 0;
}
function resignExpiring(id) {
  const e = game.offseason.expiring.find(x => x.id === id);
  if (!e) return;

  p.contract = { salary: e.ask, years: e.years }; e.status = 'signed';
  logTx(`Re-signed ${pname(p)} (${money(e.ask)} × ${e.years}).`);
}
function letGoExpiring(id) { const e = game.offseason.expiring.find(x => x.id === id); if (e) e.status = 'released'; }
function finaliseExpiring() {
  game.offseason.expiring.forEach(e => {
    if (e.status === 'signed') return;
    const p = P(e.id); p.teamId = null; p.contract = null; removeFromUserXI(p.id); if (game.captain === p.id) game.captain = null;
    logTx(`${pname(p)} left as a free agent.`);
  });
}

function setupDraft() {
  for (let i = 0; i < 18; i++) makeProspect();
  const score = id => COMP_ORDER.reduce((a, c) => a + ladderPos(c, id) + (game.season.champions[c] === id ? -2 : 0), 0);
  const order = TEAM_DEFS.map(t => t.id).sort((a, b) => score(b) - score(a));
  game.offseason.draft = { order: [...order, ...order], pick: 0, picks: [] };
  addNews('Draft', 'Rookie draft order set', `${teamName(order[0])} hold the first pick. Two rounds, twelve picks.`);
}
function draftPool() { return Object.values(game.players).filter(p => p.prospect && !p.teamId && !p.retired); }
function draftOnClock() { const d = game.offseason.draft; return d && d.pick < d.order.length ? d.order[d.pick] : null; }
function makeDraftPick(teamId, id) {
  const d = game.offseason.draft;
  if (id) {
    const p = P(id);
    p.teamId = teamId; p.prospect = false; p.contract = { salary: ROOKIE_SALARY, years: 2 };

    if (teamId === U()) { logTx(`Drafted ${pname(p)} with pick ${d.pick + 1}.`); addNews('Draft', `${pname(p)} drafted`, `${ROLES[p.role].label}, ${p.age}. Scouts rate his potential ${potGrade(p)}.`); }
  } else d.picks.push({ n: d.pick + 1, team: teamId, id: null });

}
function aiDraftChoice(teamId) {
  if (squadOf(teamId).length >= SQUAD_MAX || capSpace(teamId) < ROOKIE_SALARY) return null;
  const need = groupNeeds(teamId);
  const c = draftPool().map(p => ({ p, s: p.pot * 0.65 + peakOvr(p) * 0.35 + need[group(p)] * 8 + rand() * 3 })).sort((a, b) => b.s - a.s)[0];
  return c ? c.p.id : null;
}
function runDraftUntilUser(autoUser) {
  const d = game.offseason.draft;
  while (d.pick < d.order.length) {
    const t = d.order[d.pick];
    if (t === U() && !autoUser) return false;
    makeDraftPick(t, aiDraftChoice(t));
  }
  // Leftover prospects: the best few become free agents, the rest go back to club cricket.
  draftPool().sort((a, b) => b.pot - a.pot).forEach((p, i) => {
    if (i < 4) p.prospect = false; else delete game.players[p.id];
  });
  return true;
}

function startNewSeason() {
  Object.values(game.players).forEach(p => { p.stats.season = blankStats3(); p.natDuty = null; });
  game.year++;
  game.season = buildSeason(game.year);
  game.day = 0; game.scorecards = {}; game.pendingFx = null; game.offers = []; game.live = null;
  FMT_LIST.forEach(f => game.userXI[f] = (game.userXI[f] || []).filter(id => P(id) && P(id).teamId === U()));
  if (game.captain && (!P(game.captain) || P(game.captain).teamId !== U())) game.captain = null;
  if (!game.captain) { const c = squadOf(U()).sort((a, b) => (peakOvr(b) + b.age * 0.6) - (peakOvr(a) + a.age * 0.6))[0]; game.captain = c ? c.id : null; }
  game.board.objectives = makeObjectives(U());
  game.phase = 'season'; game.offseason = null;
  addNews('League', `${game.season.label} season begins`, 'New fixtures are out and the board has set fresh objectives.');
}

function offseasonContinue() {
  switch (game.phase) {
    case 'review':
      if (game.gm.fired) { flash('Choose your next job first.'); return; }
      runDevelopment(); game.phase = 'development'; break;
    case 'development':
      processContracts(); game.phase = 'contracts'; break;
    case 'contracts':
      finaliseExpiring(); setupDraft(); game.phase = 'draft';
      runDraftUntilUser(false); break;
    case 'draft':
      if (draftOnClock() === U()) { flash('You are on the clock. Pick a player or pass.'); return; }
      if (runDraftUntilUser(false)) { aiFreeAgency(); game.phase = 'freeagency'; addNews('League', 'Free agency open', 'Unsigned players are available. Trades are open again.'); }
      break;
    case 'freeagency':
      if (squadOf(U()).length < SQUAD_MIN) autoFillSquad(SQUAD_MIN);
      aiFreeAgency(); startNewSeason(); break;
  }
  autosave(); go('home');
}
function userDraftPick(id) {
  if (draftOnClock() !== U()) return;
  if (id && squadOf(U()).length >= SQUAD_MAX) { flash('Your squad is full. Pass or release a player.'); return; }
  makeDraftPick(U(), id);
  if (runDraftUntilUser(false)) { aiFreeAgency(); game.phase = 'freeagency'; addNews('League', 'Free agency open', 'Unsigned players are available. Trades are open again.'); }
  autosave(); render();
}

function saveKey(slot) { return SAVE_PREFIX + slot; }
function saveGame(slot, notify) {
  if (!game) return false;
  slot = slot || game.meta.slot || 1;
  game.rng = rngState; game.meta.slot = slot; game.meta.saved = new Date().toISOString();
  try {
    localStorage.setItem(saveKey(slot), JSON.stringify(game, (k, v) => k === '_names' ? undefined : v));
    if (notify) flash(`Career saved to slot ${slot}.`);
    return true;
  } catch (e) { if (notify) flash('Save failed. Browser storage may be full or blocked.'); return false; }
}

function readSlot(slot) { try { const raw = localStorage.getItem(saveKey(slot)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function loadGame(slot) {

}

function renderOffseason() {

  if (game.phase === 'review') {
    const a = o.awards, b = o.board;
    const aw = (label, x, unit) => `<div class="kv"><span>${label}</span><span>${x ? `${plink(P(x.id), x.name)} <span class="dim">${tdot(x.team)}${unit ? ' · ' + x.v + ' ' + unit : ''}</span>` : '–'}</span></div>`;

      ${panel('Champions', `<div class="rows">${COMP_ORDER.map(c => `<div class="kv"><span>${COMPS[c].name}</span><span>${game.season.champions[c] ? tdot(game.season.champions[c]) + ' ' + teamDef(game.season.champions[c]).nick : '–'}</span></div>`).join('')}
        ${COMP_ORDER.map(c => `<div class="kv"><span>Your ${COMPS[c].short} finish</span><span>${ordinal(ladderPos(c, U()))}</span></div>`).join('')}<div class="kv"><span>Season record</span><span>${game.season.userWins}W ${game.season.userLosses}L</span></div></div>`, { flush: true })}
      ${panel('Board review', `<div class="rows">${b.lines.map(l => `<div class="kv"><span>${l.text}</span><span class="${l.ok ? 'win' : 'loss'}">${l.ok ? 'Met' : 'Missed'}</span></div>`).join('')}

        ${game.gm.fired ? `<div class="pb"><div class="note bad">The board has terminated your contract. Choose your next job.</div><div class="flex wrap" style="margin-top:8px">${o.jobOffers.map(t => `<button class="btn pri sm" onclick="acceptJob('${t}');autosave();render()">Take the ${teamName(t)} job</button>`).join('')}</div></div>` : ''}`, { flush: true })}
      ${panel('Awards', `<div class="rows">${aw('Player of the Year', a.poy)}${aw('Young Player of the Year', a.young)}${FMT_LIST.map(f => aw(compName(f) + ' player of the tournament', a.best[f])).join('')}</div>`, { flush: true })}
      ${panel('Stat leaders', `<div class="rows">${FMT_LIST.map(f => aw(compName(f) + ' runs', a.runs[f], 'runs') + aw(compName(f) + ' wickets', a.wkts[f], 'wkts')).join('')}</div>`, { flush: true })}</div>`;
    btn = 'Player development ▸';
  } else if (game.phase === 'development') {
    const d = o.dev;
    const r = ([id, v]) => playerRow(P(id), { end: `<span class="${v > 0 ? 'win' : 'loss'} b">${v > 0 ? '+' : ''}${v}</span>${pill(peakOvr(P(id)))}`, sub: `${ROLES[P(id).role].label} · ${P(id).age}` });
    body = `<div class="grid g2">${panel('Your improvers', `<div class="rows">${d.up.slice(0, 10).map(r).join('') || '<div class="empty">No big jumps this year.</div>'}</div>`, { flush: true })}
      ${panel('Your decliners', `<div class="rows">${d.down.slice(0, 10).map(r).join('') || '<div class="empty">Nobody dropped off sharply.</div>'}</div>`, { flush: true })}
      ${panel(`Retirements (${d.retired.length})`, `<div class="rows">${d.retired.map(x => playerRow(P(x.id), { sub: `${x.team ? teamDef(x.team).nick + ' · ' : ''}${P(x.id).age} · ${ROLES[P(x.id).role].label}`, end: '' })).join('') || '<div class="empty">No retirements.</div>'}</div>`, { flush: true, cls: 'span2' })}</div>`;
    btn = 'Contract renewals ▸';
  } else if (game.phase === 'contracts') {
    const ex = o.expiring;
    body = panel(`Expiring contracts · cap space ${money(capSpace(U()))}`, `<div class="rows">${ex.map(e => { const p = P(e.id); return playerRow(p, { sub: `${ROLES[p.role].short} · ${p.age} · asks ${money(e.ask)} × ${e.years}`,
      end: e.status === 'pending' ? `${pill(peakOvr(p))}<button class="btn sm pri" onclick="event.stopPropagation();resignExpiring('${e.id}');render()">Re-sign</button><button class="btn sm ghost" onclick="event.stopPropagation();letGoExpiring('${e.id}');render()">Let go</button>` : chip(e.status === 'signed' ? 'good' : 'bad', e.status === 'signed' ? 'Re-signed' : 'Leaving') }); }).join('') || '<div class="empty">No contracts expire this year.</div>'}</div>

      ${clock === U() ? `<div class="pb"><div class="flex between"><span class="s muted">Rookies sign for ${money(ROOKIE_SALARY)} × 2 · squad ${squadOf(U()).length}/${SQUAD_MAX}</span><button class="btn sm ghost" onclick="userDraftPick(null)">Pass</button></div></div>` : ''}`, { flush: true })}
      ${panel('Picks', `<div class="rows">${d.picks.map(x => `<div class="kv"><span>${x.n}. ${tdot(x.team)}</span><span>${x.id ? plink(P(x.id)) : '<span class="dim">Pass</span>'}</span></div>`).join('') || '<div class="empty">No picks yet.</div>'}</div>`, { flush: true })}</div>`;
    btn = clock === U() ? 'Make your pick' : 'Continue draft ▸';
  } else if (game.phase === 'freeagency') {
    const sq = squadOf(U());

        ${sq.length < SQUAD_MIN ? `<div class="note warn" style="margin-top:10px">Below the ${SQUAD_MIN}-player minimum. Staff will sign minimum deals if you start the season now.</div>` : ''}`)}`;
    btn = `Start ${game.year + 1}–${String(game.year + 2).slice(2)} season ▸`;
  }
  return `${pageTitle(names[idx], `${game.season.label} off-season · ${teamName(U())}`)}${stepBar}<div class="grid">${body}<button class="btn pri block" onclick="continueGame()">${btn}</button></div>`;
}

const GROUP_OPTS = [['ALL','All roles'],['BAT','Batters'],['WK','Keepers'],['AR','All-rounders'],['PACE','Pace'],['SPIN','Spin']];
function sortPlayers(arr, key, fmt) {
  const f = { ovr: p => -overall(p, fmt), age: p => p.age, role: p => Object.keys(ROLES).indexOf(p.role), fit: p => p.fitness, pot: p => -p.pot, sal: p => -(p.contract ? p.contract.salary : askingSalary(p)), form: p => -p.form }[key] || (p => -overall(p, fmt));
  return arr.slice().sort((a, b) => f(a) - f(b));
}

    <div class="xs dim" style="margin-top:6px">Tap a player for the full profile. <span class="hide-m">Ratings shown: Shield · One-Day · T20.</span></div>`;
}
function setListFmt(f) { ui.listFmt = f; render(); }

function setXIFmt(f) { ui.xiFmt = f; render(); }
function xiIssues(ids, fmt) {
  const ps = ids.map(P), out = [];
  if (ps.length !== 11) out.push(`${ps.length}/11 selected`);
  if (!ps.some(p => p.sk.keep >= 45)) out.push('No wicketkeeper');
  const opts = ps.filter(p => canBowl(p) && bowlRating(p, fmt) >= 50).length;
  if (opts < 5) out.push(`${opts} bowling options (5 advised)`);
  if (ps.filter(p => p.nat !== 'AUS').length > OVERSEAS_MAX) out.push('Too many overseas');
  const un = ps.filter(p => !isAvailable(p));
  if (un.length) out.push(`${un.map(p => p.last).join(', ')} unavailable (auto-replaced)`);
  return out;
}
function renderXIEditor() {
  const f = ui.xiFmt, auto = game.autoXI[f];
  const xiIds = auto ? autoXI(U(), f).order : game.userXI[f];

  const avgO = Math.round(mean(xiIds.map(id => overall(P(id), f))));
  const rows = xiIds.map((id, i) => { const p = P(id); return playerRow(p, { n: i + 1, fmt: f, sub: `${ROLES[p.role].short} · bat ${Math.round(batRating(p, f))}${canBowl(p) && bowlRating(p, f) >= 45 ? ' · bowl ' + Math.round(bowlRating(p, f)) : ''}${p.sk.keep >= 45 ? ' · keeps' : ''}`,
    end: auto ? `${statusChip(p)}${pill(overall(p, f))}` : `${isAvailable(p) ? '' : statusChip(p)}<button class="btn icon sm" onclick="event.stopPropagation();moveXI('${id}',-1)">↑</button><button class="btn icon sm" onclick="event.stopPropagation();moveXI('${id}',1)">↓</button><button class="btn icon sm ghost" onclick="event.stopPropagation();dropXI('${id}')">✕</button>` }); }).join('');
  return `<div class="flex wrap">${fmtSeg(f, 'setXIFmt')}<span class="grow"></span><span class="switch ${auto ? 'on' : ''}" onclick="toggleAutoXI('${f}')"><i></i>Staff pick</span></div><div style="height:8px"></div>
    ${issues.length ? `<div class="note warn" style="margin-bottom:8px">${issues.map(esc).join(' · ')}</div>` : ''}
    ${panel(`${FORMATS[f].name} XI · avg ${avgO}`, `<div class="rows">${rows}</div>`, { flush: true, end: auto ? `<button class="link" onclick="toggleAutoXI('${f}')">Edit ▸</button>` : `<button class="btn sm" ${xiIds.length >= 11 ? 'disabled' : ''} onclick="benchSheet('${f}')">+ Add</button><button class="btn sm ghost" onclick="resetXI('${f}')">Reset</button>` })}
    <div class="xs dim" style="margin-top:6px">${auto ? 'Staff pick the best available XI before every match. Switch off to set your own order.' : 'Your order is the batting order. Unavailable players are swapped like-for-like on match day.'}</div>`;
}

    <div class="xs dim" style="margin-top:8px">Cap space ${money(capSpace(U()))}</div><div id="cMsg"></div>`,
    { foot: `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="submitContract('${id}','${mode}')">Make offer</button>` });
}
function submitContract(id, mode) {
  const sal = Math.round((+$('cSal').value || 0) / 5000) * 5000, yrs = +$('cYrs').value;
  const r = mode === 'sign' ? signFreeAgent(id, sal, yrs) : extendPlayer(id, sal, yrs);
  if (!r.ok) { $('cMsg').innerHTML = `<div class="note bad" style="margin-top:8px">${esc(r.reason)}</div>`; return; }
  closeModal(); flash(mode === 'sign' ? 'Signed.' : 'Extension agreed.'); autosave(); render();
}
function confirmRelease(id) {
  const p = P(id);
  confirmSheet(`Release ${esc(pname(p))}`, game.phase === 'season' ? `Leaves ${money(Math.round(p.contract.salary * 0.5 / 5000) * 5000)} of dead money on your cap this season.` : 'He becomes a free agent.', 'Release', `doRelease('${id}')`);
}
function doRelease(id) { const r = releasePlayer(id); flash(r.ok ? 'Player released.' : r.reason); autosave(); render(); }

// §23 PLAYER PROFILE ------------------------------------------------------------------
function showPlayer(id, tab) {
  const p = P(id); if (!p) return;
  tab = tab || 'over';
  const sk = p.sk, own = p.teamId === U();
  const bar = (l, v) => `<div class="sk"><div class="flex"><span class="muted">${l}</span><b>${v}</b></div><div class="meter"><i style="width:${v}%"></i></div></div>`;
  const head = `<div class="flex" style="margin-bottom:10px">${av(p)}<div class="grow"><div class="s">${ROLES[p.role].label} · ${p.age} · ${p.hand === 'L' ? 'LHB' : 'RHB'} · ${BOWL_TYPES[p.bowlType].label}</div><div class="xs muted">${p.retired ? 'Retired' : p.teamId ? teamName(p.teamId) : p.prospect ? 'Draft prospect' : 'Free agent'}${natTag(p)}</div></div>${statusChip(p)}</div>
    <div class="ratings3">${FMT_LIST.map(f => `<div><div class="v">${overall(p, f)}</div><div class="l">${compName(f).toUpperCase()}</div></div>`).join('')}</div><div style="height:10px"></div>
    ${seg([['over','Overview'],['stats','Stats'],['hist','History']], tab, `(t=>showPlayer('${id}',t))`)}<div style="height:10px"></div>`;
  let body;
  if (tab === 'stats') {
    const t = src => `<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>M</th><th>Runs</th><th>Avg</th><th>SR</th><th>100/50</th><th>HS</th><th>W</th><th>Avg</th><th>Econ</th><th>BB</th><th>Ct</th></tr></thead><tbody>${FMT_LIST.map(f => { const s = src[f]; return `<tr><td>${compName(f)}</td><td>${s.m}</td><td>${s.r}</td><td>${fmtNum(batAvgOf(s))}</td><td>${fmtNum(srOf(s), 0)}</td><td>${s.c100}/${s.c50}</td><td>${hsStr(s)}</td><td>${s.w}</td><td>${fmtNum(bowlAvgOf(s))}</td><td>${fmtNum(econOf(s))}</td><td>${bbStr(s)}</td><td>${s.ct}${s.st ? '/' + s.st : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
    body = `<div class="panel"><div class="ph"><h3>This season</h3></div>${t(p.stats.season)}</div><div style="height:8px"></div><div class="panel"><div class="ph"><h3>Career</h3></div>${t(p.stats.career)}</div>`;
  } else if (tab === 'hist') {
    body = `<div class="panel"><div class="rows">${p.hist.slice().reverse().map(h => `<div class="kv"><span>${h.year}–${String(h.year + 1).slice(2)} ${tdot(h.team)}</span><span class="xs">FC ${h.FC.r}r ${h.FC.w}w · OD ${h.OD.r}r ${h.OD.w}w · T20 ${h.T20.r}r ${h.T20.w}w</span></div>`).join('') || '<div class="empty">No completed seasons in this career yet.</div>'}
      <div class="kv"><span>International caps</span><span>Tests ${p.caps.FC} · ODIs ${p.caps.OD} · T20Is ${p.caps.T20}</span></div></div></div>`;
  } else {
    body = `<div class="skills">${bar('Technique', sk.tech)}${bar('Temperament', sk.temp)}${bar('Power', sk.power)}${bar('Bowling', sk.bowl)}${bar('Accuracy', sk.acc)}${bar('Variation', sk.vari)}${bar('Fielding', sk.field)}${bar('Keeping', sk.keep)}${bar('Stamina', sk.stamina)}</div>
      <div class="panel" style="margin-top:10px"><div class="rows">
        <div class="kv"><span>Potential</span><span class="b">${potGrade(p)}</span></div><div class="kv"><span>Form</span><span>${formArrow(p.form)} ${p.form}</span></div>
        <div class="kv"><span>Contract</span><span>${p.contract ? `${money(p.contract.salary)} × ${p.contract.years} yr` : p.retired ? '–' : 'Asking ' + money(askingSalary(p))}</span></div><div class="kv"><span>Market value</span><span>${money(askingSalary(p))}</span></div>
        <div class="kv" style="display:block"><span>Technique${own ? '' : ' (scouting)'}</span><div class="s" style="margin-top:4px">${scoutingHtml(p)}</div></div></div></div>`;
  }
  const acts = [];
  if (own && !p.retired) { acts.push(`<button class="btn" onclick="game.captain='${p.id}';autosave();closeModal();flash('${esc(p.last)} named captain.')">Captain</button>`); if (game.phase === 'season' && p.contract.years <= 1) acts.push(`<button class="btn" onclick="openContract('${p.id}','extend')">Extend</button>`); acts.push(`<button class="btn ghost" onclick="confirmRelease('${p.id}')">Release</button>`); }
  if (!p.teamId && !p.retired && !p.prospect) acts.push(`<button class="btn pri" onclick="openContract('${p.id}','sign')">Offer contract</button>`);
  if (p.teamId && !own && !p.retired) acts.push(`<button class="btn" onclick="ui.tradePartner='${p.teamId}';ui.tradeGet=['${p.id}'];ui.officeTab='trades';closeModal();go('office')">Explore trade</button>`);
  sheet(p.retired ? 'Retired' : p.teamId ? teamDef(p.teamId).nick : 'Free agent', esc(pname(p)), head + body, { foot: acts.join('') });
}

// §24 MATCH DAY + LIVE MATCH ---------------------------------------------------------------
function renderMatchday() {
  const fx = fixtureById(game.pendingFx), fmt = COMPS[fx.comp].fmt;
  const opp = fx.home === U() ? fx.away : fx.home, v = teamDef(fx.home);
  const mine = selectXI(U(), fmt), theirs = selectXI(opp, fmt);
  const pre = previewConditions(fx), pt = PITCHES[pre.cond.pitch];
  const xi = s => `<div class="rows">${s.order.map((id, i) => { const p = P(id); return `<div class="row tap" style="padding:5px 12px" onclick="showPlayer('${id}')"><span class="n">${i + 1}</span><div class="grow ell s">${esc(pshort(p))}${id === s.captain ? ' <span class="dim">(c)</span>' : ''}${id === s.keeper ? ' <span class="dim">†</span>' : ''}</div><span class="xs dim">${ROLES[p.role].short}</span>${pill(overall(p, fmt))}</div>`; }).join('')}</div>`;
  const avgO = s => Math.round(mean(s.order.map(id => overall(P(id), fmt))));
  const setPlans = theirs.order.filter(id => game.plans[id]).length;
  const scouted = game.scoutedFx[fx.id];
  const wx = pre.cond.days.map((d, i) => chip(d.sky === 'rain' || d.sky === 'showers' ? 'warn' : d.sky === 'overcast' ? 'info' : '', `${fmt === 'FC' ? 'D' + (i + 1) + ' ' : ''}${SKIES[d.sky].label}${d.lost ? ' −' + d.lost : ''}`)).join(' ');
  return `${pageTitle('Match day', `${COMPS[fx.comp].name} · ${fx.stage === 'league' ? 'Round ' + fx.round : fx.round} · ${dateStr(fx.day)}`)}
  <div class="grid">
    ${panel('', `<div class="hero">${badge(fx.home, true)}<div class="mid"><div class="comp">${FORMATS[fmt].name} · ${fmt === 'FC' ? '4 days' : (pre.overs || FORMATS[fmt].overs) + ' overs'}</div><div class="vs ell">${teamDef(fx.home).nick} v ${teamDef(fx.away).nick}</div><div class="meta">${v.ground}</div></div>${badge(fx.away, true)}</div>
      <div class="flex wrap" style="margin-top:10px;gap:5px"><span class="chip">${pt.label}</span>${wx}</div>
      <div class="xs muted" style="margin-top:6px">${pt.note}</div>
      ${pre.notes.length ? `<div class="note warn" style="margin-top:8px">${pre.notes.map(esc).join(' ')}</div>` : ''}
      ${mine.replaced && mine.replaced.length ? `<div class="note" style="margin-top:8px">${mine.replaced.map(([o, n]) => `${esc(o.last)} out, ${esc(n.last)} in.`).join(' ')}</div>` : ''}
      <div style="margin-top:10px">${tacticGrid(fmt)}</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button class="btn" onclick="plansSheet()">Bowling plans · ${setPlans}/11</button><button class="btn" onclick="ui.squadTab='xi';ui.xiFmt='${fmt}';go('squad')">Edit XI</button></div>
      <div class="grid" style="grid-template-columns:1fr 2fr;gap:6px;margin-top:6px">${pre.abandoned ? `<button class="btn pri" style="grid-column:span 2" onclick="quickSimUser()">Confirm abandonment</button>` : `<button class="btn" onclick="quickSimUser()">Quick sim</button><button class="btn pri" onclick="startLive()">Play live ▸</button>`}</div>`)}
    <div class="grid" style="grid-template-columns:1fr 1fr">${panel(`${teamDef(U()).id} · ${avgO(mine)}`, xi(mine), { flush: true })}${panel(`${opp} · ${avgO(theirs)}`, xi(theirs), { flush: true, end: scouted ? chip('good', 'Scouted') : `<button class="link" onclick="scoutOpposition('${fx.id}','${opp}')">Scout</button>` })}</div>
  </div>`;
}
function planSelect(batterId, key, fmt, rerender) {
  const cur = (game.plans[batterId] || game.defaultPlan[fmt])[key];
  const o = key === 'line' ? PLAN_LINES : PLAN_LENGTHS;
  return sel(Object.keys(o).map(k => [k, o[k].label]), cur, `setPlan('${batterId}','${key}',this.value,'${fmt}',${rerender ? 1 : 0})`, 'full');
}
function setPlan(id, key, val, fmt, rerender) {
  const base = game.plans[id] || Object.assign({}, game.defaultPlan[fmt]);
  base[key] = val; game.plans[id] = base; autosave();
  if (rerender) render();
}
function plansSheet() {
  const fx = fixtureById(game.pendingFx), fmt = COMPS[fx.comp].fmt, opp = fx.home === U() ? fx.away : fx.home;
  const theirs = selectXI(opp, fmt), scouted = game.scoutedFx[fx.id];
  sheet(`Bowling plans · ${teamName(opp)}`, 'Plan each batter', `<div class="xs muted" style="margin-bottom:8px">Target weaknesses for more wickets. Batters read a plan the longer you stay with it. Accuracy and variation decide execution.</div>
    ${theirs.order.map((id, i) => { const p = P(id); return `<div class="panel" style="margin-bottom:6px"><div class="pb"><div class="flex"><span class="n dim xs b">${i + 1}</span><div class="grow ell"><span class="b">${esc(pname(p))}</span> <span class="xs dim">${ROLES[p.role].short} · bat ${Math.round(batRating(p, fmt))}</span></div></div>
      <div class="xs" style="margin:4px 0 6px">${scoutingHtml(p)}</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:6px">${planSelect(id, 'line', fmt)}${planSelect(id, 'len', fmt)}</div></div></div>`; }).join('')}`,
    { foot: scouted ? `<button class="btn pri" onclick="closeModal();render()">Done</button>` : `<button class="btn" onclick="scoutOpposition('${fx.id}','${opp}');plansSheet()">Scout opposition</button><button class="btn pri" onclick="closeModal();render()">Done</button>` });
}
function scoutOpposition(fxId, opp) {
  if (game.scoutedFx[fxId]) return;
  game.scoutedFx[fxId] = true;
  squadOf(opp).forEach(p => raiseScout(p.id, Math.min(2, scoutLevel(p) + 1)));
  flash(`Analysts have reports on ${teamDef(opp).nick}.`); autosave();
  if (!$('modalRoot').innerHTML) render(); else render();
}
function quickSimUser() {
  const fx = fixtureById(game.pendingFx);
  const M = quickPlay(fx);
  game.pendingFx = null;
  autosave(); go('home');
  if (game.scorecards[fx.id]) { _scFx = fx.id; showScorecard(fx.id, 0); }
  else flash(M.result.text);
}
function startLive() {
  const fx = fixtureById(game.pendingFx);
  if (previewConditions(fx).abandoned) { quickSimUser(); return; }
  const M = createMatch(fx);
  M.live = true;
  const w = doToss(M);
  game.live = M; ui.liveTab = 'comm'; ui.liveInn = null;
  M.notes.forEach(n => M.log.unshift({ cls:'sys', text: n }));
  if (w === U()) {
    go('live');
    sheet('The toss', 'You won the toss', `<p class="s">${esc(PITCHES[M.cond.pitch].label)}. ${esc(PITCHES[M.cond.pitch].note)} Forecast: ${esc(condSummary(M))}</p>`, { foot: `<button class="btn pri" onclick="liveToss('bat')">Bat first</button><button class="btn" onclick="liveToss('bowl')">Bowl first</button>` });
    return;
  }
  const d = tossDecisionAI(M); setTossDecision(M, d);
  M.log.unshift({ cls:'sys', text: `${teamName(w)} won the toss and chose to ${d}.` });
  M.log.unshift({ cls:'sys', text: inningsIntro(M, curInn(M)) });
  autosave(); go('live');
}
function liveToss(d) {
  const M = game.live; setTossDecision(M, d);
  M.log.unshift({ cls:'sys', text: `You won the toss and chose to ${d}.` });
  M.log.unshift({ cls:'sys', text: inningsIntro(M, curInn(M)) });
  closeModal(); autosave(); render();
}
function liveStep(mode) {
  const M = game.live; if (!M || M.done || !M.toss.decision) return;
  if (mode === 'match' || mode === 'innings') M.autoPilot = true;
  let guard = 0, legal = 0;
  const target = { ball: 1, over: 6, five: 30, session: 180 }[mode] || 1e9;
  while (!M.done && guard++ < 6000) {
    const ev = simBall(M);
    if (!ev) continue;
    if (ev.legal) legal++;
    const inn = curInn(M);
    if (mode === 'ball') break;
    if (mode === 'wicket' && ev.wkt) break;
    if ((mode === 'over' || mode === 'five' || mode === 'session') && ((inn.overBalls === 0 && legal >= target) || inn.closed)) break;
    if (mode === 'innings' && inn.closed) break;
  }
  if (mode !== 'match') M.autoPilot = false;
  if (M.done && !M.log.some(e => e.cls === 's')) M.log.unshift({ cls:'s', text: `RESULT: ${M.result.text}.` + (M.potm ? ` Player of the match: ${pname(P(M.potm))}.` : '') });
  ui.liveInn = null;
  autosave(); render();
}
function liveDeclare() {
  const M = game.live, inn = curInn(M);
  if (!inn || inn.bat !== U() || M.fmt !== 'FC' || inn.closed || inn.target) return;
  inn.declared = true; inn.closed = true;
  M.log.unshift({ cls:'sys', text: inningsClosedText(M, inn) });
  closeModal(); render();
}
function finishLive() {
  const M = game.live; if (!M || !M.done) return;
  applyMatch(M);
  const fxId = M.fxId;
  game.live = null; game.pendingFx = null;
  autosave(); go('home');
  if (game.scorecards[fxId]) showScorecard(fxId, 0);
}
function setLiveTab(t) { ui.liveTab = t; render(); }
function setLiveInn(k) { ui.liveInn = +k; render(); }
function captainSheet() {
  const M = game.live, inn = curInn(M);
  if (!inn) return;
  const fmt = M.fmt;
  let plan = '';
  if (!inn.closed && !M.done) {
    const p = P(inn.card[inn.striker].id);
    if (inn.bowl === U()) {
      const pl = planFor(M, inn, p.id);
      const n = (inn.planBalls || {})[p.id + pl.line + pl.len] || 0;
      const tr = ensureTraits(p), m = -((tr[pl.line] || 0) + (tr[pl.len] || 0));
      const read = m > 0 ? Math.round((1 - clamp(1 - n / 70, 0.35, 1)) * 100) : 0;
      plan = `<label class="lbl">Plan for ${esc(p.last)} (on strike)</label><div class="xs" style="margin-bottom:6px">${scoutingHtml(p)}</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:6px">${planSelect(p.id, 'line', fmt)}${planSelect(p.id, 'len', fmt)}</div>${read ? `<div class="xs muted" style="margin-top:4px">He is reading this plan (${read}% after ${n} balls).</div>` : ''}`;
      const ns = P(inn.card[inn.non].id);
      plan += `<label class="lbl" style="margin-top:10px">Plan for ${esc(ns.last)} (non-striker)</label><div class="grid" style="grid-template-columns:1fr 1fr;gap:6px">${planSelect(ns.id, 'line', fmt)}${planSelect(ns.id, 'len', fmt)}</div>`;
    } else plan = `<div class="note">They are bowling <b>${esc(planLabel(planFor(M, inn, p.id)).toLowerCase())}</b> at ${esc(p.last)}.</div>`;
  }
  const canDeclare = fmt === 'FC' && inn.bat === U() && !inn.closed && !inn.target && !M.done;
  sheet('Captain', 'Tactics and plans', `${plan}<div style="height:12px"></div><label class="lbl">Game plan</label>${tacticGrid(fmt)}
    <div class="xs muted" style="margin-top:10px">${esc(condSummary(M))} Today: ${esc(skyOf(M).label)}.</div>`,
    { foot: `${canDeclare ? `<button class="btn danger" onclick="liveDeclare()">Declare</button>` : ''}<button class="btn ghost" onclick="closeModal();liveStep('match')">Sim to result</button><button class="btn pri" onclick="closeModal();render()">Done</button>` });
}
function renderLive() {
  const M = game.live, inn = curInn(M), F = FORMATS[M.fmt];
  if (!inn) return `${pageTitle('Live', 'Waiting for the toss')}<div class="empty">Make your toss decision.</div>`;
  const sc = inn.card[inn.striker], ns = inn.card[inn.non];
  const bw = inn.curBowler || inn.lastBowler, bf = bw ? inn.bw[bw] : null;
  let line2 = `${oversStr(inn.balls)}${M.overs ? '/' + M.overs : F.overs ? '/' + F.overs : ''} ov · RR ${(inn.balls ? inn.runs / (inn.balls / 6) : 0).toFixed(2)}`;
  let line3 = '';
  if (inn.target) { const need = inn.target - inn.runs; line3 = `Need ${Math.max(0, need)}`; if (F.overs) { const bl = mOvers(M) * 6 - inn.balls; line3 += ` from ${bl} · RRR ${(bl ? need / (bl / 6) : 0).toFixed(2)}`; } }
  if (M.fmt === 'FC') { const lead = teamRuns(M, inn.bat) - teamRuns(M, inn.bowl); line3 = `Day ${fcDay(M)} · ${Math.max(0, Math.round((mMaxBalls(M) - M.balls) / 6))} ov left` + (M.innings.length > 1 ? ` · ${lead >= 0 ? 'lead' : 'trail'} ${Math.abs(lead)}` : '') + (inn.target ? ` · need ${Math.max(0, inn.target - inn.runs)}` : ''); }
  const prev = M.innings.slice(0, -1).map(i => `${i.bat} ${inningsLine(i, M.fmt)}`).join(' · ');
  const cls = s => s === 'W' ? 'w' : s === '4' ? 'b4' : s === '6' ? 'b6' : /wd|nb|lb|b/.test(s) ? 'x' : '';
  const bat = (c, on) => { if (!c) return '<div></div>'; const p = P(c.id); return `<div class="${on ? 'on' : ''}" onclick="showPlayer('${c.id}')"><div class="k">${on ? 'Striker' : 'Non-striker'}</div><div class="v ell">${esc(p.last)} ${c.r}<span class="dim xs"> (${c.b})</span></div></div>`; };
  const scoreS = Object.assign(compactScorecard(M), { result: M.done ? M.result : null });
  const body = ui.liveTab === 'card' ? scorecardHtml(scoreS, ui.liveInn, 'setLiveInn') : `<div class="panel"><div class="comm">${M.log.slice(0, 60).map(e => `<div class="cl ${e.cls || ''}">${e.o != null ? `<span class="o">${e.o}.${Math.min(6, e.b)}</span>` : ''}${esc(e.o != null ? e.text.replace(/^\d+\.\d+ /, '') : e.text || '')}</div>`).join('')}</div></div>`;
  const bar = M.done
    ? `<button class="btn pri" style="grid-column:1/-1" onclick="finishLive()">Finish · full scorecard ▸</button>`
    : `<button class="btn" onclick="liveStep('ball')">Ball</button><button class="btn" onclick="liveStep('over')">Over</button><button class="btn" onclick="liveStep('${M.fmt === 'FC' ? 'session' : 'five'}')">${M.fmt === 'FC' ? '30 ov' : '5 ov'}</button><button class="btn" onclick="liveStep('wicket')">Wkt</button><button class="btn" onclick="liveStep('innings')">Inns</button><button class="btn pri" onclick="captainSheet()">Captain</button>`;
  return `<div class="grid">
    ${panel(`${COMPS[M.comp].short} · ${teamDef(M.venue).ground}`, `<div class="score-strip">${badge(inn.bat, true)}<div class="grow"><div class="big">${inn.runs}/${inn.wkts}</div><div class="ov">${line2}</div></div><div class="right"><div class="s b">${esc(line3)}</div><div class="xs muted">${esc(prev)}</div><div class="xs muted">P'ship ${inn.part.r} (${inn.part.b})</div></div></div>
      ${M.done ? `<div class="note good" style="margin-top:10px"><b>${esc(M.result.text)}</b>${M.potm ? ` · POTM ${plink(P(M.potm))}` : ''}</div>` : `<div class="crease">${bat(sc, true)}${bat(ns, false)}<div class="bowl" ${bw ? `onclick="showPlayer('${bw}')"` : ''}><div class="k">Bowler</div><div class="v ell">${bw ? esc(P(bw).last) : '–'} <span class="dim xs">${bf ? `${oversStr(bf.balls)}-${bf.m}-${bf.r}-${bf.w}` : ''}</span></div></div></div>`}
      <div class="balls">${inn.recent.map(s => `<span class="ball ${cls(s)}">${s}</span>`).join('')}</div>${M.fmt !== 'FC' ? `<div style="margin-top:8px">${wormSvg(M.innings, M.fmt)}</div>` : ''}`, { end: `<span class="xs dim">${esc(skyOf(M).label)}</span>` })}
    ${seg([['comm','Commentary'],['card','Scorecard']], ui.liveTab, 'setLiveTab')}${body}
  </div><div class="livebar">${bar}</div>`;
}
