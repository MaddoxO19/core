    Object.keys(inn.bw).forEach(id => { const b = inn.bw[id]; if (b.w >= 3) topPush(R.bb[k], { id, n: pname(P(id)), t: sn(inn.bowl), w: b.w, r: b.r, opp: team, y }, (a, b2) => b2.w - a.w || a.r - b2.r); });
    const parts = (inn.parts || []).slice();
    if (inn.part && inn.part.r > 0 && !inn.allOut) parts.push({ r: inn.part.r, w: inn.wkts + 1, a: inn.card[inn.striker].id, o: inn.card[inn.non].id, unb: true });
    parts.forEach(pt => { if (pt.r >= 80) topPush(R.pt[k], { a: pname(P(pt.a)), b: pname(P(pt.o)), t: team, r: pt.r, w: pt.w, unb: !!pt.unb, opp, y }, (a, b) => b.r - a.r); });
  });
}
// Rolling log of each player's last 15 matches: [fmt, runs, wickets, opponent, intl].
function logMatchForPlayers(M) {
  if (M.abandoned) return;
  const intl = COMPS[M.comp].intl ? 1 : 0;
  [M.home, M.away].forEach(t => {
    const opp = M.home === t ? M.away : M.home;
    const os = teamDef(opp) ? (teamDef(opp).short || teamDef(opp).id) : opp;
    M.xi[t].forEach(id => {
      const p = P(id);
      if (!p || (p.teamId && p.teamId.startsWith('X_'))) return;
      let r = 0, w = 0, batted = false; const inns = [];
      M.innings.forEach(inn => { const c = inn.card.find(x => x.id === id && x.in); if (c) { r += c.r; batted = true; inns.push(c.r + (c.out ? '' : '*')); } if (inn.bw[id]) w += inn.bw[id].w; });
      p.log = p.log || [];
      // [format, match runs (-1 did not bat), wickets, opponent, international, day, innings scores]
      p.log.push([M.fmt, batted ? r : -1, w, os, intl, game.day, inns]);
      if (p.log.length > 15) p.log.shift();
    });
  });
}
function careerLeaders(fmt, scope, stat, n) {
  const ps = Object.values(game.players).filter(p => !(p.teamId || '').startsWith('X_') || scope === 'intl');
  const src = p => scope === 'intl' ? (p.stats.intl ? p.stats.intl[fmt] : null) : p.stats.career[fmt];
  const val = { runs: s => s.r, wkts: s => s.w, avg: s => s.inn >= 20 ? batAvgOf(s) : -1, bavg: s => s.w >= 30 ? -bowlAvgOf(s) : -999, m: s => s.m, c100: s => s.c100 }[stat];
  return ps.map(p => ({ p, s: src(p) })).filter(x => x.s && x.s.m > 0 && val(x.s) > -1 && val(x.s) > -999).sort((a, b) => val(b.s) - val(a.s)).slice(0, n || 10);
}
function teamHonours(teamId) {
  const out = { SHIELD:0, ODC:0, T20C:0 };
  (game.history || []).forEach(h => COMP_ORDER.forEach(c => { if (h.champions[c] === teamId) out[c]++; }));
  COMP_ORDER.forEach(c => { if (game.phase === 'season' && game.season.champions[c] === teamId) out[c]++; });
  return out;
}

// §8f INTERNATIONAL CAREER BOOK -----------------------------------------------
// The existing p.stats.intl[format] is authoritative for player aggregates.
// Only compact national match outcomes and POTM honours need extra persistence.
function trackNationalMatchRecord(M) {
  if (M.abandoned || !COMPS[M.comp].intl) return;
  const records = game.nationalMatchRecords = game.nationalMatchRecords || {};
  const fmt = M.fmt;
  [M.home, M.away].forEach(t => {
    const nat = teamNat(t);
    if (!NATIONS[nat]) return;
    const k = nat + '_' + fmt;
    const r = records[k] = records[k] || { p:0,w:0,l:0,d:0,t:0,nr:0,potm:{} };
    r.p++;
    if (M.result.noResult) r.nr++;
    else if (M.result.winner) r[M.result.winner === t ? 'w' : 'l']++;
    else if (M.result.tie) r.t++;
    else r.d++;
    if (M.potm && P(M.potm) && P(M.potm).nat === nat) {
      r.potm[M.potm] = (r.potm[M.potm] || 0) + 1;
    }
  });
}
function nationalCareerLeaders(nat, fmt, stat, limit) {
  const get = p => p.stats && p.stats.intl && p.stats.intl[fmt];
  const key = { runs:'r', wickets:'w', matches:'m', hundreds:'c100', fifties:'c50', fivefors:'w5' }[stat] || 'r';
  return Object.values(game.players).filter(p => p.nat === nat && get(p) && get(p).m > 0)
    .map(p => ({p,s:get(p),value:get(p)[key] || 0}))
    .sort((a,b) => b.value-a.value || b.s.m-a.s.m || pname(a.p).localeCompare(pname(b.p))).slice(0,limit || 5);
}
function nationalCareerPanel(nat,fmt) {
  const labels={FC:'Tests',OD:'ODIs',T20:'T20Is'};
  const r=(game.nationalMatchRecords||{})[nat+'_'+fmt];
  const summary=r?`${r.p} played · ${r.w} won · ${r.l} lost${r.d?' · '+r.d+' drawn':''}${r.t?' · '+r.t+' tied':''}${r.nr?' · '+r.nr+' no result':''}`:'Results recorded from v0.9.5 onwards';
  const blocks=[['runs','Runs'],['wickets','Wickets'],['matches','Caps'],['hundreds','Centuries']].map(([key,label])=>{
    const rows=nationalCareerLeaders(nat,fmt,key,5);
    return `<div class="national-record-group"><div class="lbl">${label}</div>${rows.map((x,i)=>`<div class="row tap" onclick="showPlayer('${x.p.id}')"><span class="n">${i+1}</span><div class="grow s">${esc(pname(x.p))}<div class="xs dim">${x.s.m} matches${x.p.retired?' · Retired':''}</div></div><span class="b">${x.value.toLocaleString()}</span></div>`).join('')||'<div class="empty">No international appearances yet.</div>'}</div>`;
  }).join('');
  const awards=r?Object.entries(r.potm||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,v])=>{const pl=P(id);return pl?`<div class="kv"><span>${esc(pname(pl))}</span><b>${v}</b></div>`:''}).join(''):'';
  return panel(`${esc(NATIONS[nat])} · ${labels[fmt]} records`,`<div class="xs dim" style="padding:8px 12px">${summary}</div><div class="national-record-grid">${blocks}</div>${awards?`<div class="pb"><div class="lbl">Player of the match awards</div>${awards}</div>`:''}`,{flush:true});
}

function saveRows(set, cat, aus) {

// Merge real rows with this save's entries that would make the table.
function mergedTable(set, cat, aus) {
  const tab = (REAL_RECORDS[set][aus && set !== 'SHIELD' ? 'aus' : 'world'] || {})[cat];
  if (!tab) return null;
  const real = tab.rows.map(r => ({ v: r[0], d: r[1], n: r[2], t: r[3], note: r[4], active: !!r[5], real: true }));
  const mine = saveRows(set, cat, aus);
  const floor = real[real.length - 1].v;
  const merged = real.concat(mine.filter(x => x.v >= floor)).sort((a, b) => b.v - a.v || (a.real ? -1 : 1));
  const top = real[0], beaten = mine.length && mine[0].v > top.v;
  const best = mine[0] ? Object.assign({ rank: merged.indexOf(mine[0]) >= 0 ? merged.indexOf(mine[0]) + 1 : real.filter(r => r.v > mine[0].v).length + 1 }, mine[0]) : null;
  return { tab, rows: merged, best, beaten, top };
}

function checkRealRecords(silent) {

  if (!game.recBroken) { game.recBroken = {}; silent = true; }
  const B = game.recBroken;
  Object.keys(REAL_RECORDS).forEach(set => ['world', 'aus'].forEach(sc => {
    const tabs = REAL_RECORDS[set][sc]; if (!tabs) return;
    Object.keys(tabs).forEach(cat => {
      const m = mergedTable(set, cat, sc === 'aus'); if (!m || !m.beaten) return;
      const key = `${set}_${sc}_${cat}`, cur = m.rows[0], prev = B[key];
      if (prev && prev.n === cur.n && prev.d === cur.d) return;

      if (!isNew || silent) return;
      const what = `${sc === 'aus' ? 'Australian ' : ''}${RR_LABEL[set]} record for ${RR_CATS[cat].toLowerCase()}`;
      addNews('Records', `${cur.n} breaks the ${what}`, `${cur.d}, passing ${m.top.n}'s ${m.top.d}.`);

function seedAuthenticWorld() {
  const created = new Map();
  const add = (rec, nat, tid, source) => {
    const key = nat + ':' + rec.name.trim().toLocaleLowerCase('en');
    if (created.has(key)) return game.players[created.get(key)];
    const parts = rec.name.trim().split(/\s+/);
    const age = rec.q >= 80 ? 29 : 25;
    const p = makePlayer({role:rec.role, q:rec.q + RATING_SHIFT, age, nat, teamId:tid});
    p.first = parts.slice(0,-1).join(' '); p.last = parts[parts.length - 1];
    p.realPlayerId = 'real-' + key.replace(/[^a-z0-9]+/g,'-');
    p.isRealPlayer = true; p.rosterSource = source; p.sourceDate = '2026';
    p.authenticModelled = true; // ratings, role assumptions and age are provisional estimates
    // Do not seed fictional historical careers under a real player's name.
    if (tid && TEAM_DEFS.some(t=>t.id===tid)) p.contract = {salary:MIN_SALARY,years:2};
    else p.contract = null;
    created.set(key,p.id);

  for (const [nat,entries] of Object.entries(AUTHENTIC_ROSTERS.international)) {

function applyMatch(M) {

// How a team's competition actually ended: Champions, Runners-up, Semi-finalist or null (league only).

}

// §10 CALENDAR + CONTINUE LOOP ------------------------------------------------
// The GM's match today. When both his teams play, the longer match (then the national one) comes first,

function userFixtureToday() {

  const dom = clashMode() === 'domestic';

}

function nextDay() {

  let stop = false;
  const rec = game.training === 'fitness' ? 1.25 : 1;
  const phys = {}; TEAM_DEFS.forEach(t => phys[t.id] = 0.85 + staffEff(t.id, 'physio') / 300);
  phys[U()] *= 1 + (facLevel('medical') - 1) * 0.04;

      }

    if (game.day === w.start) { windowStart(w); if (w.squad.some(id => P(id).teamId === U())) stop = true; }
    if (game.day === w.end) windowEnd(w);
  }
  if (game.day % 7 === 0) { weeklyMorale(); checkRealRecords(); }
  if (game.day % 30 === 15) monthlyDevelopment();
  if (game.day === CAL.TRADE_DEADLINE) addNews('League', 'Trade deadline passed', 'No more trades until the off-season. Free agents can still be signed.');
  game.offers = game.offers.filter(o => o.expires >= game.day);
  if (maybeAIOffer()) stop = true;
  if (game.day % 30 === 0) payMonth();
  if (game.day % 7 === 3) weeklyFans();
  expireInbox();
  if (maybeEvent()) stop = true;
  return stop;
}

// ---- Fixture clashes (the GM runs a state side and Australia) ----
// A multi-day match occupies the GM from its first day to its last. Any match of his other team
// that falls inside it is run by the staff, unless he has asked to choose (game.clashMode 'ask').
function matchLen(fx) { return COMPS[fx.comp].fmt === 'FC' ? (fx.comp === 'TEST' ? 5 : 4) : 1; }
// Days a finished match actually took. A Test won on day 3 frees the GM from day 4.
function daysPlayed(M) {

  return M.cond.days.length;
}
function setBusy(fx, M) { if (!fx) return; const n = M ? clamp(daysPlayed(M), 1, matchLen(fx)) : matchLen(fx); game.busy = { team: myTeamOf(fx), from: fx.day, until: fx.day + n - 1, fx: fx.id }; }

function fxLabel(f) { const me = myTeamOf(f); return `${teamDef(me).nick} v ${teamDef(me === f.home ? f.away : f.home).nick} (${COMPS[f.comp].short}, ${dateStr(f.day, { weekday: undefined })})`; }
function busyLabel() {

  const me = myTeamOf(f), d = o => dateStr(o, { weekday: undefined });
  return `${teamDef(me).nick} v ${teamDef(me === f.home ? f.away : f.home).nick} (${COMPS[f.comp].short}, ${b.until > b.from ? d(b.from) + ' to ' + d(b.until) : d(b.from)})`;
}
function myTeamOf(fx) { return isUserTeam(fx.home) ? fx.home : fx.away; }
// game.clashMode: 'intl' (default) internationals take priority, 'domestic' the state side does,
// 'ask' the GM chooses on match day. Whichever match he runs, the other is run by the staff.
function clashMode() { const m = game.clashMode; return m === 'domestic' || m === 'ask' ? m : 'intl'; }
// International-first: a state match that overlaps one of Australia's is handed to the staff.
function yieldsToIntl(fx) { return clashMode() === 'intl' && fx && fx.stage !== 'intl' && !isFinalFx(fx) && clashesWith(fx).some(f => f.stage === 'intl'); }

function staffPlay(fx, why) {

// Main "Continue": sims forward to the next thing that needs the GM.
function continueGame() {
  if (!game) return;

  const pend = game.pendingFx && fixtureById(game.pendingFx);
  if (pend && !pend.result && isClash(pend) && !isFinalFx(pend)) { staffPlay(pend); game.pendingFx = null; }
  else if (pend && !pend.result && yieldsToIntl(pend)) { staffPlay(pend, intlReason(pend)); game.pendingFx = null; }
  else if (pend && !pend.result) { go('matchday'); return; }
  game.pendingFx = null;
  const done = page => { autosave(); go(page); showAwaySummary(); };
  for (let i = 0; i < 400; i++) {
    if (game.busy && game.day > game.busy.until) game.busy = null;
    playAIFixturesToday();
    let ufx, g2 = 0;
    while ((ufx = userFixtureToday()) && g2++ < 6) {

// "While you were away": results of matches the staff ran during a clash.

  const rows = log.map(e => { const f = fixtureById(e.fx), opp = e.team === f.home ? f.away : f.home, won = f.result && f.result.winner === e.team;

// Sim several days, auto-playing the user's matches.

// §11 NATIONAL DUTY, BOARD, AWARDS ---------------------------------------------

  if (!ids || ids.length < 11) ids = recommendSquad(w);

  if (mine.length) game.gm.rep = clamp(game.gm.rep + mine.length, 0, 100);

}
function windowEnd(w) {

    game.season.fixtures.filter(f => f.comp === 'WC' && f.result && (f.home === 'AUS' || f.away === 'AUS')).forEach(f => { if (f.result.winner === 'AUS') w.result.wins++; else if (f.result.winner) w.result.losses++; else w.result.draws++; });

    addNews('National', `World Cup: Australia finish as ${fin.toLowerCase()}`, `${w.result.wins} won, ${w.result.losses} lost. Players return to their states.`);

    w.result = { wins, losses, draws };
    w.squad.map(P).forEach(p => { if (p) p.natDuty = null; });
    const res = wins > losses ? 'win' : wins < losses ? 'lose' : 'draw';
    if (game.nation.gm) { game.nation.conf = clamp(game.nation.conf + (res === 'win' ? 10 : res === 'lose' ? -12 : 0), 0, 100); game.nation.history.unshift({ year: game.year, label: w.label, opp: w.opp, wins, losses, draws }); }
    addNews('National', `Australia ${res} the ${w.label.toLowerCase()} against ${NATIONS[w.opp]}`, `${wins} won, ${losses} lost${draws ? ', ' + draws + ' drawn' : ''}. Players return to their states.${game.nation.gm ? ' National board confidence: ' + game.nation.conf + '.' : ''}`);
    if (game.nation.gm && game.nation.conf < 20) { game.nation.gm = false; addNews('National', 'Removed as national selector', 'After a poor run of results Cricket Australia has replaced you as national selector.'); }
    return;
  }
  const sq = w.squad.map(P);
  const aus = mean(sq.map(p => overall(p, w.fmt)).sort((a, b) => b - a).slice(0, 11));
  const opp = NATION_STRENGTH[w.opp] + randn() * 2;
  let wins = 0, losses = 0, draws = 0;
  for (let i = 0; i < w.matches; i++) {
    const pw = 1 / (1 + Math.exp(-(aus - opp) / 4));
    if (w.fmt === 'FC' && rand() < 0.22) draws++;
    else if (rand() < pw) wins++; else losses++;
  }
  w.result = { wins, losses, draws };
  sq.forEach(p => {
    p.natDuty = null;
    if (p.retired) return;
    p.caps[w.fmt] += randInt(Math.ceil(w.matches / 2), w.matches);
    p.fitness = clamp(p.fitness - randInt(4, 10), 50, 100);
    p.form = clamp(p.form + randInt(-8, 10), 15, 92);
  });
  const res = wins > losses ? 'win' : wins < losses ? 'lose' : 'draw';
  addNews('National', `Australia ${res} the series against ${NATIONS[w.opp]}`, `Final tally: ${wins} won, ${losses} lost${draws ? ', ' + draws + ' drawn' : ''}. National players return to their states.`);
}

function teamStrength(teamId) {
  const sq = squadOf(teamId);
  return mean(FMT_LIST.map(f => mean(autoXI(teamId, f, sq).order.map(id => overall(P(id), f)))));
}
function strengthRank(teamId) {
  return TEAM_DEFS.map(t => ({ id: t.id, s: teamStrength(t.id) })).sort((a, b) => b.s - a.s).findIndex(x => x.id === teamId) + 1;
}
function makeObjectives(teamId) {
  const r = strengthRank(teamId);
  if (r <= 2) return [
    { type:'trophy', text:'Win at least one trophy' },
    { type:'ladder', comp:'SHIELD', pos:2, text:'Finish top two in the Shield' },
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' }];
  if (r <= 4) return [
    { type:'ladder', comp:'T20C', pos:4, text:'Reach the T20 finals' },
    { type:'ladder', comp:'SHIELD', pos:3, text:'Finish top three in the Shield' },
    { type:'ladder', comp:'ODC', pos:3, text:'Finish top three in the One-Day Cup' }];
  return [
    { type:'ladder', comp:'T20C', pos:5, text:'Finish top five in the T20 Championship' },
    { type:'ladder', comp:'SHIELD', pos:4, text:'Finish top four in the Shield' },
    { type:'wins', count:9, text:'Win at least 9 matches across all formats' }];
}
function objectiveStatus(o) {
  if (o.type === 'trophy') return COMP_ORDER.some(c => game.season.champions[c] === U());
  if (o.type === 'ladder') return ladderPos(o.comp, U()) <= o.pos;
  if (o.type === 'wins') return game.season.userWins >= o.count;
  return false;
}
function evaluateBoard() {
  const b = game.board; const lines = [];
  let delta = 0;
  b.objectives.forEach(o => { const ok = objectiveStatus(o); delta += ok ? 12 : -11; lines.push({ text: o.text, ok }); game.gm.rep = clamp(game.gm.rep + (ok ? 1 : -2), 0, 100); });
  const trophies = COMP_ORDER.filter(c => game.season.champions[c] === U()).length;
  delta += trophies * 8;
  const pay = payroll(U());
  if (pay > SALARY_CAP) { delta -= 10; lines.push({ text: 'Stay under the salary cap', ok: false }); }
  if (game.fin) {
    const L = game.fin.ledger, profit = income(L) - spend(L);
    const ok = profit >= 0;
    delta += ok ? 5 : profit < -500000 ? -12 : -6;
    lines.push({ text: `Run the club at a profit (${profit >= 0 ? '+' : ''}${money(Math.round(profit))})`, ok });
    if (game.fin.cash < 0) { delta -= 15; lines.push({ text: 'Keep the club out of debt', ok: false }); }
  }
  b.confidence = clamp(b.confidence + delta, 0, 100);
  const fired = b.confidence < 20;
  return { lines, delta, trophies, confidence: b.confidence, fired };
}

function seasonImpact(p, fmt) {
  const s = p.stats.season[fmt];
  if (!s.m) return 0;
  if (fmt === 'FC') return s.r + s.w * 22 + s.ct * 3;
  if (fmt === 'OD') return s.r * 1.05 + s.w * 25 + (s.b > 100 ? (srOf(s) - 85) * 1.2 : 0);
  return s.r * 1.15 + s.w * 27 + (s.b > 80 ? (srOf(s) - 135) * 1.0 : 0) - (s.bb > 60 ? (econOf(s) - 8.3) * 12 : 0);
}
function computeAwards() {
  const ps = Object.values(game.players).filter(p => !p.retired && p.teamId);
  const top = (fn, filter) => { const arr = ps.filter(filter || (() => true)).map(p => ({ p, v: fn(p) })).sort((a, b) => b.v - a.v); return arr[0] && arr[0].v > 0 ? { id: arr[0].p.id, name: pname(arr[0].p), team: arr[0].p.teamId, v: Math.round(arr[0].v) } : null; };
  const total = p => seasonImpact(p, 'FC') + seasonImpact(p, 'OD') * 1.4 + seasonImpact(p, 'T20') * 1.5;
  const a = { poy: top(total), young: top(total, p => p.age <= 23), best: {}, runs: {}, wkts: {} };
  FMT_LIST.forEach(f => {
    a.best[f] = top(p => seasonImpact(p, f));
    a.runs[f] = top(p => p.stats.season[f].r);
    a.wkts[f] = top(p => p.stats.season[f].w);
  });
  return a;
}

// International season awards are scored from recorded scorecards only (not cumulative
// career totals or ratings). Background fixtures without scorecards are excluded.
function computeIntlSeasonAwards() {
  const tracked = {};
  let sampled = 0;
  for (const fx of game.season.fixtures) {
    if (!fx.result || !(fx.stage === 'intl' || fx.stage === 'world' || fx.stage === 'wtcfinal' || fx.comp === 'WC' || fx.event)) continue;
    const card = game.scorecards[fx.id];
    if (!card || !Array.isArray(card.innings) || !card.innings.length) continue;
    sampled++;
    const fmt = card.fmt;
    if (!['FC','OD','T20'].includes(fmt)) continue;
    const appearances = new Set();
    for (const inn of card.innings) {
      for (const b of (inn.card || [])) if (b.in && P(b.id)) {
        appearances.add(b.id);
        const r = tracked[b.id] || (tracked[b.id] = { id:b.id, m:0, runs:0, wickets:0, per:{} });
        const f = r.per[fmt] || (r.per[fmt] = {m:0,runs:0,wickets:0});
        r.runs += b.r || 0; f.runs += b.r || 0;
      }
      for (const b of (inn.bw || [])) if (P(b.id) && b.balls) {
        appearances.add(b.id);
        const r = tracked[b.id] || (tracked[b.id] = { id:b.id, m:0, runs:0, wickets:0, per:{} });
        const f = r.per[fmt] || (r.per[fmt] = {m:0,runs:0,wickets:0});
        r.wickets += b.w || 0; f.wickets += b.w || 0;
      }
    }
    for (const id of appearances) { const r = tracked[id]; r.m++; r.per[fmt] = r.per[fmt] || {m:0,runs:0,wickets:0}; r.per[fmt].m++; }
  }
  const rows = Object.values(tracked), eligible = rows.filter(x => x.m >= 2);
  const best = (arr, fn) => arr.length ? arr.slice().sort((a,b) => fn(b) - fn(a))[0] : null;
  const byFmt = f => eligible.filter(x => x.per[f] && x.per[f].m >= 2);
  const impact = x => x.runs + x.wickets * 27;
  const winners = { overall:best(eligible,impact),young:best(eligible.filter(x => P(x.id).age <= 23),impact),bat:best(eligible,x=>x.runs),bowl:best(eligible,x=>x.wickets) };
  for (const f of ['FC','OD','T20']) winners[f] = best(byFmt(f),x=>x.per[f].runs+x.per[f].wickets*27);
  const leaders = {};
  for (const f of ['FC','OD','T20']) {
    const relevant=rows.filter(x=>x.per[f] && x.per[f].m);
    const r=best(relevant,x=>x.per[f].runs), w=best(relevant,x=>x.per[f].wickets);
    leaders[f]={runs:r?{id:r.id,value:r.per[f].runs}:null,wickets:w?{id:w.id,value:w.per[f].wickets}:null};
  }
  return {year:game.year,sampled,winners:Object.fromEntries(Object.entries(winners).map(([k,v])=>[k,v?{id:v.id}:null])),leaders};
}

// §12 TRADES, CONTRACTS, FREE AGENCY ---------------------------------------------
function payroll(teamId) { return squadOf(teamId).reduce((a, p) => a + (p.contract ? p.contract.salary : 0), 0) + (teamId === U() ? game.deadMoney : 0); }
function capSpace(teamId) { return SALARY_CAP - payroll(teamId); }
function overseasCount(teamId) { return squadOf(teamId).filter(p => p.nat !== 'AUS').length; }
function freeAgents() { return Object.values(game.players).filter(p => !p.retired && !p.teamId && !p.prospect && !p.academy); }

function groupNeeds(teamId, removeIds, addIds) {
  removeIds = removeIds || []; addIds = addIds || [];
  const sq = squadOf(teamId).filter(p => !removeIds.includes(p.id)).concat(addIds.map(P));
  const avgO = mean(sq.map(peakOvr));
  const need = {};
  Object.keys(IDEAL_GROUPS).forEach(g => {
    const n = sq.filter(p => group(p) === g && peakOvr(p) >= avgO - 6).length;
    need[g] = clamp((IDEAL_GROUPS[g] - n) / IDEAL_GROUPS[g], 0, 1);
  });
  return need;
}
function tradeCheck(partner, giveIds, getIds) {
  const msgs = [];
  const giveSal = giveIds.reduce((a, id) => a + P(id).contract.salary, 0);
  const getSal = getIds.reduce((a, id) => a + P(id).contract.salary, 0);
  if (payroll(U()) - giveSal + getSal > SALARY_CAP) msgs.push('This would put you over the salary cap.');
  if (payroll(partner) - getSal + giveSal > SALARY_CAP) msgs.push(`${teamName(partner)} cannot fit the incoming salary under their cap.`);
  const uSize = squadOf(U()).length - giveIds.length + getIds.length;
  const pSize = squadOf(partner).length - getIds.length + giveIds.length;
  if (uSize < SQUAD_MIN || uSize > SQUAD_MAX) msgs.push(`Your squad would have ${uSize} players (allowed ${SQUAD_MIN}–${SQUAD_MAX}).`);
  if (pSize < SQUAD_MIN || pSize > SQUAD_MAX) msgs.push(`${teamName(partner)} would have ${pSize} players.`);
  const os = (ids) => ids.filter(id => P(id).nat !== 'AUS').length;
  if (overseasCount(U()) - os(giveIds) + os(getIds) > OVERSEAS_MAX) msgs.push('You would exceed the overseas player limit.');
  if (overseasCount(partner) - os(getIds) + os(giveIds) > OVERSEAS_MAX) msgs.push(`${teamName(partner)} would exceed the overseas limit.`);
  return msgs;
}
// AI judges a trade by value, weighted by what it needs and what it loses.
function evaluateTrade(partner, giveIds, getIds) {
  if (!giveIds.length || !getIds.length) return { accept: false, reason: 'A trade needs at least one player each way.' };
  const msgs = tradeCheck(partner, giveIds, getIds);
  if (msgs.length) return { accept: false, reason: msgs.join(' ') };
  const needNow = groupNeeds(partner);
  const needAfter = groupNeeds(partner, getIds, []);
  const inV = giveIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needNow[group(P(id))]), 0);
  const outV = getIds.reduce((a, id) => a + tradeValue(P(id)) * (1 + 0.45 * needAfter[group(P(id))]), 0);
  const ratio = inV / Math.max(0.1, outV);
  if (ratio >= 1.08) return { accept: true, ratio, reason: `${teamName(partner)} accept. They rate the package at ${Math.round(ratio * 100)}% of what they give up.` };
  const short = ratio >= 0.9 ? 'Close, but they want a little more.' : ratio >= 0.7 ? 'They see a clear gap in value.' : 'Not interested at that price.';
  return { accept: false, ratio, reason: `${short} (${Math.round(ratio * 100)}% of the value they need.)` };
}
function tradeWindowOpen() { return game.phase !== 'season' ? game.phase === 'freeagency' : game.day <= CAL.TRADE_DEADLINE; }
function executeTrade(partner, giveIds, getIds) {
  giveIds.forEach(id => { const p = P(id); p.teamId = partner; removeFromUserXI(id); });
  getIds.forEach(id => { P(id).teamId = U(); P(id).transferListed = false; P(id).wantsOut = null; });
  giveIds.forEach(id => { P(id).transferListed = false; P(id).wantsOut = null; });
  const txt = `Traded ${giveIds.map(id => pname(P(id))).join(', ')} to ${teamName(partner)} for ${getIds.map(id => pname(P(id))).join(', ')}.`;
  logTx(txt); addNews('Trade', 'Trade completed', txt);
  if (giveIds.includes(game.captain)) game.captain = null;
}
function removeFromUserXI(id) { FMT_LIST.forEach(f => game.userXI[f] = (game.userXI[f] || []).filter(x => x !== id)); }

function maybeAIOffer() {
  if (!tradeWindowOpen() || game.phase !== 'season' || game.offers.length >= 2 || rand() > (squadOf(U()).some(p=>p.transferListed) ? 0.18 : 0.05)) return false;
  const partner = pick(TEAM_DEFS.filter(t => t.id !== U())).id;
  const need = groupNeeds(partner);
  const g = Object.keys(need).sort((a, b) => need[b] - need[a])[0];
  const targets = squadOf(U()).filter(p => !p.injury && !p.natDuty).sort((a, b) => (b.transferListed ? 1 : 0) - (a.transferListed ? 1 : 0) || (group(a) === g ? -1 : 0) - (group(b) === g ? -1 : 0) || tradeValue(b) - tradeValue(a));
  if (!targets.length) return false;
  const target = targets[Math.min(targets.length - 1, randInt(0, 2))];
  const want = tradeValue(target) * (1 + 0.45 * need[g]) * 1.05;
  const cands = squadOf(partner).filter(p => group(p) !== g && !p.injury).sort((a, b) => tradeValue(b) - tradeValue(a));
  const pkg = []; let sum = 0;
  for (const c of cands) {
    if (sum >= want * 0.95 || pkg.length >= 2) break;
    const v = tradeValue(c);
    if (sum + v <= want * 1.3) { pkg.push(c.id); sum += v; }
  }
  if (!pkg.length || sum < want * 0.85) return false;
  if (tradeCheck(partner, [target.id], pkg).length) return false;
  game.offers.push({ id: 'o' + game.day + '_' + randInt(100, 999), from: partner, want: [target.id], give: pkg, expires: game.day + 7 });
  addNews('Trade', `${teamName(partner)} make an offer`, `They want ${pname(target)} and are offering ${pkg.map(id => pname(P(id))).join(' and ')}. The offer expires in a week. Review it in the Office.`);
  return true;
}

function signingAsk(p) { return askingSalary(p); }
// Fills the user's squad from free agency. Minimum-salary deals are allowed over the cap
// so a squad can always reach SQUAD_MIN.
function autoFillSquad(target) {
  const signed = [];
  let guard = 0;
  while (squadOf(U()).length < target && guard++ < 30) {
    const need = groupNeeds(U());
    const room = capSpace(U());
    const underMin = squadOf(U()).length < SQUAD_MIN;
    const cand = freeAgents().filter(p => (p.nat === 'AUS' || overseasCount(U()) < OVERSEAS_MAX) && (askingSalary(p) <= room || (underMin && askingSalary(p) <= MIN_SALARY * 1.5)))
      .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
    if (!cand) break;
    const sal = askingSalary(cand.p) <= room ? askingSalary(cand.p) : MIN_SALARY;
    cand.p.teamId = U(); cand.p.contract = { salary: sal, years: 1 };
    signed.push(cand.p);
    logTx(`Signed ${pname(cand.p)} (${money(sal)} × 1 yr) to fill the squad.`);
  }
  if (signed.length) addNews('Signing', `${signed.length} player${signed.length > 1 ? 's' : ''} signed to fill the squad`, signed.map(pname).join(', ') + '.');
  return signed;
}
function contractDecision(p, salary, years) {
  const ask = signingAsk(p);
  if (years < 1 || years > 4) return { ok: false, reason: 'Contracts run 1 to 4 years.' };
  if (p.age >= 33 && years > 2) return { ok: false, reason: `${p.last} wants a shorter deal at this stage of his career.` };
  const repAdj = 1 - (game.gm.rep - 35) / 400;
  const per = ensurePersona(p);
  const own = p.teamId === U();
  const adj = (per === 'ambitious' ? 1.1 : 1) * (per === 'loyal' && own ? 0.9 : 1) * (own && p.morale < 45 ? 1.15 : 1);
  if (own && p.wantsOut) return { ok: false, reason: `${p.last} has asked for a trade and will not discuss a new deal.` };
  if (salary < ask * 0.95 * repAdj * adj) return { ok: false, reason: `${p.last} is asking for around ${money(Math.round(ask * adj / 5000) * 5000)} a season.` };
  return { ok: true };
}
function signFreeAgent(id, salary, years) {
  const p = P(id);
  if (squadOf(U()).length >= SQUAD_MAX) return { ok: false, reason: `Squad is full (${SQUAD_MAX}). Release someone first.` };
  if (salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space.' };
  if (p.nat !== 'AUS' && overseasCount(U()) >= OVERSEAS_MAX) return { ok: false, reason: `You already have ${OVERSEAS_MAX} overseas players.` };
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  p.teamId = U(); p.contract = { salary, years };
  logTx(`Signed ${pname(p)} (${money(salary)} × ${years} yr${years > 1 ? 's' : ''}).`);
  addNews('Signing', `${pname(p)} signs with ${teamName(U())}`, `${ROLES[p.role].label}, ${p.age}. ${money(salary)} a season for ${years} year${years > 1 ? 's' : ''}.`);
  return { ok: true };
}
function releasePlayer(id) {
  const p = P(id);
  if (squadOf(U()).length <= SQUAD_MIN) return { ok: false, reason: `You need at least ${SQUAD_MIN} contracted players.` };
  if (game.phase === 'season') game.deadMoney += Math.round(p.contract.salary * 0.5 / 5000) * 5000;
  p.teamId = null; p.contract = null; p.transferListed = false; p.wantsOut = null;
  removeFromUserXI(id);
  if (game.captain === id) game.captain = null;
  logTx(`Released ${pname(p)}.`);
  return { ok: true };
}
function extendPlayer(id, salary, years) {
  const p = P(id);
  const d = contractDecision(p, salary, years);
  if (!d.ok) return d;
  if (salary - p.contract.salary > capSpace(U())) return { ok: false, reason: 'Not enough cap space for the raise.' };
  p.contract = { salary, years: p.contract.years + years };
  logTx(`Extended ${pname(p)} (${money(salary)}, now ${p.contract.years} yrs).`);
  return { ok: true };
}

// AI teams fill squads from free agency using a need-aware score.
function aiFreeAgency() {
  TEAM_DEFS.forEach(t => {
    if (t.id === U()) return;
    let sq = squadOf(t.id);
    while (sq.length > SQUAD_MAX || (payroll(t.id) > SALARY_CAP && sq.length > SQUAD_MIN)) {
      const w = sq.sort((a, b) => tradeValue(a) / a.contract.salary - tradeValue(b) / b.contract.salary)[0];
      w.teamId = null; w.contract = null; sq = squadOf(t.id);
    }
    let guard = 0;
    while (sq.length < 20 && guard++ < 10) {
      const need = groupNeeds(t.id);
      const cand = freeAgents().filter(p => askingSalary(p) <= capSpace(t.id) && (p.nat === 'AUS' || overseasCount(t.id) < OVERSEAS_MAX))
        .map(p => ({ p, s: tradeValue(p) * (1 + need[group(p)]) })).sort((a, b) => b.s - a.s)[0];
      if (!cand) break;
      cand.p.teamId = t.id; cand.p.contract = { salary: askingSalary(cand.p), years: randInt(1, 2) };
      sq = squadOf(t.id);
    }
  });
}

// §13 OFF-SEASON ------------------------------------------------------------------
function endSeason() {
  archiveAssociateQualification();
  game.phase = 'review';
  settleSeasonFinances();
  const awards = computeAwards();
  const intlAwards = computeIntlSeasonAwards();
  game.intlSeasonHonours = game.intlSeasonHonours || [];
  game.intlSeasonHonours.unshift(intlAwards);
  game.intlSeasonHonours = game.intlSeasonHonours.slice(0, 30);
  const board = evaluateBoard();
  const finish = {}, outcome = {}; COMP_ORDER.forEach(c => { finish[c] = ladderPos(c, U()); outcome[c] = compOutcome(c, U()); });
  game.history.unshift({ year: game.year, label: game.season.label, champions: Object.assign({}, game.season.champions), awards, team: U(), finish, outcome, record: [game.season.userWins, game.season.userLosses] });
  game.gm.seasons++;
  Object.values(game.players).forEach(p => {
    if (p.retired) return;
    const s = p.stats.season, tot = s.FC.m + s.OD.m + s.T20.m;
    if (tot) p.hist.push({ year: game.year, team: p.teamId, FC: { m: s.FC.m, r: s.FC.r, w: s.FC.w }, OD: { m: s.OD.m, r: s.OD.r, w: s.OD.w }, T20: { m: s.T20.m, r: s.T20.r, w: s.T20.w } });
  });
  game.offseason = { awards, intlAwards, board, dev: null, expiring: [], draft: null, jobOffers: [] };
  if (board.fired) {
    game.gm.fired = true;
    game.offseason.jobOffers = TEAM_DEFS.filter(t => t.id !== U()).map(t => t.id).sort(() => rand() - 0.5).slice(0, 2);
    addNews('Club', 'The board has terminated your contract', `Board confidence fell to ${board.confidence}. Two states have offered you a role.`);
  } else addNews('Club', 'Season review', `Board confidence is now ${board.confidence} (${board.delta >= 0 ? '+' : ''}${board.delta}).`);
}
function acceptJob(teamId) {
  game.gm.teamId = teamId; game.gm.fired = false; game.gm.rep = clamp(game.gm.rep - 4, 0, 100);
  game.gm.jobs.push({ teamId, from: game.year + 1 });
  game.board = { confidence: 55, objectives: [] };
  game.userXI = { FC:[], OD:[], T20:[] }; game.autoXI = { FC:true, OD:true, T20:true }; game.captain = null; game.deadMoney = 0;
  game.offseason.jobOffers = [];
  addNews('Club', `${game.gm.name} joins ${teamName(teamId)}`, 'A fresh start, with a new board and a new squad.');
}

// Random squads can come out batting-heavy or bowling-heavy, which skews a whole career's scoring.
// After generation, nudge batting and bowling skills league-wide so the gap between each side's top
// seven batters and top five bowlers sits at the level the engine is calibrated for.
const LEAGUE_BAT_BOWL_GAP = -0.45; // median of freshly generated worlds
function balanceLeague() {
  const gap = mean(FMT_LIST.map(f => mean(TEAM_DEFS.map(t => {
    const xi = autoXI(t.id, f).order.map(P);
    return mean(xi.slice(0, 7).map(p => batRating(p, f))) - mean(xi.filter(canBowl).map(p => bowlRating(p, f)).sort((a, b) => b - a).slice(0, 5));
  }))));
  const d = clamp(gap - LEAGUE_BAT_BOWL_GAP, -6, 6) / 2;
  if (Math.abs(d) < 0.25) return;
  Object.values(game.players).filter(p => TEAM_DEFS.some(t => t.id === p.teamId) || (!p.teamId && !p.prospect)).forEach(p => {
    ['tech','temp','power','rot'].forEach(k => p.sk[k] = clamp(p.sk[k] - d, 15, 99));
    if (canBowl(p) && p.sk.bowl > 35) ['bowl','acc','vari','death'].forEach(k => p.sk[k] = clamp(p.sk[k] + d, 15, 99));
  });
}
function developPlayer(p) {
  const cur = peakOvr(p), head = p.pot - cur;
  let g;
  if (p.age <= 20) g = 2 + rand() * 4;
  else if (p.age <= 23) g = 1 + rand() * 3.5;
  else if (p.age <= 26) g = rand() * 2.5 - 0.3;
  else if (p.age <= 29) g = rand() * 1.6 - 0.8;
  else if (p.age <= 31) g = -0.8 - rand() * 1.6;
  else if (p.age <= 33) g = -1.5 - rand() * 2;
  else g = -2.5 - rand() * 2.5;
  const s = p.stats.season, played = s.FC.m + s.OD.m + s.T20.m;
  if (g > 0 && played >= 12) g += 0.6;
  if (p.age <= 22 && rand() < 0.06) g += 4;
  if (g > 0) g = head <= 0 ? 0 : Math.min(g, Math.max(0.3, head * 0.5));
  if (g > 0 && p.teamId === U()) g *= 1 + (facLevel('training') - 1) * 0.05;
  let batM = 1, bowlM = 1;
  if (p.teamId && teamDef(p.teamId) && !teamDef(p.teamId).intl) {
    const hm = 0.9 + staffEff(p.teamId, 'head') / 500;
    batM = hm * (0.85 + staffEff(p.teamId, 'bat') / 300);
    bowlM = hm * (0.85 + staffEff(p.teamId, 'bowl') / 300);
  }
  if (p.teamId === U()) {
    if (game.training === 'batting') { batM *= 1.35; bowlM *= 0.7; }
    else if (game.training === 'bowling') { batM *= 0.7; bowlM *= 1.35; }
    else if (game.training === 'fitness') { batM *= 0.85; bowlM *= 0.85; p.sk.stamina = clamp(p.sk.stamina + 2, 15, 99); }
  }
  const grp = group(p);
  const focus = DEV_FOCUS[p.focus || 'none'].skills;
  const prof = ensurePersona(p) === 'professional' && g > 0 ? 1.1 : 1;
  const bs = staffSpec(p.teamId, 'bat'), ws = staffSpec(p.teamId, 'bowl');
  const specK = k => g <= 0 ? 1 : ((bs === 'technique' && (k === 'tech' || k === 'temp')) || (bs === 'power' && k === 'power') ? 1.1 : 1) * (['bowl','acc','vari','death'].includes(k) && ws ? (ws === (isSpin(p) ? 'spin' : 'pace') ? 1.12 : 0.92) : 1);
  const bump = (k, m) => { const fm = g > 0 ? (focus.length ? (focus.includes(k) ? 1.6 : 0.85) : 1) : 1; p.sk[k] = clamp(Math.round(p.sk[k] + g * m * fm * prof * specK(k) * (0.7 + rand() * 0.6)), 15, 99); };
  if (g > 0 && focus.length) focus.forEach(k => { if (k === 'keep' && grp !== 'WK') bump('keep', 0.8); if (k === 'stamina') bump('stamina', 0.8); if (['bowl','acc','vari'].includes(k) && grp === 'BAT') bump(k, 0.7); });
  const bat = ['tech','temp','power','rot'], bowl = ['bowl','acc','vari','death'];
  if (grp === 'BAT' || grp === 'WK') bat.forEach(k => bump(k, g > 0 ? batM : 1));
  if (grp === 'WK') bump('keep', 1);
  if (grp === 'AR') { bat.forEach(k => bump(k, g > 0 ? batM : 1)); if (canBowl(p)) bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); }
  if (grp === 'PACE' || grp === 'SPIN') { bowl.forEach(k => bump(k, g > 0 ? bowlM : 1)); if (isPace(p) && p.age >= 31) p.sk.bowl = clamp(p.sk.bowl - 1, 15, 99); }
  bump('field', 0.6);
  if (g < 0) p.sk.stamina = clamp(p.sk.stamina - randInt(0, 2), 15, 99);
  if (p.age >= 27) p.pot = Math.max(peakOvr(p), p.pot - 1);
  p.pot = Math.max(p.pot, peakOvr(p));

}
function retires(p) {
  const o = peakOvr(p);
  let ch = 0;
  if (p.age >= 33) ch = 0.12 + (p.age - 33) * 0.16;
  if (p.age >= 31 && o < 62 + RATING_SHIFT) ch += 0.25;
  if (!p.teamId && p.age >= 30) ch += 0.3;
  if (p.age >= 38) ch = 1;
  return rand() < ch;
}
function runDevelopment() {
  const rep = { up: [], down: [], retired: [] };
  Object.values(game.players).forEach(p => {
    if (p.retired || p.prospect) return;
    p.age++;
    const d = developPlayer(p);
    if (p.teamId === U()) { if (d >= 2) rep.up.push([p.id, d]); else if (d <= -2) rep.down.push([p.id, d]); }
    p.form = Math.round(50 + (p.form - 50) * 0.3); p.fitness = 100; p.injury = null; p.natDuty = null;
    if (retires(p)) {
      const wasMine = p.teamId === U();
      rep.retired.push({ id: p.id, team: p.teamId, mine: wasMine });
      p.retired = true; p.teamId = null; p.contract = null; removeFromUserXI(p.id);
      if (game.captain === p.id) game.captain = null;

  rep.up.sort((a, b) => b[1] - a[1]); rep.down.sort((a, b) => a[1] - b[1]);
  game.offseason.dev = rep;
  const mine = rep.retired.filter(r => r.mine).map(r => pname(P(r.id)));
  addNews('League', `${rep.retired.length} players retire`, mine.length ? `From your squad: ${mine.join(', ')}.` : 'None from your squad.');
}
function processContracts() {
  const expiring = [];
  Object.values(game.players).forEach(p => {
    if (p.retired || !p.teamId || !p.contract) return;
    p.contract.years--;
    if (p.contract.years > 0) return;
    if (p.teamId === U()) { const per = ensurePersona(p); expiring.push({ id: p.id, ask: Math.round(askingSalary(p) * (p.morale < 50 ? 1.15 : 1) * (per === 'loyal' ? 0.9 : per === 'ambitious' ? 1.1 : 1) / 5000) * 5000, years: p.age >= 32 ? 1 : 2, status: 'pending' }); return; }
    const ask = askingSalary(p);
    const keep = playerValueScore(p) > 0.12 && p.age <= 33 && rand() < 0.8 && payroll(p.teamId) - p.contract.salary + ask <= SALARY_CAP;
    if (keep) p.contract = { salary: ask, years: randInt(1, 3) };

function resignExpiring(id) {

  if (!e) return;
  const p = P(id);
  const others = payroll(U()) - p.contract.salary;
  if (others + e.ask > SALARY_CAP) { flash('Not enough cap space to re-sign him at that price.'); return; }
  p.contract = { salary: e.ask, years: e.years }; e.status = 'signed';

}

    const p = P(e.id); p.teamId = null; p.contract = null; removeFromUserXI(p.id); if (game.captain === p.id) game.captain = null;
    logTx(`${pname(p)} left as a free agent.`);
  });
}

function setupDraft() {
  game.offseason.academy = academyIntake();
  for (let i = 0; i < 18; i++) makeProspect();
  const score = id => COMP_ORDER.reduce((a, c) => a + ladderPos(c, id) + (game.season.champions[c] === id ? -2 : 0), 0);
  const order = TEAM_DEFS.map(t => t.id).sort((a, b) => score(b) - score(a));
  game.offseason.draft = { order: [...order, ...order], pick: 0, picks: [] };
  addNews('Draft', 'Rookie draft order set', `${teamName(order[0])} hold the first pick. Two rounds, twelve picks.`);
}
function draftPool() { return Object.values(game.players).filter(p => p.prospect && !p.teamId && !p.retired); }

function makeDraftPick(teamId, id) {
  const d = game.offseason.draft;
  if (id) {
    const p = P(id);
    p.teamId = teamId; p.prospect = false; p.contract = { salary: ROOKIE_SALARY, years: 2 };
    d.picks.push({ n: d.pick + 1, team: teamId, id });
    if (teamId === U()) { logTx(`Drafted ${pname(p)} with pick ${d.pick + 1}.`); addNews('Draft', `${pname(p)} drafted`, `${ROLES[p.role].label}, ${p.age}. Scouts rate his potential ${potGrade(p)}.`); }
  } else d.picks.push({ n: d.pick + 1, team: teamId, id: null });

function aiDraftChoice(teamId) {
  if (squadOf(teamId).length >= SQUAD_MAX || capSpace(teamId) < ROOKIE_SALARY) return null;
  const need = groupNeeds(teamId);
  const c = draftPool().map(p => ({ p, s: p.pot * 0.65 + peakOvr(p) * 0.35 + need[group(p)] * 8 + rand() * 3 })).sort((a, b) => b.s - a.s)[0];

function runDraftUntilUser(autoUser) {
  const d = game.offseason.draft;

    const t = d.order[d.pick];
    if (t === U() && !autoUser) return false;
    makeDraftPick(t, aiDraftChoice(t));
  }
  // Leftover prospects: the best few become free agents, the rest go back to club cricket.
  (game.offseason.academy || []).forEach(id => { const p = P(id); if (p && !p.teamId) delete game.players[id]; });
  game.offseason.academy = [];
  draftPool().sort((a, b) => b.pot - a.pot).forEach((p, i) => {
    if (i < 4) p.prospect = false; else delete game.players[p.id];
  });

function startNewSeason() {
  Object.values(game.players).forEach(p => { p.stats.season = blankStats3(); p.natDuty = null; });
  game.year++;
  game.season = buildSeason(game.year);
  rolloverWtc(game.year);
  game.day = 0; game.scorecards = {}; game.pendingFx = null; game.offers = []; game.live = null;
  if (game.fin) game.fin.ledger = blankLedger();
  Object.values(game.players).forEach(p => { p.rest = false; p.noTalksUntil = null; });
  FMT_LIST.forEach(f => game.userXI[f] = (game.userXI[f] || []).filter(id => P(id) && P(id).teamId === U()));
  if (game.captain && (!P(game.captain) || P(game.captain).teamId !== U())) game.captain = null;
  if (!game.captain) { const c = squadOf(U()).sort((a, b) => (peakOvr(b) + b.age * 0.6) - (peakOvr(a) + a.age * 0.6))[0]; game.captain = c ? c.id : null; }
  game.board.objectives = makeObjectives(U());
  Object.keys(game.nation.rankings).forEach(n => { if (n !== 'AUS') game.nation.rankings[n] += Math.round(randn() * 3); });
  game.phase = 'season'; game.offseason = null;
  addNews('League', `${game.season.label} season begins`, 'New fixtures are out and the board has set fresh objectives.');
}

function offseasonContinue() {
  switch (game.phase) {
    case 'review':
      if (game.gm.fired) { flash('Choose your next job first.'); return; }
      runDevelopment(); game.phase = 'development'; break;
    case 'development':
      processContracts(); staffOffseason(); game.phase = 'contracts'; break;
    case 'contracts':
      if ((game.offseason.expiring || []).some(e => e.status === 'pending')) { flash('Resolve every expiring player contract before continuing.'); return; }
      if ((game.offseason.expiringStaff || []).some(e => e.status === 'pending')) { flash('Resolve expiring staff contracts before continuing.'); return; }
      finaliseExpiring(); finaliseExpiringStaff(); setupDraft(); game.phase = 'draft';
      runDraftUntilUser(false); break;
    case 'draft':
      if (draftOnClock() === U()) { flash('You are on the clock. Pick a player or pass.'); return; }
      if (runDraftUntilUser(false)) { aiFreeAgency(); game.phase = 'freeagency'; addNews('League', 'Free agency open', 'Unsigned players are available. Trades are open again.'); }
      break;
    case 'freeagency':
      if (squadOf(U()).length < SQUAD_MIN) autoFillSquad(SQUAD_MIN);
      aiFreeAgency(); startNewSeason(); break;
  }
  autosave(); go('home');
}
function userDraftPick(id) {
  if (draftOnClock() !== U()) return;
  if (id && squadOf(U()).length >= SQUAD_MAX) { flash('Your squad is full. Pass or release a player.'); return; }
  makeDraftPick(U(), id);
  if (runDraftUntilUser(false)) { aiFreeAgency(); game.phase = 'freeagency'; addNews('League', 'Free agency open', 'Unsigned players are available. Trades are open again.'); }

}

// Saves go to IndexedDB (large, durable) with a localStorage mirror. If the browser
// keeps neither (private mode, some file previews), the game says so and the player
// can export the career to a file and import it later.
const Store = {
  db: null, idbOk: false, lsOk: false, status: 'unknown', lastSaved: null, lastError: null,
  async init() {
    try { localStorage.setItem('__mmc_test', '1'); this.lsOk = localStorage.getItem('__mmc_test') === '1'; localStorage.removeItem('__mmc_test'); } catch (e) { this.lsOk = false; }
    try {
      this.db = await new Promise((res, rej) => {
        if (!window.indexedDB) return rej(new Error('no idb'));
        const r = indexedDB.open('minime_cricket', 1);
        r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('saves')) db.createObjectStore('saves'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('idb timeout')), 3000);
      });
      this.idbOk = true;
    } catch (e) { this.idbOk = false; }
    this.status = this.idbOk || this.lsOk ? 'ok' : 'none';
    if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) {} }
    return this.status;
  },
  _tx(mode, fn) { return new Promise((res, rej) => { const tx = this.db.transaction('saves', mode); const st = tx.objectStore('saves'); const r = fn(st); tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); }); },
  async put(slot, str, meta) {
    let ok = false;
    if (this.idbOk) { try { await this._tx('readwrite', st => { st.put(str, 'slot' + slot); st.put(meta, 'meta' + slot); }); ok = true; } catch (e) { this.lastError = String(e); } }
    if (this.lsOk) {
      try { localStorage.setItem(SAVE_PREFIX + 'meta' + slot, JSON.stringify(meta)); } catch (e) {}
      try { localStorage.setItem(SAVE_PREFIX + slot, str); ok = true; } catch (e) { if (!ok) this.lastError = 'Browser storage is full.'; try { localStorage.removeItem(SAVE_PREFIX + slot); } catch (e2) {} }
    }
    if (ok) this.lastSaved = new Date();
    return ok;
  },
  async get(slot) {
    if (this.idbOk) { try { const v = await this._tx('readonly', st => st.get('slot' + slot)); if (v) return v; } catch (e) {} }
    if (this.lsOk) { try { return localStorage.getItem(SAVE_PREFIX + slot); } catch (e) {} }
    return null;
  },
  async meta(slot) {
    if (this.idbOk) { try { const v = await this._tx('readonly', st => st.get('meta' + slot)); if (v) return v; } catch (e) {} }
    if (this.lsOk) {
      try { const m = localStorage.getItem(SAVE_PREFIX + 'meta' + slot); if (m) return JSON.parse(m); } catch (e) {}
      try { const raw = localStorage.getItem(SAVE_PREFIX + slot); if (raw) return metaOf(JSON.parse(raw)); } catch (e) {}
    }
    return null;
  },
  async del(slot) {
    if (this.idbOk) { try { await this._tx('readwrite', st => { st.delete('slot' + slot); st.delete('meta' + slot); }); } catch (e) {} }
    if (this.lsOk) { try { localStorage.removeItem(SAVE_PREFIX + slot); localStorage.removeItem(SAVE_PREFIX + 'meta' + slot); } catch (e) {} }
  },
  async list() { const out = []; for (let i = 1; i <= SAVE_SLOTS; i++) out.push(await this.meta(i)); return out; }
};
function metaOf(g) { return { name: g.gm.name, team: g.gm.teamId, label: g.season.label, phase: g.phase, day: g.day, year: g.year, wins: g.gm.wins, losses: g.gm.losses, build: g.meta.build, saved: g.meta.saved || null, edited: !!g.edited }; }
// Stat lines are mostly zeros, so saves keep only the non-zero fields and mark the line with z:1.
// loadFromString puts the zeros back before the game reads them.
function packStats(v) { const o = { z: 1 }; for (const k in v) if (v[k]) o[k] = v[k]; return o; }
function isStatLine(v) { return v && typeof v === 'object' && !Array.isArray(v) && 'bbr' in v && 'inn' in v && 'w5' in v; }
function unpackStats(o) {

  if (o.z === 1) { const s = blankStats(); for (const k in o) if (k !== 'z') s[k] = o[k]; return s; }

let _saving = Promise.resolve();
function saveGame(slot, notify) {

  const str = serialiseGame(), meta = metaOf(game);

function exportSave() {

  a.href = URL.createObjectURL(blob);

    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();

function teamCrest(id, compact) { const src = DOMESTIC_CRESTS[id]; return src ? `<img class="domestic-crest ${compact ? 'compact' : ''}" src="${src}" alt="" aria-hidden="true" loading="eager">` : ''; }
function badge(id, lg) { const t=teamDef(id); if(!t) return '<span class="badge">?</span>'; if (!t.intl && DOMESTIC_CRESTS[id]) return `<span class="badge domestic-crest-badge ${lg ? 'lg' : ''}" title="${esc(t.name || id)}">${teamCrest(id, false)}</span>`; const nat=t.intl ? (id==='AUS' ? 'AUS' : id.slice(2)) : null; const symbol=t.intl ? `<span class="team-flag">${flagFor(nat)}</span>` : esc(t.short || t.id); return `<span class="badge ${lg ? 'lg' : ''} ${t.intl ? 'nation-badge' : ''}" style="${t.intl ? '' : 'border-color:'+t.color}" title="${esc(t.name || id)}">${symbol}</span>`; }
function tdot(id) { const t=teamDef(id); if(!t) return '<span class="dim">FA</span>'; return t.intl ? `${nationTag(id==='AUS' ? 'AUS' : id.slice(2))} ${esc(t.short || id)}` : DOMESTIC_CRESTS[id] ? `${teamCrest(id,true)}${esc(t.short || id)}` : `<span class="dot" style="background:${t.color}"></span>${esc(t.short || id)}`; }
function av(p) { return `<span class="av">${p.first[0]}${p.last[0]}</span>`; }
function plink(p, txt) { return p ? `<span class="link" style="font-size:inherit;color:inherit" onclick="event.stopPropagation();showPlayer('${p.id}')">${natTag(p)} ${esc(txt || pname(p))}</span>` : '–'; }

function flagFor(n) { n = n === 'X_ENG' ? 'ENG' : n === 'X_WI' ? 'WI' : n; const src=LEGACY_FLAG_ASSETS[n]; return src ? `<img class="legacy-flag" alt="" draggable="false" src="${src}">` : '🌐'; }
function nationTag(n) { return '<span class="nat-flag" title="' + esc(NATIONS[n] || n) + '">' + flagFor(n) + '</span>'; }
function countNum(n) { return Number.isFinite(Number(n)) ? Number(n).toLocaleString('en-AU', { maximumFractionDigits: 0 }) : esc(String(n == null ? '–' : n)); }
// Flags only where they tell you something: overseas players, and every player on the international pages.
function natTag(p) {
  if (!p || !p.nat) return '';
  const home = !p.teamId ? 'AUS' : p.teamId.startsWith('X_') ? p.teamId.slice(2) : 'AUS';
  if (p.nat === home && !['intl', 'natsel'].includes(ui.page)) return '';
  return ' <span class="nat-flag" title="' + esc(NATIONS[p.nat] || p.nat) + '">' + flagFor(p.nat) + '</span>';
}

// Drag the sheet header (or the top of the body when it is scrolled to the top) down to close.
function sheetSwipe(el) {
  if (!el) return;
  const head = el.querySelector('.sheet-h'), bodyEl = el.querySelector('.sheet-b');
  let y0 = null, dy = 0;
  const start = e => { if (e.currentTarget === bodyEl && bodyEl.scrollTop > 0) return; y0 = e.touches[0].clientY; dy = 0; el.style.transition = 'none'; };
  const move = e => { if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { el.style.transform = `translateY(${dy}px)`; if (e.cancelable) e.preventDefault(); } else if (e.currentTarget === bodyEl) { y0 = null; el.style.transform = ''; } };
  const end = () => { if (y0 == null) return; y0 = null; el.style.transition = 'transform .15s'; if (dy > 90) closeModal(); else el.style.transform = ''; };
  [head, bodyEl].forEach(t => { if (!t) return; t.addEventListener('touchstart', start, { passive: true }); t.addEventListener('touchmove', move, { passive: false }); t.addEventListener('touchend', end); t.addEventListener('touchcancel', end); });
}

// Dashboard notifications are UI-only: dismissing one never resolves the underlying
// trade, injury, selection or board issue. Notices are scoped to save and season.
function homeNotices() {
  const sq = squadOf(U());
  const notices = [];
  const add = (id, title, description, action, destination, count) => notices.push({
    id: `${id}:${count == null ? '' : count}`, title, description, action, destination
  });
  const inj = sq.filter(p => p.injury), duty = sq.filter(p => p.natDuty);
  const tired = sq.filter(p => !p.injury && !p.natDuty && p.fitness < 75);
  if (game.offers.length) add('offers', `${game.offers.length} trade offer${game.offers.length===1?'':'s'}`, 'Review incoming offers before deciding.', true, 'offers', game.offers.length);
  if (openInbox().length) add('inbox', `${openInbox().length} inbox decision${openInbox().length===1?'':'s'}`, 'Open your inbox to review outstanding decisions.', true, 'inbox', openInbox().length);
  if (sq.some(p=>p.wantsOut)) add('requests', 'Player trade request', 'Review player concerns in the dressing room.', true, 'requests', sq.filter(p=>p.wantsOut).length);
  if (game.nation.gm && game.season.windows.some(w=>w.selecting)) add('national', 'Australia squad selection', 'Select the national squad for the upcoming window.', true, 'national');
  const myFinal = game.season.fixtures.find(f => isFinalFx(f) && !f.result && (f.home===U() || f.away===U()));
  if (myFinal) add('final', `${COMPS[myFinal.comp].short} final coming up`, `v ${teamDef(myFinal.home===U()?myFinal.away:myFinal.home).nick} · ${dateStr(myFinal.day)}`, true, `final:${myFinal.comp}`, myFinal.id);
  const vacant = STAFF_ORDER.filter(r=>!staffIn(U(),r));
  if (vacant.length) add('staff', `${vacant.length} staff vacanc${vacant.length===1?'y':'ies'}`, 'Review club staffing.', true, 'staff', vacant.length);
  if (sq.length < SQUAD_MIN) add('short', `Squad short: ${sq.length}/${SQUAD_MIN}`, 'Review free agents and squad depth.', true, 'short', sq.length);
  if (inj.length) add('injuries', `${inj.length} player${inj.length===1?'':'s'} injured`, 'View injury status and recovery dates.', false, 'injuries', inj.map(p=>`${p.id}:${p.injury.until}`).sort().join(','));
  if (duty.length) add('duty', `${duty.length} with Australia`, 'These players are unavailable during international duty.', false, 'duty', duty.map(p=>p.id).sort().join(','));
  if (tired.length) add('fitness', `${tired.length} below 75% fitness`, 'Consider resting players before their next match.', false, 'fitness', tired.map(p=>p.id).sort().join(','));
  return notices;
}

function noticeDismiss(index) {

// H³O custom cricket roles: original inline SVGs; no emoji, remote assets, or gameplay state.
// Role governs the icon; bowling type only distinguishes pace from spin.
function cricketRoleIcon(p) {
  if (!p) return '';
  const role = p.role || '';
  const group = ROLES[role] ? ROLES[role].group : 'BAT';
  const kind = group === 'WK' ? 'keeper' : group === 'AR' ? 'allrounder' : group === 'PACE' ? 'pace' : group === 'SPIN' ? 'spin' : 'batter';
  const paths = {
    batter: '<g transform="rotate(-32 12 12)"><rect x="9" y="2.2" width="6" height="12" rx="1.8"/><path d="M10.5 14.2v6.6h3v-6.6"/></g>',
    keeper: '<path d="M5 19V9.3a1.5 1.5 0 0 1 3 0V5.5a1.5 1.5 0 0 1 3 0V4a1.5 1.5 0 0 1 3 0v2a1.5 1.5 0 0 1 3 0v5l1.7-1.4a1.8 1.8 0 0 1 2.4 2.4l-4 6.2c-.8 1.2-2.2 1.8-3.8 1.8H9c-2.2 0-4-1-4-3Z"/><path d="M7 18h10"/>',
    pace: '<circle cx="14.5" cy="12" r="6"/><path d="M12.5 6.4c5 4 6 8 4 11M1.8 7.5h5M1 12h5.4M2.5 16.5h4.2"/>',
    spin: '<circle cx="11.7" cy="13" r="5.5"/><path d="M9.5 8c4.5 3 5.5 6 4.3 10M4.5 6.5a10 10 0 0 1 14-1M18.5 3.5l.6 3.8-3.8-.2M19.6 9.8c2.8 5.5-.2 10.1-5.7 11"/>',
    allrounder: '<g transform="rotate(-27 9 12)"><rect x="5" y="3" width="5.7" height="11" rx="1.6"/><path d="M6.5 14v6h2.7v-6"/></g><circle cx="17.6" cy="15.3" r="4.4"/><path d="M16 11.2c3 2.8 4 5 3 8"/>'
  };
  const label = ({batter:'Batter',keeper:'Wicketkeeper',pace:'Pace bowler',spin:'Spin bowler',allrounder:'All-rounder'})[kind];
  return `<span class="cricket-role-icon cricket-role-${kind}" role="img" aria-label="${label}" title="${label}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${paths[kind]}</svg></span>`;
}

function intlSeasonAwardsHtml(a) {
  if (!a || !a.sampled) return '<div class="empty">No complete international match scorecards available for this season.</div>';
  const labels = [['overall','International player of the year'],['FC','Test player of the year'],['OD','ODI player of the year'],['T20','T20I player of the year'],['young','Young international player'],['bat','International batter'],['bowl','International bowler']];
  const rows = labels.map(([key,title]) => {
    const item = a.winners[key];
    return `<div class="kv"><span>${title}</span><span>${item && P(item.id) ? `${plink(P(item.id), pname(P(item.id)))}` : '<span class="dim">Insufficient data</span>'}</span></div>`;
  });
  for (const fmt of ['FC','OD','T20']) {
    for (const [k,label] of [['runs','runs'],['wickets','wickets']]) {
      const item = a.leaders[fmt] && a.leaders[fmt][k];
      rows.push(`<div class="kv"><span>${fmt === 'FC' ? 'Test' : fmt === 'OD' ? 'ODI' : 'T20I'} ${label}</span><span>${item && P(item.id) ? `${plink(P(item.id), pname(P(item.id)))} · ${item.value}` : '<span class="dim">—</span>'}</span></div>`);
    }
  }
  return `<div class="rows">${rows.join('')}</div><div class="xs muted pb">Based on ${a.sampled} completed international scorecards retained this season. Awards require at least two recorded appearances.</div>`;
}

function negotiate(id, mode) {

function negSheet() {

  const body = `<div class="flex" style="margin-bottom:10px"><div class="grow"><div class="b">${esc(pname(p))}</div><div class="xs muted">${p.age} · ${ROLES[p.role].label} · best ${peakOvr(p)} · potential ${potGrade(p)} · ${PERSONAS[ensurePersona(p)].label}</div></div>${pill(peakOvr(p))}</div>

    <div class="kv" style="padding:6px 0"><span>Market value</span><span>${money(askingSalary(p))}</span></div>
    <div class="kv" style="padding:6px 0"><span>Cap space</span><span>${money(capSpace(U()) + (n.mode !== 'sign' && p.contract ? p.contract.salary : 0))}</span></div>
    <div class="neglog">${n.log.map(l => `<div class="${l.startsWith('You:') ? 'me' : ''}">${esc(l)}</div>`).join('')}</div>

      <div class="xs dim" style="margin-top:6px">Patience: ${'●'.repeat(Math.max(0, n.patience))}${'○'.repeat(Math.max(0, 4 - n.patience))}. Lowball offers use up patience twice as fast.</div>`}`;
  sheet(n.mode === 'sign' ? 'Contract talks' : n.mode === 'resign' ? 'Re-signing talks' : 'Extension talks', esc(pname(p)), body,
    { foot: n.done ? `<button class="btn pri" onclick="finishNeg()">${n.done === 'agreed' ? 'Sign the deal' : 'Close'}</button>` : `<button class="btn ghost" onclick="game.neg=null;closeModal()">Walk away</button><button class="btn" onclick="negOffer(true)">Accept ${money(n.ask)}</button><button class="btn pri" onclick="negOffer(false)">Make offer</button>` });
}
function negOffer(acceptAsk) {
  const n = game.neg; if (!n) return;
  const sal = acceptAsk ? n.ask : +$('nSal').value || 0, yrs = acceptAsk ? n.years : +$('nYrs').value;
  negotiationOffer(sal, yrs); negSheet();
}

  const sq = intl ? Object.values(game.players).filter(p => p.teamId === id && !p.retired) : squadOf(id);
  const fmtR = f => { const xi = autoXI(id, f, sq).order; return xi.length ? Math.round(mean(xi.map(x => overall(P(x), f)))) : 0; };
  const best = (f, key) => sq.slice().sort((a, b) => (key === 'bat' ? batRating(b, f) - batRating(a, f) : bowlRating(b, f) - bowlRating(a, f)))[0];
  let body = `<div class="team-hero" style="--tc:${t.color}">${badge(id, true)}<div><div class="b" style="font-size:18px">${esc(t.name)}</div><div class="xs muted">${esc(t.nick !== t.name ? t.nick + ' · ' : '')}${esc(t.ground)}</div></div></div>`;

      <div class="panel" style="margin-top:8px"><div class="rows">
        <div class="kv"><span>Honours in this career</span><span>${COMP_ORDER.map(c => `${COMPS[c].short} ${H[c]}`).join(' · ')}</span></div>

        <div class="kv"><span>Best batter (Shield)</span><span>${best('FC', 'bat') ? plink(best('FC', 'bat')) : '–'}</span></div>
        <div class="kv"><span>Best bowler (Shield)</span><span>${best('FC', 'bowl') ? plink(best('FC', 'bowl')) : '–'}</span></div>
        ${FMT_LIST.map(f => { const r = top(f, 'r'), w = top(f, 'w'); return r || w ? `<div class="kv"><span>${compName(f)} leaders</span><span class="s">${r ? `${plink(r)} ${r.stats.season[f].r}r` : ''}${w ? ` · ${plink(w)} ${w.stats.season[f].w}w` : ''}</span></div>` : ''; }).join('')}</div></div>
      ${recent.length ? `<div class="panel" style="margin-top:8px"><div class="ph"><h3>Recent results</h3></div><div class="rows">${recent.map(f => { const r = f.result.winner === id ? 'W' : f.result.winner ? 'L' : 'D'; const opp = f.home === id ? f.away : f.home; return `<div class="row ${game.scorecards[f.id] ? 'tap' : ''}" ${game.scorecards[f.id] ? `onclick="showScorecard('${f.id}')"` : ''}><span class="res ${r}">${r}</span><div class="stack"><div class="main-t ell s">${chip(f.comp, COMPS[f.comp].short)} v ${teamDef(opp).nick}</div><div class="sub-t ell">${esc(f.result.summary)}</div></div></div>`; }).join('')}</div></div>` : ''}`;

function renderLegacyRecords() {

  if (mode === 'save') return `${top}<div style="height:8px"></div>${renderRecords()}`;
  const set = ui.rrSet || 'TEST', aus = set !== 'SHIELD' && ui.rrScope === 'aus';
  const tabs = REAL_RECORDS[set][aus ? 'aus' : 'world'];

  const cat = cats.includes(ui.rrCat) ? ui.rrCat : cats[0];
  const m = mergedTable(set, cat, aus);
  const rows = m.rows.map((x, i) => `<tr class="${x.real ? '' : 'me tap'}" ${x.id ? `onclick="showPlayer('${x.id}')"` : ''}><td class="n2">${i + 1}</td><td class="l"><b>${x.id && P(x.id) ? natTag(P(x.id)) + ' ' : ''}${esc(x.n)}</b> <span class="dim xs">${esc(x.t || '')}</span>${x.real ? '' : ' ' + chip('good', 'This save')}${x.real && m.beaten && x === m.top ? ' ' + chip('', 'Previous record') : ''}<div class="xs dim">${esc(x.note || '')}</div></td><td class="b big">${x.d}</td></tr>`).join('');
  const best = m.best && !m.rows.includes(m.rows.find(r => !r.real)) ? `<div class="note" style="margin-top:8px">Best in this save: <b>${esc(m.best.n)}</b> ${m.best.d}${m.best.note ? ' · ' + esc(m.best.note) : ''}, which would rank ${ordinal(m.best.rank)}.</div>` : !m.best ? '<div class="note" style="margin-top:8px">No one in this save has an entry here yet.</div>' : '';
  const broken = (game.legacyLog || []).slice(0, 8);
  const brokenP = broken.length ? panel(`Records broken · ${broken.length}`, `<div class="rows">${broken.map(e => `<div class="row"><div class="stack"><div class="main-t" style="white-space:normal">${esc(e.text)}</div><div class="sub-t">${e.year}</div></div></div>`).join('')}</div>`, { flush: true }) : '';
  return `${top}<div style="height:8px"></div>
    <div class="tool-row">${seg(Object.keys(REAL_RECORDS).map(k => [k, RR_LABEL[k]]), set, '(v=>{ui.rrSet=v;render();})')}${set === 'SHIELD' ? '' : seg([['world','World'],['aus','Australia']], aus ? 'aus' : 'world', '(v=>{ui.rrScope=v;render();})')}</div>
    <div style="height:8px"></div>${sel(cats.map(c => [c, RR_CATS[c]]), cat, 'ui.rrCat=this.value;render()', 'full')}<div style="height:8px"></div>
    ${panel(`${aus ? 'Australia · ' : ''}${RR_LABEL[set]} · ${RR_CATS[cat]}`, `<table class="tbl rec"><tbody>${rows}</tbody></table>`, { flush: true, end: `<span class="xs dim">as of ${m.tab.asOf}</span>` })}
    ${best}${m.tab.note ? `<div class="xs dim" style="margin-top:6px">${esc(m.tab.note)}</div>` : ''}
    <div class="xs dim" style="margin-top:6px">Real figures: ${RR_SRC}.</div>
    ${brokenP ? `<div style="height:8px"></div>${brokenP}` : ''}`;
}
function renderRecords() {
  const scope = ui.recScope || 'dom', f = ui.recFmt || 'FC', cat = ui.recCat || 'hs';
  const k = scope + '_' + f, R = game.records || { hs:{}, bb:{}, th:{}, tl:{}, pt:{} };
  const fname = scope === 'intl' ? { FC:'Tests', OD:'ODIs', T20:'T20Is' }[f] : compName(f);
  const cats = [['hs','Highest scores'],['bb','Best bowling'],['th','Highest totals'],['tl','Lowest totals'],['pt','Partnerships'],['cr','Career runs'],['cw','Career wickets'],['ch','Career hundreds'],['cm','Most matches']];
  let rows = '';
  const yr = y => `<span class="dim xs">${y}</span>`;
  if (cat === 'hs') rows = (R.hs[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.n)}</b> <span class="dim xs">${x.t}</span><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${countNum(x.r)}${x.no ? '*' : ''}</td><td class="dim">${x.b}b</td></tr>`).join('');
  if (cat === 'bb') rows = (R.bb[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.n)}</b> <span class="dim xs">${x.t}</span><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${x.w}/${x.r}</td><td></td></tr>`).join('');
  if (cat === 'th' || cat === 'tl') rows = (R[cat][k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${x.t}</b><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${countNum(x.r)}${cat === 'th' && x.w < 10 ? '/' + x.w : ''}</td><td></td></tr>`).join('');
  if (cat === 'pt') rows = (R.pt[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.a)}</b> & <b>${esc(x.b)}</b><div class="xs dim">${x.t} v ${x.opp} · ${ordinal(x.w)} wicket · ${x.y}</div></td><td class="b big">${countNum(x.r)}${x.unb ? '*' : ''}</td><td></td></tr>`).join('');
  if (cat[0] === 'c') { const stat = { cr:'runs', cw:'wkts', ch:'c100', cm:'m' }[cat]; rows = careerLeaders(f, scope, stat, 15).map((x, i) => { const s = x.s, v = { cr: s.r, cw: s.w, ch: s.c100, cm: s.m }[cat]; const sub = cat === 'cr' || cat === 'ch' ? `${countNum(s.m)} matches · avg ${fmtNum(batAvgOf(s))}` : cat === 'cw' ? `${countNum(s.m)} matches · avg ${fmtNum(bowlAvgOf(s))}` : `${countNum(s.r)} runs · ${countNum(s.w)} wkts`; return `<tr class="tap" onclick="showPlayer('${x.p.id}')"><td class="n2">${i + 1}</td><td class="l"><b>${esc(pname(x.p))}</b> <span class="dim xs">${scope === 'intl' ? nationTag(x.p.nat) + ' ' + esc(x.p.nat) : (x.p.retired ? 'retired' : tdot(x.p.teamId))}</span><div class="xs dim">${sub}</div></td><td class="b big">${countNum(v)}</td><td></td></tr>`; }).join(''); }
  return `<div class="tool-row">${seg([['dom','Domestic'],['intl','Intl']], scope, 'setRecScope')}${seg(FMT_LIST.map(x => [x, scope === 'intl' ? { FC:'Test', OD:'ODI', T20:'T20I' }[x] : compName(x)]), f, 'setRecFmt')}</div>
    <div style="height:8px"></div>${sel(cats, cat, "ui.recCat=this.value;render()", 'full')}<div style="height:8px"></div>
    ${panel(`${fname} · ${cats.find(c => c[0] === cat)[1]}`, rows ? `<table class="tbl rec"><tbody>${rows}</tbody></table>` : '<div class="empty">No records yet. They build up as matches are played.</div>', { flush: true })}
    <div class="xs dim" style="margin-top:6px">${cat[0] === 'c' ? (scope === 'intl' ? 'International career totals accumulate as matches are simulated.' : 'Domestic career totals may include seeded history.') : 'Match records count from the start of your career.'}</div>`;
}

// Small SVG charts for profiles.
// ---- Form and career charts ----
// Batters: bars are runs per match with guide lines at 50 and 100 and a dashed average.
// Bowlers: bars are wickets per match with guide lines at 3 and 5 and a dashed average.
// A letter under each bar gives the format (gold for internationals); tap a bar for the match.
const FMT_LETTER = { FC: 'S', OD: 'O', T20: 'T' }, INTL_LETTER = { FC: 'Test', OD: 'ODI', T20: 'T20I' };
function isBowlerProfile(p) { return ['PACE', 'SPIN'].includes(group(p)) || p.role === 'BWAR'; }
function formChart(p) {
  const chartFilter = (ui.playerChartFormat || 'ALL');
  const log = (p.log || []).filter(x => chartFilter === 'ALL' || x[0] === chartFilter).slice(-12);
  // Filters only once there is enough cricket to filter: two formats and at least four matches.
  const fmts = new Set((p.log || []).map(x => x[0]));
  if ((p.log || []).length < 4 || fmts.size < 2) { if (chartFilter !== 'ALL') ui.playerChartFormat = 'ALL'; }
  const chartSwitch = `<div class="chart-filters">${[['ALL','All'],['FC','Shield / Test'],['OD','One-Day'],['T20','T20']].map(([k,l]) => `<button class="${chartFilter===k?'on':''}" onclick="ui.playerChartFormat='${k}';showPlayer('${p.id}','over')">${l}</button>`).join('')}</div>`;
  const showSwitch = (p.log || []).length >= 4 && fmts.size >= 2;
  if (!log.length) return `<div class="panel"><div class="pb">${showSwitch ? chartSwitch : ''}<div class="xs dim">No matches yet.</div></div></div>`;
  const bowler = isBowlerProfile(p);
  const W = 320, H = 118, L = 24, top = 8, base = H - 22, bw = (W - L) / 12;
  const val = x => bowler ? x[2] : Math.max(0, x[1]);
  const guides = bowler ? [3, 5] : [50, 100];
  // Batting scale tops out at 160 so the 50 and 100 lines stay readable; taller bars are labelled.
  const max = bowler ? Math.max(6, ...log.map(val)) : clamp(Math.max(...log.map(val)), 110, 160);
  const y = v => base - Math.min(v, max) / max * (base - top);
  const counted = bowler ? log : log.filter(x => x[1] >= 0);
  const avg = counted.length ? counted.reduce((a, x) => a + val(x), 0) / counted.length : 0;
  const tip = x => { const inns = (x[6] && x[6].length) ? x[6].join(' & ') : x[1] < 0 ? 'did not bat' : String(x[1]);
    return `${inns}${x[2] ? `, ${x[2]} wkt${x[2] > 1 ? 's' : ''}` : ''} v ${x[3]} · ${x[4] ? { FC: 'Test', OD: 'ODI', T20: 'T20I' }[x[0]] : COMPS[FMT_COMP[x[0]]].short}${x[5] != null ? ' · ' + dateStr(x[5]) : ''}`; };
  const grid = guides.filter(g => g <= max).map(g => `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="#2a465c" stroke-width="1"/><text x="${L - 4}" y="${y(g) + 3}" font-size="8" fill="#6f8aa0" text-anchor="end">${g}${bowler ? 'w' : ''}</text>`).join('');
  const bars = log.map((x, i) => {
    const v = val(x), h = Math.max(2, base - y(v)), xx = L + i * bw + 3;
    const best = Math.max(0, ...(x[6] || []).map(t => parseInt(t, 10) || 0), bowler ? 0 : x[1]);
    const col = bowler ? (x[2] >= 5 ? '#f4c542' : x[2] >= 3 ? '#4ade80' : '#fb7185') : x[1] < 0 ? '#24465d' : best >= 100 ? '#f4c542' : best >= 50 ? '#4ade80' : '#7dd3fc';
    return `<g class="tap" onclick="flash('${esc(tip(x).replace(/\\/g, '').replace(/'/g, "\\'"))}')"><rect x="${xx - 3}" y="${top}" width="${bw}" height="${H - top}" fill="transparent"/>
      <rect x="${xx}" y="${base - h}" width="${bw - 6}" height="${h}" rx="2" fill="${col}"/>
      ${!bowler && v > max ? `<text x="${xx + (bw - 6) / 2}" y="${base - h + 9}" font-size="7.5" font-weight="700" fill="#0d1b26" text-anchor="middle">${v}</text>` : ''}
      ${!bowler && x[2] ? `<circle cx="${xx + (bw - 6) / 2}" cy="${Math.max(top + 3, base - h - 5)}" r="${Math.min(3.5, 1.5 + x[2] * 0.6)}" fill="#fb7185"/>` : ''}
      <text x="${xx + (bw - 6) / 2}" y="${H - 8}" font-size="${x[4] ? 6.5 : 8}" fill="${x[4] ? '#f4c542' : '#6f8aa0'}" text-anchor="middle">${x[4] ? INTL_LETTER[x[0]] : FMT_LETTER[x[0]]}</text></g>`; }).join('');
  const avgTxt = `avg ${bowler ? avg.toFixed(1) + 'w' : Math.round(avg)}`, ay = Math.max(top + 9, y(avg) - 4);
  const avgLine = avg > 0 ? `<line x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f4c542" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="${W - avgTxt.length * 5 - 6}" y="${ay - 8}" width="${avgTxt.length * 5 + 6}" height="11" rx="3" fill="#0d1b26" fill-opacity="0.9"/><text x="${W - 3}" y="${ay}" font-size="8.5" fill="#f4c542" text-anchor="end">${avgTxt}</text>` : '';
  return `<div class="panel" style="margin-bottom:10px"><div class="ph"><h3>${log.length === 1 ? 'Last match' : `Last ${log.length} matches`}</h3><div class="end xs dim">${bowler ? 'wickets per match' : 'runs per match · dots wickets'}</div></div><div class="pb">${showSwitch ? chartSwitch : ''}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:128px">${grid}${bars}${avgLine}</svg>
    <div class="xs dim">S Shield · O One-Day · T T20${log.some(x => x[4]) ? ' · <span style="color:#f4c542">gold</span> for Australia' : ''} · tap a bar</div></div></div>`;
}
function careerChart(p) {
  const h = p.hist.slice(-10);
  if (h.length < 1) return '';
  const runs = h.map(x => x.FC.r + x.OD.r + x.T20.r), wk = h.map(x => x.FC.w + x.OD.w + x.T20.w);
  const bowler = isBowlerProfile(p);
  const series = bowler ? wk : runs, unit = bowler ? 'wickets' : 'runs';
  const W = 320, H = 112, L = 30, top = 8, base = H - 18, bw = (W - L) / Math.max(h.length, 5);
  const max = Math.max(bowler ? 20 : 500, ...series);
  const y = v => base - v / max * (base - top);
  const guides = (bowler ? [20, 40, 60] : [500, 1000, 1500]).filter(g => g <= max * 1.05);
  const avg = series.reduce((a, b) => a + b, 0) / series.length;
  const grid = guides.map(g => `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="#2a465c"/><text x="${L - 4}" y="${y(g) + 3}" font-size="8" fill="#6f8aa0" text-anchor="end">${g >= 1000 ? g / 1000 + 'k' : g}</text>`).join('');
  const bars = h.map((x, i) => { const v = series[i], xx = L + i * bw + 4, other = bowler ? runs[i] : wk[i];
    return `<g class="tap" onclick="flash('${x.year}–${String(x.year + 1).slice(2)}: ${runs[i]} runs, ${wk[i]} wickets')"><rect x="${xx}" y="${y(v)}" width="${bw - 8}" height="${Math.max(2, base - y(v))}" rx="2" fill="${bowler ? '#fb7185' : '#7dd3fc'}"/>
      <text x="${xx + (bw - 8) / 2}" y="${H - 5}" font-size="8.5" fill="#8ea7b8" text-anchor="middle">${String(x.year).slice(2)}</text></g>`; }).join('');
  const at = `avg ${Math.round(avg)} ${unit}`, ay = Math.max(top + 9, y(avg) - 4);
  const avgLine = `<line x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f4c542" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="${W - at.length * 5 - 6}" y="${ay - 8}" width="${at.length * 5 + 6}" height="11" rx="3" fill="#0d1b26" fill-opacity="0.9"/><text x="${W - 3}" y="${ay}" font-size="8.5" fill="#f4c542" text-anchor="end">${at}</text>`;
  return `<div class="panel" style="margin-bottom:10px"><div class="ph"><h3>Season by season</h3><div class="end xs dim">${unit} per season, all formats</div></div><div class="pb"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px">${grid}${bars}${avgLine}</svg><div class="xs dim">Tap a season for runs and wickets.</div></div></div>`;
}
function homeExtras() {
  const up = game.season.fixtures.filter(f => !f.result && f.home && (isUserTeam(f.home) || isUserTeam(f.away))).slice(1, 4);
  const sq = squadOf(U());
  const lead = (k) => { let best = null, v = 0; sq.forEach(p => { const t = FMT_LIST.reduce((a, f) => a + p.stats.season[f][k], 0); if (t > v) { v = t; best = p; } }); return best ? `${plink(best)} <b>${v}</b>` : '–'; };
  return `${up.length ? panel('Coming up', `<div class="rows">${up.map(f => fixtureRow(f, false)).join('')}</div>`, { flush: true }) : ''}
    ${panel('Season leaders', `<div class="rows"><div class="kv"><span>Most runs</span><span>${lead('r')}</span></div><div class="kv"><span>Most wickets</span><span>${lead('w')}</span></div><div class="kv"><span>Team morale</span><span>${teamMorale(U())} · ${moodLabel(teamMorale(U()))}</span></div>${game.fin ? `<div class="kv"><span>Bank</span><span>${money(game.fin.cash)} · fans ${game.fin.fans}</span></div>` : ''}</div>`, { flush: true })}`;
}
// §25 BOOT ----------------------------------------------------------------------------------
(async function boot() {
  $('bVer').textContent = BUILD.version; $('bTitle').textContent = BUILD.title; $('bEng').textContent = BUILD.engine;
  document.title = `Legacy Cricket ${BUILD.version}`;
  await Store.init();
  if (Store.status === 'none') { const n = document.createElement('div'); n.className = 'note bad'; n.style.marginTop = '12px'; n.innerHTML = 'This browser is not keeping saved data (private browsing or a file preview). Open the game directly in Safari or Chrome, or use Export save in the menu to keep your career.'; document.querySelector('.launch').appendChild(n); }
  const metas = await Store.list(); const last = metas.map((m, i) => m ? Object.assign({ slot: i + 1 }, m) : null).filter(Boolean).sort((a, b) => (b.saved || '').localeCompare(a.saved || ''))[0];
  if (last) {
    const card = document.createElement('div'); card.className = 'launch-career';
    const kicker = document.createElement('div'); kicker.className = 'launch-career-kicker'; kicker.textContent = 'CONTINUE CAREER';
    const name = document.createElement('div'); name.className = 'launch-career-name'; name.textContent = teamName(last.team);
    const sub = document.createElement('div'); sub.className = 'launch-career-detail'; sub.textContent = [last.name, last.label].filter(Boolean).join(' · ');
    const btn = document.createElement('button'); btn.className = 'btn pri block launch-resume'; btn.textContent = 'Continue career ›'; btn.onclick = () => loadGame(last.slot);
    card.append(kicker,name,sub,btn); document.querySelector('.launch .btns').before(card);
  }
})();

// Build 038: iOS Safari's floating bottom toolbar can cover bottom:0 fixed controls.
// Don't add browser-toolbar clearance in standalone / home-screen mode.
(function initLiveBarViewportClearance() {
  if (typeof navigator === 'undefined' || typeof document === 'undefined') return;
  const ios = /iP(?:hone|ad|od)/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  const safari = /Safari/.test(navigator.userAgent) && !/CriOS|FxiOS|EdgiOS/.test(navigator.userAgent);
  if (!ios || !safari || standalone) return;
  document.documentElement.classList.add('ios-safari-browser');
  const refresh = () => {
    const v = window.visualViewport;
    if (!v) return;
    // If the visual viewport is shorter than the layout viewport, reserve that gap.
    const gap = Math.max(0, Math.min(120, Math.round(document.documentElement.clientHeight - v.height - v.offsetTop)));
    document.documentElement.style.setProperty('--livebar-viewport-gap', gap + 'px');
  };
  refresh();
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', refresh, { passive: true });
    window.visualViewport.addEventListener('scroll', refresh, { passive: true });
  }
  window.addEventListener('orientationchange', refresh, { passive: true });
})();
