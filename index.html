  const inn = S.innings[k];
  const bw = Array.isArray(inn.bw) ? inn.bw : Object.keys(inn.bw).map(id => Object.assign({ id }, inn.bw[id]));
  const batted = inn.card.filter(c => c.in);
  // Build 013: filter remaining batters by player identity, preventing duplicate
  // or stale scorecard rows from being shown twice.
  const battedIds = new Set(batted.map(c => String(c.id)));
  const remainingIds = new Set();
  const dnb = inn.card.filter(c => {
    const id = String(c.id);
    if (c.in || battedIds.has(id) || remainingIds.has(id)) return false;
    remainingIds.add(id);
    return true;
  });
  const ext = inn.ext.w + inn.ext.nb + inn.ext.b + inn.ext.lb;
  const nth = S.innings.filter((x, j) => j <= k && x.bat === inn.bat).length;
  const tabs = S.innings.length > 1 ? seg(S.innings.map((x, j) => [String(j), innLabel(S, j)]), String(k), fnName) : '';
  const shots = []; inn.card.forEach(c => (c.shots || []).forEach(s => shots.push(s)));
  return `
    ${tabs}
    <div class="sc-head"><div><div class="sc-team">${teamName(inn.bat)}</div><div class="xs dim">${S.fmt === 'FC' ? ordinal(nth) + ' innings' : 'Innings'}${inn.followOn ? ' · following on' : ''}${inn.target ? ' · target ' + inn.target : ''}</div></div>
      <div class="right"><div class="sc-total">${inn.runs}${inn.allOut ? '' : '/' + inn.wkts}${inn.declared ? 'd' : ''}</div><div class="xs dim">${oversStr(inn.balls)} overs · RR ${(inn.balls ? inn.runs / (inn.balls / 6) : 0).toFixed(2)}</div></div></div>
    <div class="panel"><table class="tbl sc"><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th class="hide-xs">SR</th></tr></thead><tbody>
      ${batted.map(c => `<tr><td class="l"><div class="nm">${plink(P(c.id), pshort(P(c.id)))}</div><div class="how ${c.out ? '' : 'no'}">${esc(dismissText(c.out))}</div></td><td class="b">${c.r}</td><td>${c.b}</td><td>${c.f4}</td><td>${c.f6}</td><td class="dim hide-xs">${c.b ? (c.r / c.b * 100).toFixed(0) : '–'}</td></tr>`).join('')}</tbody></table>
      <div class="sc-foot"><span>Extras <b>${ext}</b> <span class="dim">(w ${inn.ext.w}, nb ${inn.ext.nb}, b ${inn.ext.b}, lb ${inn.ext.lb})</span></span></div>
      ${dnb.length ? `<details class="sc-remaining"><summary>${inn.closed ? 'Did not bat' : 'Yet to bat'} · ${dnb.length}</summary><div class="sc-remaining-list">${dnb.map(c => P(c.id) ? plink(P(c.id), pshort(P(c.id))) : esc(c.id)).join(', ')}</div></details>` : ''}
      ${inn.fow.length ? `<div class="sc-foot"><span class="dim">Fall of wickets</span> ${inn.fow.map(f => `<span class="fow">${f.r}-${f.w}</span>`).join(' ')}</div>` : ''}</div>
    <div class="panel" style="margin-top:8px"><table class="tbl sc"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th class="hide-xs">Econ</th></tr></thead><tbody>
      ${bw.filter(b => b.balls || b.r).map(b => `<tr><td class="l"><div class="nm">${plink(P(b.id), pshort(P(b.id)))}</div></td><td>${oversStr(b.balls)}</td><td>${b.m}</td><td>${b.r}</td><td class="b">${b.w}</td><td class="dim hide-xs">${b.balls ? (b.r / (b.balls / 6)).toFixed(2) : '–'}</td></tr>`).join('') || '<tr><td class="l dim" colspan="6">Bowling figures appear after the first delivery.</td></tr>'}</tbody></table></div>
    ${!noWorm && shots.length ? `<div class="panel" style="margin-top:8px"><div class="ph"><h3>Wagon wheel</h3></div><div class="pb center">${wagonSvg(shots, 'R')}</div></div>` : ''}
    ${!noWorm && S.fmt !== 'FC' ? `<div class="panel" style="margin-top:8px"><div class="ph"><h3>Run progression</h3></div><div class="pb">${wormSvg(S.innings, S.fmt)}</div></div>` : ''}
    <div class="panel" style="margin-top:8px"><div class="rows">${S.potm ? `<div class="kv"><span>Player of the match</span><span>${plink(P(S.potm))}</span></div>` : ''}<div class="kv"><span>Venue</span><span>${esc(teamDef(S.venue).ground)}</span></div>${S.toss && S.toss.decision ? `<div class="kv"><span>Toss</span><span>${esc(teamDef(S.toss.winner).nick)}, chose to ${S.toss.decision}</span></div>` : ''}${S.condText ? `<div class="kv"><span>Conditions</span><span style="text-align:right">${esc(S.condText)}</span></div>` : ''}${S.overs ? `<div class="kv"><span>Reduced</span><span>${S.overs} overs a side</span></div>` : ''}${S.crowd ? `<div class="kv"><span>Crowd</span><span>${S.crowd.toLocaleString('en-AU')}</span></div>` : ''}</div></div>`;
}

    { foot: `<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="submitContract('${id}','${mode}')">Make offer</button>` });

function submitContract(id, mode) {

  const r = mode === 'sign' ? signFreeAgent(id, sal, yrs) : extendPlayer(id, sal, yrs);

// ---- Pitch report and forecast ----
// Grades run 1-10 from the combined venue and pitch factors the engine uses.
function pitchGrade(f) { return clamp(Math.round(5.5 + (f - 1) * 45), 1, 10); }
const PITCH_OUTLOOK = {
  standard: 'Wears gradually. Spin comes in from day 3.',
  green: 'Seam fades after the first day. Batting gets easier.',
  flat: 'Stays good for batting. Spin late in the match at best.',
  dry: 'Turns from day 2 and keeps turning more.',

const PITCH_WB = {
  standard: 'A fair surface for both sides.', green: 'Seamers will enjoy the new ball.', flat: 'Expect a big total and a fast outfield.',
  dry: 'Slow and turning. Spinners will be hard to hit.', cracked: 'Variable bounce. Hard to time the ball.'
};
const PITCH_LOOK = {
  standard: { fill: '#a99a5e', stripe: '#b5a66a' }, green: { fill: '#5f8a45', stripe: '#6d9a50' },
  flat: { fill: '#cdb987', stripe: '#d8c595' }, dry: { fill: '#c4a161', stripe: '#cfad6d' }, cracked: { fill: '#b18a4e', stripe: '#bc965a' }
};
function pitchSvg(key) {
  const L = PITCH_LOOK[key] || PITCH_LOOK.standard;
  const stripes = [0, 1, 2, 3, 4, 5].map(i => `<rect x="4" y="${10 + i * 20}" width="36" height="10" fill="${L.stripe}"/>`).join('');
  const cracks = key === 'cracked' ? '<path d="M14 40 l5 6 -3 6 6 5M28 70 l-4 5 5 5 -3 6M17 92 l6 4 -2 6" stroke="#6b4f26" stroke-width="1.2" fill="none"/>' : key === 'dry' ? '<path d="M15 55 l4 4M27 82 l-3 4" stroke="#8a6a35" stroke-width="1" fill="none"/>' : '';
  const grass = key === 'green' ? [12, 30, 22, 34, 15, 26].map((x, i) => `<circle cx="${x}" cy="${22 + i * 17}" r="1.3" fill="#3f6b2c"/>`).join('') : '';
  return `<svg class="pitch-svg" viewBox="0 0 44 140" aria-hidden="true"><rect x="4" y="4" width="36" height="132" rx="3" fill="${L.fill}"/>${stripes}${grass}${cracks}
    <path d="M4 24 H40 M4 116 H40" stroke="#f3f0e6" stroke-width="1.4"/><path d="M10 14 V30 M34 14 V30 M10 110 V126 M34 110 V126" stroke="#f3f0e6" stroke-width="1"/>
    <g fill="#f3f0e6"><rect x="19" y="18" width="1.6" height="5"/><rect x="21.2" y="18" width="1.6" height="5"/><rect x="23.4" y="18" width="1.6" height="5"/><rect x="19" y="117" width="1.6" height="5"/><rect x="21.2" y="117" width="1.6" height="5"/><rect x="23.4" y="117" width="1.6" height="5"/></g></svg>`;
}
function pitchReport(pre, v, fmt) {
  const key = pre.cond.pitch, pt = PITCHES[key];
  const g = pitchDayGrades(key, v, 0, fmt);
  const grades = fmt === 'FC' ? [0,1,2,3].map(d => pitchDayGrades(key, v, d, fmt)) : [g];
  const top = Math.max(g.pace, g.spin);
  const verdict = top >= 8 ? (g.spin > g.pace ? 'Helps the spinners' : 'Helps the seamers') : g.bat >= 8 ? 'Batting surface' : top <= 6 && g.bat <= 6 ? 'Slow and low' : 'Even contest';
  // Day-one bars retain their existing appearance. A darker gold band highlights
  // the range reached over the full multi-day match, without adding another table.
  const bar = (label, field) => {
    const dayOne = g[field];
    const lo = Math.min(...grades.map(x => x[field]));
    const hi = Math.max(...grades.map(x => x[field]));
    const value = fmt === 'FC' && lo !== hi ? `${lo}–${hi}` : `${dayOne}`;
    const cells = Array.from({length:10}, (_,i) => {
      const point = i + 1;
      const cls = point <= lo ? 'on' : point <= hi ? 'range' : '';
      return `<i class="${cls}"></i>`;
    }).join('');
    return `<div class="pgr" aria-label="${esc(label)}: ${value} out of 10"><span>${esc(label)}</span><span class="cells">${cells}</span><b>${value}</b></div>`;
  };
  return `<div class="pitch-rep">${pitchSvg(key)}<div class="grow">
    <div class="flex" style="gap:6px;align-items:baseline"><b>${pt.label}</b><span class="xs muted">· ${verdict}</span></div>
    ${bar('Pace and bounce', 'pace')}${bar('Spin', 'spin')}${bar('Batting', 'bat')}
    <div class="xs muted" style="margin-top:5px">${fmt === 'FC' ? 'Day 1–4 outlook · gold band shows the expected range.' : PITCH_WB[key]}</div>
  </div></div>`;
}

function analystSheet() {

function resultRecap(M) {

    i.card.forEach(c => { if (c.in && (!bestBat[c.id] || c.r > bestBat[c.id][0].r)) bestBat[c.id] = [c, i.bat]; });

  });
  const bats = Object.values(bestBat).sort((a, b) => b[0].r - a[0].r), bowls = Object.values(fig).sort((a, b) => b[1].w - a[1].w || a[1].r - b[1].r);
  const fx = fixtureById(M.fxId), me = liveMyTeam(M), res = M.result;
  let impact = '';

    const series = game.season.fixtures.filter(f => f.win === fx.win && f.comp === fx.comp && f.id !== fx.id && f.result).map(f => f.result.winner).concat([res.winner]);

    const over = series.length >= game.season.fixtures.filter(f => f.win === fx.win && f.comp === fx.comp).length;
    impact = a === o ? `${sname} ${over ? 'drawn' : 'level'} at ${a}–${o}.` : `${a > o ? 'Australia' : teamName(fx.away)} ${over ? 'win' : 'lead'} the ${sname} ${Math.max(a, o)}–${Math.min(a, o)}.`;
  } else if (fx && fx.stage === 'league' && game.season.standings[M.comp]) {
    const c = COMPS[M.comp], pts = res.winner === me ? c.win : res.winner ? 0 : res.tie ? c.tie : c.draw;
    const table = Object.keys(game.season.standings[M.comp]).map(id => ({ id, p: game.season.standings[M.comp][id].Pts + (id === me ? pts : 0) })).sort((a, b) => b.p - a.p);
    impact = `${pts ? `${pts} points` : 'No points'} for ${teamDef(me).nick}. That puts them ${ordinal(table.findIndex(x => x.id === me) + 1)} on the ${c.short} ladder with ${table.find(x => x.id === me).p}.`;
  }

    ${M.potm && P(M.potm) ? `<div class="broadcast-award">Player of the match · ${plink(P(M.potm))}</div>` : ''}
    ${inningsCards}
    ${M.fmt !== 'FC' ? `<div class="broadcast-recap-worm">${wormSvg(M.innings,M.fmt)}</div>` : ''}
    ${impact ? `<details class="recap-more"><summary>Competition impact</summary><span class="xs muted">${esc(impact)}</span></details>` : ''}`;
  return `<section class="panel recap broadcast-recap"><div class="pb"><div class="rc-e">Match complete</div>${inner}</div></section>`;
}

function ballSym(s) { const c = s === 'W' ? 'w' : s === '4' ? 'b4' : s === '6' ? 'b6' : /wd|nb|lb|b/.test(s) ? 'x' : s === '•' ? 'dot' : ''; return `<span class="bs ${c}">${s === '•' ? '·' : s}</span>`; }

function setCommAll(v) { ui.commAll = v === '1'; render(); }
// Commentary grouped by over, newest first. Lean mode shows only notable balls.
function commentaryHtml(M) {
  const groups = []; let cur = null;
  M.log.forEach(e => {
    if (e.o == null) { groups.push({ note: e }); cur = null; return; }
    const key = (e.inn || 0) + ':' + e.o;
    if (!cur || cur.key !== key) { cur = { key, o: e.o, balls: [], bn: e.bn }; groups.push(cur); }
    cur.balls.push(e);
  });
  const all = !!ui.commAll;
  const html = groups.slice(0, 24).map(g => {
    // Result notes are skipped: the result banner above the tabs already shows them.
    if (g.note) { if (/^End of over/.test(g.note.text) || g.note.cls === 's') return ''; return `<div class="cnote ${g.note.cls === 'brk' ? 'brk' : ''}">${esc(g.note.text)}</div>`; }
    const balls = g.balls.slice().reverse();
    const runs = balls.reduce((a, b) => a + (b.runs || 0), 0);
    const last = g.balls[0];
    const shown = all ? balls : balls.filter(b => b.wkt || b.bat >= 4 || /Fifty|Hundred/.test(b.short || ''));
    return `<div class="ov"><div class="ovh"><span class="ovn">Over ${g.o + 1}</span><span class="ovw ell">${esc(g.bn || '')}</span><span class="ovr">${runs} run${runs === 1 ? '' : 's'} · ${esc(last.score || '')}</span></div>
      ${shown.map(b => `<div class="cball ${b.wkt ? 'w' : b.bat >= 4 ? 'b' : ''}"><span class="o">${b.o}.${Math.min(6, b.b)}</span><span>${esc(b.short || b.text)}</span></div>`).join('')}</div>`;
  }).join('');
  return `<div style="margin:0 0 6px">${seg([['0','Key moments'],['1','Every ball']], all ? '1' : '0', 'setCommAll')}</div><div class="panel comm2">${html || '<div class="empty">The first ball is yet to be bowled.</div>'}</div>`;
}
function wagonSvg(shots, hand) {
  const C = 110, R = 98;
  // View from the batting end: the bowler is at the bottom.
  // For a right-hander off side is left, leg side is right.
  const mirror = 1; // zoneAngle already mirrors shots for left-handed batters
  const lines = shots.map(([a, r]) => { const len = r >= 6 ? R + 6 : r === 4 ? R : 26 + r * 20; const rad = a * Math.PI / 180; const x = C - Math.sin(rad) * len * mirror, y = C + Math.cos(rad) * len; const col = r >= 6 ? '#f4c542' : r === 4 ? '#4ade80' : '#7dd3fc'; return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="${r >= 4 ? 1.8 : 1.1}" stroke-opacity="${r >= 4 ? 0.95 : 0.6}"/>`; }).join('');
  const offRight = hand === 'L';
  return `<svg viewBox="0 0 220 220" class="wagon"><circle cx="${C}" cy="${C}" r="${R}" fill="#0f2a1e" stroke="#1f4d36"/><circle cx="${C}" cy="${C}" r="54" fill="none" stroke="#1f4d36" stroke-dasharray="3 3"/>
    <rect x="${C - 4}" y="${C - 8}" width="8" height="30" fill="#3d4a2a" rx="1"/>${lines}
    <text x="${offRight ? 200 : 20}" y="16" fill="#8ea7b8" font-size="10" text-anchor="middle">Off</text><text x="${offRight ? 20 : 200}" y="16" fill="#8ea7b8" font-size="10" text-anchor="middle">Leg</text></svg>`;
}
function setWagon(m) { ui.wagon = m; render(); }
function wagonPanel(M) {
  const inn = ui.liveInn != null && M.innings[ui.liveInn] ? M.innings[ui.liveInn] : curInn(M);
  const valid = inn.card.filter(c => c && c.id && P(c.id));
  // Keep the chosen batter across strike changes and wickets.
  // A newly selected innings defaults to its current batter only if the
  // previous player is not present in that innings.
  const selected = valid.find(c => c.id === ui.wagonPlayer);
  const current = valid.find(c => c.id === inn.card[inn.striker]?.id) || valid[0];
  const mode = ui.wagon === 'inn' ? 'inn' : 'player';
  const card = selected || current;
  let shots = [], label = '', hand = 'R';
  if (mode === 'inn') {
    valid.forEach(c => (c.shots || []).forEach(shot => shots.push(shot)));
    label = `${teamDef(inn.bat).short || inn.bat} · ${inn.runs}/${inn.wkts}`;
  } else if (card) {
    shots = card.shots || [];
    const player = P(card.id);
    label = `${pname(player)} · ${card.r} (${card.b})`;
    // Stored shot bearings already encode batting handedness.
    hand = player.hand || 'R';
  }
  const count = r => shots.filter(shot => (r === 1 ? shot[1] < 4 : shot[1] === r)).length;
  const runs = shots.reduce((a, shot) => a + shot[1], 0);
  const offR = shots.filter(shot => shot[0] > 0 && shot[0] < 180).reduce((a, shot) => a + shot[1], 0);
  const players = valid.map(c => `<option value="${esc(c.id)}" ${card && c.id === card.id ? 'selected' : ''}>${esc(pname(P(c.id)))} · ${c.r} (${c.b})</option>`).join('');
  return `<div class="wagon-controls"><div class="seg"><button class="${mode === 'player' ? 'on' : ''}" onclick="setWagon('player')">Player</button><button class="${mode === 'inn' ? 'on' : ''}" onclick="setWagon('inn')">Innings</button></div>
    ${mode === 'player' ? `<label class="wagon-select-label">Batter <select aria-label="Select batter for wagon wheel" onchange="ui.wagonPlayer=this.value;render()">${players}</select></label>` : ''}</div>
    <div class="panel" style="margin-top:8px"><div class="pb center"><div class="b s" style="margin-bottom:6px">${esc(label)}</div>${wagonSvg(shots, hand)}
      <div class="flex" style="justify-content:center;gap:14px;margin-top:6px"><span class="xs"><b style="color:#7dd3fc">—</b> 1–3s ${count(1)}</span><span class="xs"><b class="win">—</b> 4s ${count(4)}</span><span class="xs"><b style="color:#f4c542">—</b> 6s ${count(6)}</span></div>
      ${mode === 'player' && runs ? `<div class="xs dim" style="margin-top:4px">${Math.round(offR / runs * 100)}% of runs on the off side</div>` : ''}</div></div>`;
}

// Who bats next, so the innings-break panel can ask the right question.
function predictNextBat(M) {
  const n = M.innings.length, last = curInn(M);
  if (M.fmt !== 'FC') return n === 1 ? last.bowl : null;
  if (M.timeUp) return null;
  if (n === 1) return last.bowl;
  if (n === 2) { const lead = M.innings[0].runs - last.runs; return (lead >= 200 && mMaxBalls(M) - M.balls > 600) ? last.bat : M.innings[0].bat; }
  if (n === 3) { const bat = last.bowl; return teamRuns(M, last.bat) - teamRuns(M, bat) + 1 > 0 ? bat : null; }
  return null;
}

  let rows = '';
  const yr = y => `<span class="dim xs">${y}</span>`;
  if (cat === 'hs') rows = (R.hs[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.n)}</b> <span class="dim xs">${x.t}</span><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${x.r}${x.no ? '*' : ''}</td><td class="dim">${x.b}b</td></tr>`).join('');
  if (cat === 'bb') rows = (R.bb[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.n)}</b> <span class="dim xs">${x.t}</span><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${x.w}/${x.r}</td><td></td></tr>`).join('');
  if (cat === 'th' || cat === 'tl') rows = (R[cat][k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${x.t}</b><div class="xs dim">v ${x.opp} · ${x.y}</div></td><td class="b big">${x.r}${cat === 'th' && x.w < 10 ? '/' + x.w : ''}</td><td></td></tr>`).join('');
  if (cat === 'pt') rows = (R.pt[k] || []).map((x, i) => `<tr><td class="n2">${i + 1}</td><td class="l"><b>${esc(x.a)}</b> & <b>${esc(x.b)}</b><div class="xs dim">${x.t} v ${x.opp} · ${ordinal(x.w)} wicket · ${x.y}</div></td><td class="b big">${x.r}${x.unb ? '*' : ''}</td><td></td></tr>`).join('');
  if (cat[0] === 'c') { const stat = { cr:'runs', cw:'wkts', ch:'c100', cm:'m' }[cat]; rows = careerLeaders(f, scope, stat, 15).map((x, i) => { const s = x.s, v = { cr: s.r, cw: s.w, ch: s.c100, cm: s.m }[cat]; const sub = cat === 'cr' || cat === 'ch' ? `${s.m} matches · avg ${fmtNum(batAvgOf(s))}` : cat === 'cw' ? `${s.m} matches · avg ${fmtNum(bowlAvgOf(s))}` : `${s.r} runs · ${s.w} wkts`; return `<tr class="tap" onclick="showPlayer('${x.p.id}')"><td class="n2">${i + 1}</td><td class="l"><b>${esc(pname(x.p))}</b> <span class="dim xs">${x.p.retired ? 'retired' : tdot(x.p.teamId)}</span><div class="xs dim">${sub}</div></td><td class="b big">${v}</td><td></td></tr>`; }).join(''); }
  return `<div class="tool-row">${seg([['dom','Domestic'],['intl','Intl']], scope, 'setRecScope')}${seg(FMT_LIST.map(x => [x, scope === 'intl' ? { FC:'Test', OD:'ODI', T20:'T20I' }[x] : compName(x)]), f, 'setRecFmt')}</div>
    <div style="height:8px"></div>${sel(cats, cat, "ui.recCat=this.value;render()", 'full')}<div style="height:8px"></div>
    ${panel(`${fname} · ${cats.find(c => c[0] === cat)[1]}`, rows ? `<table class="tbl rec"><tbody>${rows}</tbody></table>` : '<div class="empty">No records yet. They build up as matches are played.</div>', { flush: true })}
    <div class="xs dim" style="margin-top:6px">${cat[0] === 'c' ? (scope === 'intl' ? 'International career totals accumulate as matches are simulated.' : 'Domestic career totals may include seeded history.') : 'Match records count from the start of your career.'}</div>`;
}

// Small SVG charts for profiles.
// ---- Form and career charts ----
// Batters: bars are runs per match with guide lines at 50 and 100 and a dashed average.
// Bowlers: bars are wickets per match with guide lines at 3 and 5 and a dashed average.
// A letter under each bar gives the format (gold for internationals); tap a bar for the match.
const FMT_LETTER = { FC: 'S', OD: 'O', T20: 'T' }, INTL_LETTER = { FC: 'Test', OD: 'ODI', T20: 'T20I' };
function isBowlerProfile(p) { return ['PACE', 'SPIN'].includes(group(p)) || p.role === 'BWAR'; }
function formChart(p) {
  const chartFilter = (ui.playerChartFormat || 'ALL');
  const log = (p.log || []).filter(x => chartFilter === 'ALL' || x[0] === chartFilter).slice(-12);
  const chartSwitch = `<div class="chart-filters">${[['ALL','All'],['FC','Shield / Test'],['OD','One-Day'],['T20','T20']].map(([k,l]) => `<button class="${chartFilter===k?'on':''}" onclick="ui.playerChartFormat='${k}';showPlayer('${p.id}','over')">${l}</button>`).join('')}</div>`;
  if (!log.length) return `<div class="panel"><div class="pb">${chartSwitch}<div class="xs dim">No performances in this format yet.</div></div></div>`;
  const bowler = isBowlerProfile(p);
  const W = 320, H = 118, L = 24, top = 8, base = H - 22, bw = (W - L) / 12;
  const val = x => bowler ? x[2] : Math.max(0, x[1]);
  const guides = bowler ? [3, 5] : [50, 100];
  // Batting scale tops out at 160 so the 50 and 100 lines stay readable; taller bars are labelled.
  const max = bowler ? Math.max(6, ...log.map(val)) : clamp(Math.max(...log.map(val)), 110, 160);
  const y = v => base - Math.min(v, max) / max * (base - top);
  const counted = bowler ? log : log.filter(x => x[1] >= 0);
  const avg = counted.length ? counted.reduce((a, x) => a + val(x), 0) / counted.length : 0;
  const tip = x => { const inns = (x[6] && x[6].length) ? x[6].join(' & ') : x[1] < 0 ? 'did not bat' : String(x[1]);
    return `${inns}${x[2] ? `, ${x[2]} wkt${x[2] > 1 ? 's' : ''}` : ''} v ${x[3]} · ${x[4] ? { FC: 'Test', OD: 'ODI', T20: 'T20I' }[x[0]] : COMPS[FMT_COMP[x[0]]].short}${x[5] != null ? ' · ' + dateStr(x[5]) : ''}`; };
  const grid = guides.filter(g => g <= max).map(g => `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="#2a465c" stroke-width="1"/><text x="${L - 4}" y="${y(g) + 3}" font-size="8" fill="#6f8aa0" text-anchor="end">${g}${bowler ? 'w' : ''}</text>`).join('');
  const bars = log.map((x, i) => {
    const v = val(x), h = Math.max(2, base - y(v)), xx = L + i * bw + 3;
    const best = Math.max(0, ...(x[6] || []).map(t => parseInt(t, 10) || 0), bowler ? 0 : x[1]);
    const col = bowler ? (x[2] >= 5 ? '#f4c542' : x[2] >= 3 ? '#4ade80' : '#fb7185') : x[1] < 0 ? '#24465d' : best >= 100 ? '#f4c542' : best >= 50 ? '#4ade80' : '#7dd3fc';
    return `<g class="tap" onclick="flash('${esc(tip(x).replace(/\\/g, '').replace(/'/g, "\\'"))}')"><rect x="${xx - 3}" y="${top}" width="${bw}" height="${H - top}" fill="transparent"/>
      <rect x="${xx}" y="${base - h}" width="${bw - 6}" height="${h}" rx="2" fill="${col}"/>
      ${!bowler && v > max ? `<text x="${xx + (bw - 6) / 2}" y="${base - h + 9}" font-size="7.5" font-weight="700" fill="#0d1b26" text-anchor="middle">${v}</text>` : ''}
      ${!bowler && x[2] ? `<circle cx="${xx + (bw - 6) / 2}" cy="${Math.max(top + 3, base - h - 5)}" r="${Math.min(3.5, 1.5 + x[2] * 0.6)}" fill="#fb7185"/>` : ''}
      <text x="${xx + (bw - 6) / 2}" y="${H - 8}" font-size="${x[4] ? 6.5 : 8}" fill="${x[4] ? '#f4c542' : '#6f8aa0'}" text-anchor="middle">${x[4] ? INTL_LETTER[x[0]] : FMT_LETTER[x[0]]}</text></g>`; }).join('');
  const avgTxt = `avg ${bowler ? avg.toFixed(1) + 'w' : Math.round(avg)}`, ay = Math.max(top + 9, y(avg) - 4);
  const avgLine = avg > 0 ? `<line x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f4c542" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="${W - avgTxt.length * 5 - 6}" y="${ay - 8}" width="${avgTxt.length * 5 + 6}" height="11" rx="3" fill="#0d1b26" fill-opacity="0.9"/><text x="${W - 3}" y="${ay}" font-size="8.5" fill="#f4c542" text-anchor="end">${avgTxt}</text>` : '';
  return `<div class="panel" style="margin-bottom:10px"><div class="ph"><h3>Last ${log.length} matches</h3><div class="end xs dim">${bowler ? 'wickets per match' : 'runs per match · dots wickets'}</div></div><div class="pb">${chartSwitch}
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:128px">${grid}${bars}${avgLine}</svg>
    <div class="xs dim">S Shield · O One-Day · T T20 · <span style="color:#f4c542">Test, ODI, T20I</span> for Australia · tap a bar for the match</div></div></div>`;
}
function careerChart(p) {
  const h = p.hist.slice(-10);
  if (h.length < 1) return '';
  const runs = h.map(x => x.FC.r + x.OD.r + x.T20.r), wk = h.map(x => x.FC.w + x.OD.w + x.T20.w);
  const bowler = isBowlerProfile(p);
  const series = bowler ? wk : runs, unit = bowler ? 'wickets' : 'runs';
  const W = 320, H = 112, L = 30, top = 8, base = H - 18, bw = (W - L) / Math.max(h.length, 5);
  const max = Math.max(bowler ? 20 : 500, ...series);
  const y = v => base - v / max * (base - top);
  const guides = (bowler ? [20, 40, 60] : [500, 1000, 1500]).filter(g => g <= max * 1.05);
  const avg = series.reduce((a, b) => a + b, 0) / series.length;
  const grid = guides.map(g => `<line x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="#2a465c"/><text x="${L - 4}" y="${y(g) + 3}" font-size="8" fill="#6f8aa0" text-anchor="end">${g >= 1000 ? g / 1000 + 'k' : g}</text>`).join('');
  const bars = h.map((x, i) => { const v = series[i], xx = L + i * bw + 4, other = bowler ? runs[i] : wk[i];
    return `<g class="tap" onclick="flash('${x.year}–${String(x.year + 1).slice(2)}: ${runs[i]} runs, ${wk[i]} wickets')"><rect x="${xx}" y="${y(v)}" width="${bw - 8}" height="${Math.max(2, base - y(v))}" rx="2" fill="${bowler ? '#fb7185' : '#7dd3fc'}"/>
      <text x="${xx + (bw - 8) / 2}" y="${H - 5}" font-size="8.5" fill="#8ea7b8" text-anchor="middle">${String(x.year).slice(2)}</text></g>`; }).join('');
  const at = `avg ${Math.round(avg)} ${unit}`, ay = Math.max(top + 9, y(avg) - 4);
  const avgLine = `<line x1="${L}" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="#f4c542" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="${W - at.length * 5 - 6}" y="${ay - 8}" width="${at.length * 5 + 6}" height="11" rx="3" fill="#0d1b26" fill-opacity="0.9"/><text x="${W - 3}" y="${ay}" font-size="8.5" fill="#f4c542" text-anchor="end">${at}</text>`;
  return `<div class="panel" style="margin-bottom:10px"><div class="ph"><h3>Season by season</h3><div class="end xs dim">${unit} per season, all formats</div></div><div class="pb"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px">${grid}${bars}${avgLine}</svg><div class="xs dim">Tap a season for runs and wickets.</div></div></div>`;
}
function homeExtras() {
  const up = game.season.fixtures.filter(f => !f.result && f.home && (isUserTeam(f.home) || isUserTeam(f.away))).slice(1, 4);
  const sq = squadOf(U());
  const lead = (k) => { let best = null, v = 0; sq.forEach(p => { const t = FMT_LIST.reduce((a, f) => a + p.stats.season[f][k], 0); if (t > v) { v = t; best = p; } }); return best ? `${plink(best)} <b>${v}</b>` : '–'; };
  return `${up.length ? panel('Coming up', `<div class="rows">${up.map(f => fixtureRow(f, false)).join('')}</div>`, { flush: true }) : ''}
    ${panel('Season leaders', `<div class="rows"><div class="kv"><span>Most runs</span><span>${lead('r')}</span></div><div class="kv"><span>Most wickets</span><span>${lead('w')}</span></div><div class="kv"><span>Team morale</span><span>${teamMorale(U())} · ${moodLabel(teamMorale(U()))}</span></div>${game.fin ? `<div class="kv"><span>Bank</span><span>${money(game.fin.cash)} · fans ${game.fin.fans}</span></div>` : ''}</div>`, { flush: true })}`;
}
// §25 BOOT ----------------------------------------------------------------------------------
(async function boot() {
  $('bVer').textContent = BUILD.version; $('bTitle').textContent = BUILD.title; $('bEng').textContent = BUILD.engine;
  document.title = `Legacy Cricket ${BUILD.version}`;
  await Store.init();
  if (Store.status === 'none') { const n = document.createElement('div'); n.className = 'note bad'; n.style.marginTop = '12px'; n.innerHTML = 'This browser is not keeping saved data (private browsing or a file preview). Open the game directly in Safari or Chrome, or use Export save in the menu to keep your career.'; document.querySelector('.launch').appendChild(n); }
  const metas = await Store.list(); const last = metas.map((m, i) => m ? Object.assign({ slot: i + 1 }, m) : null).filter(Boolean).sort((a, b) => (b.saved || '').localeCompare(a.saved || ''))[0];
  if (last) {
    const card = document.createElement('div'); card.className = 'launch-career';
    const kicker = document.createElement('div'); kicker.className = 'launch-career-kicker'; kicker.textContent = 'CONTINUE CAREER';
    const name = document.createElement('div'); name.className = 'launch-career-name'; name.textContent = teamName(last.team);
    const sub = document.createElement('div'); sub.className = 'launch-career-detail'; sub.textContent = [last.name, last.label].filter(Boolean).join(' · ');
    const btn = document.createElement('button'); btn.className = 'btn pri block launch-resume'; btn.textContent = 'Continue career ›'; btn.onclick = () => loadGame(last.slot);
    card.append(kicker,name,sub,btn); document.querySelector('.launch .btns').before(card);
  }
})();
</script>
