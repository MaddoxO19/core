<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Legacy Cricket</title>
<style>
/* =====================================================================
   MINI&ME CRICKET UI v0.3 — compact, mobile-first design system
   Tokens → base → layout → components → pages. One file, no frameworks.
   ===================================================================== */
:root{
  --bg:#061019; --s1:#0c1c28; --s2:#112636; --s3:#17324a; --line:#1f3d53; --line2:rgba(120,165,195,.14);
  --text:#eef4f8; --muted:#8ea7b8; --dim:#5f7a8c; --accent:#f4c542; --accent-ink:#1b1606; --cyan:#7dd3fc;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --r:12px; --r-sm:8px;
  --fs:14px; --fs-s:12.5px; --fs-xs:11px; --nav-h:58px; --top-h:50px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}.dim{color:var(--dim)}.s{font-size:var(--fs-s)}.xs{font-size:var(--fs-xs)}.b{font-weight:700}
.win{color:var(--good)}.loss{color:var(--bad)}.draw{color:var(--warn)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.right{text-align:right}.center{text-align:center}
.flex{display:flex;align-items:center;gap:8px}.flex.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}

/* ---------- Buttons + inputs ---------- */
.btn{border:0;border-radius:var(--r-sm);padding:9px 14px;font-weight:700;font-size:var(--fs-s);cursor:pointer;background:var(--s3);color:var(--text);white-space:nowrap;line-height:1.2}
.btn:active{transform:translateY(1px)}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-ink)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:#3a1519;color:#fca5a5}
.btn.sm{padding:6px 10px;font-size:var(--fs-xs);border-radius:7px}.btn.block{width:100%}.btn.icon{padding:6px 9px;min-width:32px}
select,.input{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 28px 7px 10px;font-size:var(--fs-s);min-width:0;max-width:100%}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.input{padding:8px 10px;width:100%}
select.full{width:100%}
label.lbl{display:block;font-size:var(--fs-xs);color:var(--muted);margin:0 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:4px;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;font-size:var(--fs-s);font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--s3);color:var(--text)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-s);font-weight:600}
.switch i{width:34px;height:20px;border-radius:20px;background:var(--s3);position:relative;transition:.15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#cfe1ec;transition:.15s}
.switch.on i{background:var(--accent)}.switch.on i:after{left:16px;background:var(--accent-ink)}

/* ---------- Pills + chips ---------- */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 6px;border-radius:6px;background:var(--s3);font-weight:800;font-size:var(--fs-xs)}
.pill.elite{background:#4a3c0e;color:#fde68a}.pill.good{background:#123b28;color:#86efac}.pill.lo{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:800;background:var(--s3);color:#cfe1ec;white-space:nowrap;letter-spacing:.02em;vertical-align:middle}
.chip.FC,.chip.SHIELD{background:#3b2a10;color:#fcd38d}.chip.OD,.chip.ODC{background:#0e3047;color:#93d5ff}.chip.T20,.chip.T20C{background:#3a1235;color:#f9a8d4}
.chip.good{background:#123b28;color:#86efac}.chip.warn{background:#43330d;color:#fcd34d}.chip.bad{background:#41161b;color:#fca5a5}.chip.info{background:#0e3047;color:#93d5ff}.chip.os{background:#272f4a;color:#c7d2fe}
.chip.btn-chip{cursor:pointer;padding:5px 10px;font-size:var(--fs-xs)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;flex:none}
.badge{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:11px;background:var(--s2);border:2px solid var(--line);flex:none}
.badge.lg{width:44px;height:44px;font-size:13px;border-radius:11px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s3);color:var(--accent);font-weight:800;font-size:11px;flex:none}
.res{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:10px;font-weight:900}
.res.W{background:#14532d;color:#bbf7d0}.res.L{background:#4c1d1d;color:#fecaca}.res.D,.res.T,.res.N{background:#43330d;color:#fde68a}
.meter{height:5px;border-radius:5px;background:var(--s3);overflow:hidden}.meter>i{display:block;height:100%;background:var(--cyan);border-radius:5px}

/* ---------- App frame ---------- */
#app{min-height:100vh}
.top{position:sticky;top:0;z-index:40;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(6,16,25,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line2)}
.top .brand{font-weight:900;font-size:15px;letter-spacing:-.01em}.top .brand span{color:var(--accent)}
.top .date{font-size:var(--fs-xs);color:var(--muted);font-weight:600}
.top .cont{margin-left:auto}
.main{padding:12px 12px calc(var(--nav-h) + 16px + var(--safe-b));max-width:1180px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(7,17,26,.97);border-top:1px solid var(--line2);backdrop-filter:blur(12px)}
.nav button{border:0;background:transparent;color:var(--dim);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative}
.nav button svg{width:21px;height:21px}
.nav button.on{color:var(--accent)}
.nav .badge-n{position:absolute;top:7px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:9px;padding:1px 5px;font-weight:900}
.page-title{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.page-title h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.page-title .sub{font-size:var(--fs-xs);color:var(--muted)}
.page-title .end{margin-left:auto;display:flex;gap:6px}

/* ---------- Panels + layout ---------- */
.grid{display:grid;gap:10px;grid-template-columns:1fr}
.panel{background:var(--s1);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;min-width:0}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.ph h3{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:800}
.ph .end{margin-left:auto;display:flex;gap:6px;align-items:center}
.pb{padding:10px 12px 12px}
.pb.tight{padding:6px 0 4px}
.link{color:var(--cyan);cursor:pointer;font-size:var(--fs-xs);font-weight:700;background:none;border:0;padding:0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kpi{background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;min-width:0}
.kpi .v{font-size:16px;font-weight:850;line-height:1.1}.kpi .l{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.alerts::-webkit-scrollbar{display:none}

/* ---------- Rows (the main list primitive) ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line2);min-width:0}
.rows .row:first-child{border-top:0}
.row.tap{cursor:pointer}.row.tap:hover{background:rgba(125,211,252,.04)}.row.me{background:rgba(244,197,66,.07)}
.row .main-t{font-weight:700;font-size:var(--fs);min-width:0}.row .sub-t{font-size:var(--fs-xs);color:var(--muted);min-width:0}
.row .stack{display:flex;flex-direction:column;min-width:0;flex:1}
.row .end{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.row .n{width:18px;color:var(--dim);font-weight:800;font-size:var(--fs-xs);text-align:right;flex:none}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;border-top:1px solid var(--line2);font-size:var(--fs-s)}
.kv:first-child{border-top:0}.kv>span:first-child{color:var(--muted)}
/* compact tables */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:12px}.tbl th:last-child,.tbl td:last-child{padding-right:12px}
.tbl tr.me td{background:rgba(244,197,66,.07)}.tbl td.l,.tbl th.l{text-align:left}
.tbl-wrap{overflow-x:auto}
.empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:var(--fs-s)}

/* ---------- Next match hero ---------- */
.hero{display:flex;align-items:center;gap:10px}
.hero .mid{flex:1;text-align:center;min-width:0}
.hero .comp{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.hero .vs{font-size:16px;font-weight:850;margin:3px 0}
.hero .meta{font-size:var(--fs-xs);color:var(--muted)}
.actions{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;margin-top:10px}

/* ---------- Sheets (drill-down windows) ---------- */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:16px 16px 0 0;animation:up .18s ease-out;padding-bottom:var(--safe-b)}
.sheet.wide{max-width:980px}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);flex:none}
.sheet-h .t{font-weight:800;font-size:15px;min-width:0}.sheet-h .e{font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.sheet-h .x{margin-left:auto;border:0;background:var(--s3);border-radius:8px;width:30px;height:30px;font-weight:900;cursor:pointer;flex:none}
.sheet-b{overflow-y:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
.sheet-b.flush{padding:0 0 12px}
.sheet-f{flex:none;padding:10px 14px;border-top:1px solid var(--line2);display:flex;gap:8px}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 14px + var(--safe-b));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:10px;font-weight:800;font-size:var(--fs-s);z-index:120;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.note{padding:9px 12px;border-radius:10px;font-size:var(--fs-s);background:#0d2a3a;border:1px solid #1d4a63;color:#cdeeff}
.note.warn{background:#2a2410;border-color:#5b4b16;color:#fde9a8}.note.bad{background:#2d1216;border-color:#6b2730;color:#fecaca}.note.good{background:#0f2b1d;border-color:#245c3c;color:#bbf7d0}

/* ---------- Live match ---------- */
.score-strip{display:flex;align-items:flex-end;gap:12px}
.score-strip .big{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.02em}
.score-strip .ov{font-size:var(--fs-s);color:var(--muted);font-weight:600}
.crease{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px}
.crease>div{background:var(--s2);border:1px solid var(--line2);border-radius:9px;padding:7px 8px;min-width:0}
.crease .on{border-color:var(--accent)}
.crease .k{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.crease .v{font-weight:800;font-size:var(--fs-s)}
.balls{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.balls::-webkit-scrollbar{display:none}
.ball{flex:none;min-width:26px;height:26px;padding:0 5px;border-radius:13px;display:grid;place-items:center;background:var(--s3);font-weight:800;font-size:10.5px}
.ball.w{background:#7f1d1d;color:#fff}.ball.b4{background:#14532d;color:#bbf7d0}.ball.b6{background:#5b4708;color:#fde68a}.ball.x{background:#273848;color:#cfe}
.comm{display:flex;flex-direction:column}
.cl{padding:7px 12px;border-top:1px solid var(--line2);font-size:var(--fs-s);line-height:1.4}
.cl:first-child{border-top:0}.cl .o{color:var(--dim);font-weight:800;margin-right:6px;font-size:var(--fs-xs)}
.cl.w{background:rgba(127,29,29,.22)}.cl.b{background:rgba(20,83,45,.18)}.cl.sys{color:var(--cyan);font-weight:600}.cl.s{background:rgba(244,197,66,.1);color:var(--accent);font-weight:800}
.livebar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:8px 10px calc(8px + var(--safe-b));background:rgba(7,17,26,.98);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.livebar .btn{padding:10px 4px}
@media (max-width:899px){body.live-mode .nav{display:none}}
.worm{width:100%;height:90px;display:block}

/* ---------- Launch ---------- */
#launch{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 70% -10%,rgba(244,197,66,.08),transparent),var(--bg)}
.launch{width:min(520px,100%)}
.launch .kick{letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:900;font-size:11px}
.launch h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;margin:10px 0;font-weight:950;letter-spacing:-.03em}.launch h1 span{color:var(--accent)}
.launch p{color:var(--muted);line-height:1.5;margin:0 0 18px}
.launch .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.launch .btn{padding:13px}
.launch .ver{margin-top:16px;font-size:var(--fs-xs);color:var(--dim);display:flex;gap:14px}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team-opt{border:1px solid var(--line);background:var(--s2);border-radius:10px;padding:10px;text-align:left;cursor:pointer}
.team-opt.on{border-color:var(--accent);background:var(--s3)}
.team-opt .n{font-weight:800;font-size:var(--fs-s)}.team-opt .g{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}

/* ---------- Skills / profile ---------- */
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.sk{font-size:var(--fs-xs)}.sk .flex{justify-content:space-between}.sk b{font-size:var(--fs-s)}
.ratings3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ratings3>div{background:var(--s2);border-radius:9px;padding:8px;text-align:center}.ratings3 .v{font-size:20px;font-weight:900}.ratings3 .l{font-size:10px;color:var(--muted);font-weight:700}
.steps{display:flex;gap:4px;margin-bottom:10px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--s3)}.steps i.on{background:var(--accent)}.steps i.done{background:#7a6420}
.help h4{margin:14px 0 4px;font-size:var(--fs);color:var(--accent)}.help p{margin:0 0 6px;color:#d4e2ec;line-height:1.5;font-size:var(--fs-s)}

/* ---------- Desktop / PC: side rail + multi-column ---------- */
@media (min-width:900px){
  :root{--fs:14px}
  .nav{top:0;bottom:0;right:auto;width:76px;height:auto;grid-template-columns:1fr;grid-auto-rows:64px;align-content:start;padding-top:calc(var(--top-h) + 8px);border-top:0;border-right:1px solid var(--line2)}
  .top{padding-left:88px}
  .main{padding:16px 20px 24px 96px}
  .toast{bottom:24px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}.g3r{grid-template-columns:1fr 2fr}
  .span2{grid-column:span 2}
  .sheet-bg{align-items:center}
  .sheet{border-radius:16px;max-height:86vh}
  .livebar{left:76px;grid-template-columns:repeat(6,minmax(0,140px));justify-content:center}
  .kpis{grid-template-columns:repeat(5,1fr)}
  .hide-d{display:none!important}
}
@media (max-width:899px){ .hide-m{display:none!important} }
@media (max-width:420px){ :root{--fs:13.5px} .kpi .v{font-size:15px} .crease{grid-template-columns:1fr 1fr}.crease .bowl{grid-column:span 2} .skills{grid-template-columns:repeat(2,1fr)} }

/* ---------- v0.5.1 calmer presentation ---------- */
.tag{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.info,.info-t{color:var(--cyan)}.tag.good{color:var(--good)}
.chip{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700}
.chip.FC,.chip.SHIELD,.chip.OD,.chip.ODC,.chip.T20,.chip.T20C{background:transparent}
.chip.FC,.chip.SHIELD{border-color:#5b4416;color:#fcd38d}.chip.OD,.chip.ODC{border-color:#174a6b;color:#93d5ff}.chip.T20,.chip.T20C{border-color:#5c1d55;color:#f9a8d4}
.chip.good{border-color:#1f5c3d;color:#86efac;background:transparent}.chip.bad{border-color:#6b2730;color:#fca5a5;background:transparent}.chip.warn{border-color:#5b4b16;color:#fcd34d;background:transparent}.chip.info{border-color:#174a6b;color:#93d5ff;background:transparent}
.pill{background:transparent;min-width:24px;height:auto;padding:0;font-size:13px;font-weight:800;color:var(--text)}
.pill.elite{background:transparent;color:#fcd34d}.pill.good{background:transparent;color:#86efac}.pill.lo{color:var(--dim)}
.tbl.clean td,.tbl.clean th{padding:7px 8px}
.tbl tr.tap{cursor:pointer}.tbl tr.tap:hover td{background:rgba(125,211,252,.04)}
.tbl td .ell{display:block}
.score-big{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.recent b{font-weight:800;margin-right:2px}
.comm .cl{border-top:1px solid var(--line2);padding:6px 12px;font-size:12.5px;color:#cfdde7}
.comm .cl.sys{color:var(--muted);font-weight:600;font-style:italic;background:transparent}
.comm .cl.w{color:#fecaca;background:transparent;font-weight:700}.comm .cl.b{background:transparent;color:#bbf7d0}
.comm .cl.s{color:var(--accent);background:transparent}
.livebar.three{grid-template-columns:1fr 1.6fr 1.4fr}
@media (min-width:900px){.livebar.three{grid-template-columns:repeat(3,minmax(0,220px))}}
.livebar select.skip{width:100%;height:100%;font-weight:700;font-size:var(--fs-s)}
.row{padding:9px 12px}
.ph h3{color:var(--muted)}
.panel .ph h3{letter-spacing:.07em}

/* ---------- v0.5.2 commentary, scorecard, wagon wheel ---------- */
.overs{margin:10px 12px 0;display:flex;flex-direction:column;gap:6px}
.overs>div{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.overs .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);font-weight:700;width:74px;flex:none}
.bs{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:6px;font-size:11px;font-weight:800;color:#cfdde7;background:#15293a}

.trade-offer-card:focus-visible{outline:2px solid var(--gold,#edc956);outline-offset:-2px}
.trade-offer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.trade-offer-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
.trade-offer-columns>div{min-width:0}
.trade-person{display:flex;justify-content:space-between;gap:6px;font-size:.9rem;padding-top:6px;overflow-wrap:anywhere}
.trade-person span{white-space:nowrap;font-weight:700;color:var(--gold,#edc956)}
.trade-review-section{padding:6px 0 12px}
.trade-review-section .kv{gap:10px;align-items:flex-start}
.trade-review-section .kv>span:first-child{min-width:0;overflow-wrap:anywhere}
.trade-review-section .kv>span:last-child{text-align:right;white-space:nowrap}
@media(max-width:390px){.trade-offer-columns{gap:8px}.trade-person{font-size:.83rem}}

/* Build 030: compact, noninteractive ball-condition status. */
.ball-condition{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 2px;border-top:1px solid var(--line,#263d4c);margin-top:9px;min-height:35px}
.ball-status{display:flex;align-items:center;gap:9px;font-size:12px}
.ball-visual{display:inline-block;width:19px;height:19px;flex:none;border-radius:50%;background:linear-gradient(135deg,#de604e 0%,#a33b32 55%,#58312c 100%);border:1px solid #ca7969;box-shadow:inset calc(var(--wear)*-0.012) 0 4px #392725;position:relative}
.ball-visual:after{content:'';position:absolute;left:9px;top:2px;height:14px;border-left:1px dashed #e0aa99;transform:rotate(20deg)}

/* Build 034: consistent dimensions for all country badges including England and West Indies. */
.nat-flag .legacy-flag,.team-flag .legacy-flag{object-fit:fill!important;border-radius:2px;}

/* Build 036: Stumps transition matches the broadcast Match Centre. */
.day-recap .pb{padding:14px 13px 15px}
.day-recap-heading{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:24px;font-weight:900;letter-spacing:-.025em;margin:5px 0 2px}
.day-recap-heading span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0;white-space:nowrap}
.day-recap-meta{font-size:11px;color:var(--muted);margin-bottom:11px}
.day-scoreboard{border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--s2)}
.day-scoreboard-label,.day-section-title{color:var(--dim);font-size:9px;letter-spacing:.09em;font-weight:850;padding:9px 11px 5px}
.day-innings-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 11px;border-top:1px solid var(--line2)}
.day-innings-team{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;font-weight:750}
.day-innings-team .nat-flag,.day-innings-team .badge{flex:none}
.day-innings-team>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-innings-team small{font-size:10px;color:var(--muted);font-weight:500}
.day-innings-fig{display:flex;align-items:baseline;gap:9px;flex:none}.day-innings-fig b{font-size:18px;letter-spacing:-.02em}.day-innings-fig small{font-size:10px;color:var(--muted)}
.day-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.day-stats>div{display:flex;align-items:center;flex-direction:column;gap:4px;padding:11px 3px;background:var(--s2);border:1px solid var(--line2);border-radius:9px}
.day-stats strong{font-size:21px;line-height:1.1}.day-stats span{font-size:10px;color:var(--muted);font-weight:650}
.day-sections{margin-top:10px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.day-section-title{padding:10px 10px 8px;background:var(--s2)}
.day-session-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line2);font-size:12px}
.day-session-row>span{color:var(--muted);flex:none}.day-session-row>b{font-size:12px;text-align:right;font-weight:750;min-width:0}
.day-player{align-items:flex-start}.day-player>span{white-space:nowrap}
.day-situation{margin-top:10px;padding:10px 11px;background:var(--s2);border-left:3px solid var(--cyan);border-radius:8px;font-size:12px;line-height:1.45}
.day-next{margin-top:11px;padding:11px;border:1px solid var(--line2);border-radius:10px;background:var(--s2)}
.day-next-heading{display:flex;align-items:center;gap:8px;font-size:13px}.day-step{font-size:9px;color:var(--accent);font-weight:850;letter-spacing:.1em}
.day-weather{display:flex;align-items:center;gap:10px;margin-top:8px}.day-weather svg{width:30px;height:30px;flex:none}.day-weather>div{display:flex;flex-direction:column;gap:3px}.day-weather strong{font-size:12px}.day-weather span{font-size:11px;color:var(--muted);line-height:1.35}
.day-coaching .plan-row{padding:10px 0 0;margin-top:10px!important;border-top:1px solid var(--line2)}
@media(max-width:390px){.day-recap-heading{font-size:22px}.day-recap-heading span{font-size:10px}.day-innings-team{font-size:11px}.day-innings-fig{gap:5px}.day-innings-fig b{font-size:16px}.day-stats strong{font-size:19px}}

/* Build 037: coherent live score hierarchy and interval transitions. */
.broadcast-panel .broadcast-head{margin-bottom:2px}
.broadcast-panel .broadcast-match{margin-bottom:6px}
.broadcast-panel .broadcast-lead{padding:5px 10px;margin:2px 0 3px;border-radius:8px;background:var(--s2)}
.broadcast-panel .broadcast-metrics.broadcast-metrics-inline{margin:1px 0 8px;padding:7px 0 9px;border-bottom:1px solid var(--line2)}
.broadcast-panel .broadcast-people{margin-top:4px}
.broadcast-panel .broadcast-recent{margin-top:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.broadcast-panel .broadcast-context{margin-top:4px;border-top:0;padding-top:7px}
.broadcast-panel .ball-condition{margin-top:2px}
.session-recap .day-sections{margin-top:11px}
.session-recap .day-session-row>b{white-space:normal}
.transition-recap .day-recap-heading{margin-bottom:11px}
@media(max-width:390px){.broadcast-panel .broadcast-metrics-inline .broadcast-metric{gap:4px}.session-recap .day-session-row{gap:6px}}

/* Build 038: keep the fixed live controls above mobile Safari's bottom browser chrome.
   The normal full-screen/PWA layout retains the original bottom anchoring. */
@media (max-width:899px) {
  html.ios-safari-browser body.live-mode .livebar {
    bottom: max(22px, var(--livebar-viewport-gap, 0px));
    padding-bottom: 8px;
  }
  body.live-mode .main {
    padding-bottom: calc(132px + var(--safe-b));
  }
  html.ios-safari-browser body.live-mode .main {
    padding-bottom: calc(155px + var(--safe-b));
  }
  .livebar.three {align-items:stretch;}
  .livebar.three .btn,.livebar.three .skip{min-height:45px;min-width:0;box-sizing:border-box;}
}

/* Build 040: compact innings overs and single clean section dividers. */
.broadcast-overs {font-size:.64em;font-weight:500;color:var(--muted);letter-spacing:0;vertical-align:baseline}
.broadcast-panel .broadcast-metrics.broadcast-metrics-inline {border-bottom:0;margin-bottom:4px;padding-bottom:5px}
.broadcast-panel .broadcast-people {border-top:1px solid var(--line2);margin-top:3px;padding-top:11px}
.broadcast-panel .broadcast-recent {border-bottom:0;margin-top:8px;padding-bottom:9px}
.broadcast-panel .ball-condition {border-top:1px solid var(--line2);margin-top:0;padding-top:11px}
.day-scoreboard + .day-situation {margin:8px 0 11px}

.next-card{padding:12px 14px}.next-card .hero{padding:2px 0 8px}
.next-acts{display:grid;grid-template-columns:1fr auto;gap:8px}.next-acts .btn{min-height:44px}
.next-form{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.status-strip{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.status-strip button{background:transparent;border:0;border-right:1px solid var(--line2);padding:8px 2px;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.status-strip button:last-child{border-right:0}.status-strip b{font-size:15px}.status-strip span{font-size:10.5px;color:var(--muted);white-space:nowrap}

.pitch-wx{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-left:auto}.pitch-wx svg{width:16px;height:16px}
.md-teams{padding:0}.md-teams>summary{padding:12px 14px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);list-style:none}.md-teams>summary::-webkit-details-marker{display:none}.md-teams>summary::after{content:' ▾'}.md-teams[open]>summary::after{content:' ▴'}

.recap-more>summary{cursor:pointer}.recap-more>summary::after{content:' ▸';color:var(--muted)}.recap-more[open]>summary::after{content:' ▾'}
/* Desktop: quick buttons sit in a full-width bar aligned with the page content. */
@media (min-width:900px){.quick{max-width:none;margin:0;display:flex;justify-content:flex-end;padding:8px max(20px,calc((100vw - 1180px)/2 + 20px)) 10px 96px}.quick button{flex:0 0 150px}.quick.four{grid-template-columns:none}}

// §2 RNG + UTILITIES ------------------------------------------------------
let rngState = 1;
function seedRng(s) { rngState = (s >>> 0) || 1; }
function rand() {
  rngState = (rngState + 0x6D2B79F5) >>> 0;
  let t = rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(a, b) { return Math.floor(rand() * (b - a + 1)) + a; }
function randn() { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weightedPick(items, wfn) {
  let tot = 0; for (const it of items) tot += Math.max(0, wfn(it));
  let r = rand() * tot;
  for (const it of items) { r -= Math.max(0, wfn(it)); if (r <= 0) return it; }
  return items[items.length - 1];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mean(arr) { return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0; }
function money(n) { return (n < 0 ? '-' : '') + '$' + (Math.abs(n) >= 1e6 ? (Math.abs(n) / 1e6).toFixed(2) + 'M' : Math.round(Math.abs(n) / 1000) + 'k'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function ordinal(n) { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function oversStr(balls) { return Math.floor(balls / 6) + (balls % 6 ? '.' + (balls % 6) : ''); }
function dateOf(day, year) {
  const y = year != null ? year : game.year;
  return new Date(Date.UTC(y, 9, 1 + day));
}
function dateStr(day, opts, year) {
  const d = dateOf(day, year);
  return d.toLocaleDateString('en-AU', Object.assign({ weekday:'short', day:'numeric', month:'short', timeZone:'UTC' }, opts || {}));
}

// §3 RATINGS (derived from skills, never stored) ---------------------------
const P = id => game.players[id];
function pname(p) { return p ? p.first + ' ' + p.last : 'Unknown'; }
function pshort(p) { return p ? p.first[0] + ' ' + p.last : '?'; }
function group(p) { return ROLES[p.role].group; }
function canBowl(p) { return p.bowlType !== 'NONE'; }
function isPace(p) { return BOWL_TYPES[p.bowlType].kind === 'pace'; }
function isSpin(p) { return BOWL_TYPES[p.bowlType].kind === 'spin'; }
function formMod(p) { return (p.form - 50) / 8; }

// Format aptitude (p.apt) is a per-format offset that makes genuine specialists:
// a white-ball gun can sit 10-18 points higher in T20 than in the Shield, and vice versa.
function aptOf(p, fmt) { return p.apt ? p.apt[fmt] || 0 : 0; }
function batRating(p, fmt) {
  const s = p.sk, rot = s.rot != null ? s.rot : (s.tech + s.power) / 2;
  let r;
  if (fmt === 'FC') r = s.tech * 0.50 + s.temp * 0.35 + s.power * 0.15;
  else if (fmt === 'OD') r = s.tech * 0.38 + s.temp * 0.22 + s.power * 0.28 + rot * 0.12;
  else r = s.tech * 0.24 + s.temp * 0.12 + s.power * 0.50 + rot * 0.14;
  return r + aptOf(p, fmt);
}
function bowlRating(p, fmt) {
  const s = p.sk, death = s.death != null ? s.death : (s.acc + s.vari) / 2;
  if (!canBowl(p)) return Math.min(25, s.bowl);
  let r;
  if (fmt === 'FC') r = s.bowl * 0.55 + s.acc * 0.32 + s.vari * 0.13;
  else if (fmt === 'OD') r = s.bowl * 0.42 + s.acc * 0.33 + s.vari * 0.15 + death * 0.10;
  else r = s.bowl * 0.32 + s.acc * 0.28 + s.vari * 0.22 + death * 0.18;
  return r + aptOf(p, fmt);
}
function keeperScore(p, fmt) { return p.sk.keep < 45 ? -100 : p.sk.keep * 0.65 + batRating(p, fmt) * 0.35; }
function overall(p, fmt) {
  const b = batRating(p, fmt), w = canBowl(p) ? bowlRating(p, fmt) : 0, f = p.sk.field, k = p.sk.keep;
  const g = group(p);
  let o;
  if (g === 'BAT') o = b * 0.9 + f * 0.1;
  else if (g === 'WK') o = b * 0.6 + k * 0.33 + f * 0.07;
  else if (g === 'AR') o = Math.max(b, w) * 0.62 + Math.min(b, w) * 0.3 + f * 0.08;
  else o = w * 0.9 + f * 0.06 + b * 0.04;
  return clamp(Math.round(o), 1, 99);
}
function peakOvr(p) { return Math.max(overall(p, 'FC'), overall(p, 'OD'), overall(p, 'T20')); }
function potGrade(p) {
  let v = p.pot;
  if (typeof game !== 'undefined' && game && p.teamId !== U() && game.staff) v = Math.round(v + (hash01(p.id) - 0.5) * 2 * (100 - staffRating(U(), 'scout')) / 6);
  return v >= 94 ? 'A+' : v >= 90 ? 'A' : v >= 86 ? 'B+' : v >= 81 ? 'B' : v >= 76 ? 'C+' : v >= 71 ? 'C' : 'D';
}
function ratingClass(v) { return v >= 86 ? 'elite' : v >= 78 ? 'good' : ''; }
// Format the player is best in, and whether the gap makes him a specialist.
function specialistOf(p) {
  const r = FMT_LIST.map(f => [f, overall(p, f)]).sort((a, b) => b[1] - a[1]);
  const gap = r[0][1] - r[2][1];
  return { best: r[0][0], gap, label: gap >= 8 ? (r[0][0] === 'FC' ? 'Red-ball specialist' : r[0][0] === 'T20' ? 'T20 specialist' : 'One-day specialist') : null };
}
function styleOf(p) { return p.style && STYLES[p.style] ? STYLES[p.style] : null; }
function styleLabel(p) { const st = styleOf(p); return st ? st.label : ''; }

// §4 PLAYER GENERATION + VALUE --------------------------------------------
function genName(nat, teamId) {
  // Future-player names draw from a compatible national/community profile. The
  // seed and existing save names remain intact; this only affects NEW names.
  const profiles = COUNTRY_NAME_PROFILES[nat];
  const fallback = NAMES[nat] || NAMES.AUS;
  if (!game._names) {
    game._names = {};
    Object.values(game.players || {}).forEach(p => { if (p.first && p.last) game._names[p.first + ' ' + p.last] = 1; });
  }
  for (let tries = 0; tries < 300; tries++) {
    const profile = profiles ? weightedPick(profiles, x => x.weight) : fallback;
    const first = pick(profile.first), last = pick(profile.last);
    const full = first + ' ' + last;
    const sameSurname = teamId && Object.values(game.players || {}).some(p => p.teamId === teamId && p.last === last);
    if (!game._names[full] && (!sameSurname || tries > 100)) {
      game._names[full] = 1;
      return [first, last];
    }
  }
  // Keep generating unique names even when a long-running career exhausts
  // its usual combinations; never duplicate a retired player's known name.
  for (let i = 2; ; i++) {
    const first = pick(fallback.first), last = pick(fallback.last) + ' ' + i;
    const full = first + ' ' + last;
    if (!game._names[full]) { game._names[full] = 1; return [first, last]; }
  }
}

function pickStyle(role, bowlType) {
  const kind = BOWL_TYPES[bowlType] ? BOWL_TYPES[bowlType].kind : 'none';
  const opts = Object.keys(STYLES).filter(k => STYLES[k].roles.includes(role) && (!STYLES[k].kind || role !== 'BWAR' || STYLES[k].kind === kind));
  return opts.length ? pick(opts) : null;
}
// Per-format aptitude. Most players are all-format; roughly one in three leans clearly one way.
function genApt(style) {
  const sp = (STYLES[style] && STYLES[style].spec) || {};
  const pr = { white: (sp.white != null ? sp.white : 0.12) * 0.7, red: (sp.red != null ? sp.red : 0.1) * 0.7, one: (sp.one != null ? sp.one : 0.05) * 0.7 };
  const r = rand();
  if (r < pr.white) return { T20: randInt(5, 9), OD: randInt(1, 4), FC: -randInt(4, 7) };
  if (r < pr.white + pr.red) return { FC: randInt(4, 7), OD: randInt(-2, 1), T20: -randInt(5, 9) };
  if (r < pr.white + pr.red + pr.one) return { OD: randInt(4, 7), FC: -randInt(0, 3), T20: -randInt(0, 3) };
  return { FC: Math.round(randn() * 1.2), OD: Math.round(randn() * 1), T20: Math.round(randn() * 1.2) };
}
function applyStyle(p) {
  const st = STYLES[p.style];
  if (!st) return;
  Object.keys(st.sk).forEach(k => { p.sk[k] = clamp(Math.round(p.sk[k] + st.sk[k]), 15, 99); });
}

function genSkills(role, q) {
  const v = (base, sd = 4) => clamp(Math.round(base + randn() * sd), 15, 99);
  const low = () => v(26, 7);
  const tail = () => ({ tech: v(q - 30, 6), temp: v(q - 28, 6), power: v(q - 30, 7) });
  let s;
  switch (role) {
    case 'OPEN': s = { tech:v(q+4), temp:v(q+3), power:v(q-6), bowl:low(), acc:low(), vari:low(), field:v(q-4,6), keep:v(15,4) }; break;
    case 'TOP':  s = { tech:v(q+3), temp:v(q+1), power:v(q-1), bowl:low(), acc:low(), vari:low(), field:v(q-2,6), keep:v(15,4) }; break;
    case 'MID':  s = { tech:v(q),   temp:v(q),   power:v(q+5), bowl:low(), acc:low(), vari:low(), field:v(q,6),   keep:v(15,4) }; break;
    case 'WK':   s = { tech:v(q-4), temp:v(q-2), power:v(q-2), bowl:v(15,4), acc:v(15,4), vari:v(15,4), field:v(q,5), keep:v(q+6) }; break;
    case 'BAR':  s = { tech:v(q-1), temp:v(q-2), power:v(q+1), bowl:v(q-8), acc:v(q-7), vari:v(q-8), field:v(q,6), keep:v(15,4) }; break;
    case 'BWAR': s = { tech:v(q-11), temp:v(q-10), power:v(q-6), bowl:v(q), acc:v(q-1), vari:v(q-2), field:v(q-1,6), keep:v(15,4) }; break;
    case 'PACE': s = Object.assign(tail(), { bowl:v(q+3), acc:v(q-2), vari:v(q-3), field:v(q-6,7), keep:v(12,3) }); break;
    case 'SEAM': s = Object.assign(tail(), { bowl:v(q),   acc:v(q+4), vari:v(q-4), field:v(q-6,7), keep:v(12,3) }); break;
    default:     s = Object.assign(tail(), { bowl:v(q+1), acc:v(q+1), vari:v(q+3), field:v(q-5,7), keep:v(12,3) });

function genBowlType(role) {

    case 'OFF': return 'OB';
    case 'LEG': return 'LB';
    case 'SLA': return 'SLA';
    case 'BAR': return pick(['RM','OB','LB','SLA','RFM']);

}
function blankStats() { return { m:0, inn:0, no:0, r:0, b:0, hs:0, hsNo:false, f4:0, f6:0, c50:0, c100:0, bb:0, rc:0, w:0, bbw:0, bbr:0, w5:0, ct:0, st:0 }; }

function makePlayer(opts) {
  const role = opts.role === 'SPIN2' ? pick(['LEG','SLA']) : opts.role;
  const nat = opts.nat || 'AUS';
  const sk = genSkills(role, opts.q);
  const bowlType = genBowlType(role);

  if (bowlType !== 'NONE' && ['OPEN','TOP','MID'].includes(role)) { const v = (b, sd) => clamp(Math.round(b + randn() * sd), 15, 99); sk.bowl = v(opts.q - 27, 6); sk.acc = v(opts.q - 25, 6); sk.vari = v(opts.q - 28, 6); }
  if (bowlType === 'NONE') { sk.bowl = Math.min(sk.bowl, 25); sk.acc = Math.min(sk.acc, 30); sk.vari = Math.min(sk.vari, 30); sk.death = Math.min(sk.death, 30); }
  const nm = genName(nat, opts.teamId);
  const p = {
    id: 'p' + (game.nextPid++), first: nm[0], last: nm[1], age: opts.age, nat, teamId: opts.teamId || null,
    role, hand: rand() < 0.27 ? 'L' : 'R', bowlType, sk, pot: 0,
    form: randInt(42, 62), fitness: randInt(93, 100), injury: null, natDuty: null,
    caps: { FC:0, OD:0, T20:0 }, contract: null, stats: { season: blankStats3(), career: blankStats3() },
    hist: [], retired: false, prospect: !!opts.prospect, morale: 70
  };
  p.style = opts.style || pickStyle(role, bowlType);
  applyStyle(p);
  p.apt = genApt(p.style);
  const cur = peakOvr(p);
  const a = p.age;
  p.pot = opts.pot != null ? opts.pot : clamp(Math.round(cur + (a <= 20 ? randInt(6, 16) : a <= 23 ? randInt(3, 10) : a <= 26 ? randInt(0, 5) : randInt(0, 2))), cur, 97);
  if (p.teamId) p.contract = { salary: askingSalary(p), years: randInt(1, 3) };

}

// Value: 0..~1.4. Drives salary demands, trades and AI signings.
// Market rating: the average of a player's best two formats, so a one-format specialist
// is paid for what he gives across a season, not just his best format.
function marketOvr(p) { const r = FMT_LIST.map(f => overall(p, f)).sort((a, b) => b - a); return (r[0] + r[1]) / 2; }
function playerValueScore(p) {
  const o = marketOvr(p);
  let v = Math.pow(clamp((o - 50 - RATING_SHIFT) / 35, 0, 1.3), 2);
  if (p.age <= 23) v *= 1 + clamp(p.pot - o, 0, 25) / 50;
  else if (p.age >= 34) v *= 0.6;
  else if (p.age >= 32) v *= 0.78;
  else if (p.age >= 30) v *= 0.9;
  return v;
}
function askingSalary(p) {
  const v = playerValueScore(p);
  const os = p.nat !== 'AUS' ? 1.1 : 1;
  return clamp(Math.round((MIN_SALARY + v * 250000 * os) / 5000) * 5000, MIN_SALARY, 420000);
}
function tradeValue(p) {
  let v = playerValueScore(p) * 100;
  if (p.contract) v -= (p.contract.salary - askingSalary(p)) / 15000;
  if (p.injury) v *= 0.75;
  if (p.wantsOut) v *= 0.85;
  return Math.max(0.5, v);
}

// Plausible pre-career numbers so veterans have a history.
function seedCareer(p) {
  const yrs = Math.max(0, p.age - 20 - randInt(0, 2));
  if (!yrs) return;
  const frac = clamp((peakOvr(p) - 50 - RATING_SHIFT) / 35, 0.1, 1);
  const g = group(p);
  const tailEnder = g === 'PACE' || g === 'SPIN';
  FMT_LIST.forEach(f => {
    const perYr = f === 'FC' ? 6 : f === 'OD' ? 5 : 8;
    const m = Math.round(yrs * perYr * (0.3 + 0.7 * frac) * (0.7 + rand() * 0.5));
    if (!m) return;
    const s = p.stats.career[f];
    s.m = m;
    s.inn = Math.round(m * (f === 'FC' ? 1.7 : 0.9) * (tailEnder ? 0.7 : 0.97));
    s.no = Math.round(s.inn * (tailEnder ? 0.28 : 0.1));
    const br = batRating(p, f) - RATING_SHIFT;
    const avgB = Math.max(4, f === 'FC' ? (br - 36) * 1.0 : f === 'OD' ? (br - 37) * 0.9 : (br - 40) * 0.65);
    s.r = Math.round((s.inn - s.no) * avgB);
    const pw = p.sk.power - RATING_SHIFT;
    const sr = f === 'FC' ? 44 + (pw - 50) * 0.35 : f === 'OD' ? 72 + (pw - 50) * 0.6 : 112 + (pw - 50) * 1.1;
    s.b = Math.round(s.r / Math.max(20, sr) * 100);
    s.f4 = Math.round(s.r * 0.11); s.f6 = Math.round(s.r * (f === 'T20' ? 0.045 : f === 'OD' ? 0.02 : 0.008));
    s.c100 = avgB >= 25 ? Math.round(s.r / (f === 'FC' ? 950 : f === 'OD' ? 1400 : 4200)) : 0;
    s.c50 = Math.round(s.r / (f === 'FC' ? 380 : f === 'OD' ? 420 : 380) * clamp(avgB / 35, 0.1, 1.2));
    s.hs = s.c100 ? 100 + randInt(0, f === 'FC' ? 110 : 50) : s.c50 ? 50 + randInt(0, 45) : Math.min(49, Math.round(avgB * 1.8 + randInt(0, 12)));
    if (canBowl(p) && bowlRating(p, f) - RATING_SHIFT > 45) {
      const wr = bowlRating(p, f) - RATING_SHIFT;
      const wpm = (f === 'FC' ? 2.8 : 1.3) * clamp((wr - 42) / 38, 0.05, 1.3);
      s.w = Math.round(m * wpm);
      const bAvg = f === 'FC' ? 24 + (85 - wr) * 0.45 : f === 'OD' ? 26 + (85 - wr) * 0.5 : 21 + (85 - wr) * 0.35;
      s.rc = Math.round(s.w * bAvg);
      const econ = f === 'FC' ? 3 + (80 - wr) * 0.02 : f === 'OD' ? 5 + (80 - wr) * 0.03 : 7.7 + (80 - wr) * 0.04;
      s.bb = Math.round(s.rc / econ * 6);
      s.w5 = f === 'FC' ? Math.round(s.w / 22) : f === 'OD' ? Math.round(s.w / 60) : 0;
      s.bbw = s.w ? clamp(Math.round(s.w / m * 2.2) + randInt(1, 3), 1, f === 'T20' ? 5 : 8) : 0;
      s.bbr = s.bbw ? randInt(f === 'T20' ? 12 : 18, f === 'FC' ? 80 : 45) : 0;
    }
    s.ct = Math.round(m * (p.role === 'WK' ? 2.1 : 0.45));
    if (p.role === 'WK') s.st = Math.round(m * 0.12);
  });
}

function makeProspect() {
  const role = pick(['OPEN','TOP','MID','MID','WK','BAR','BWAR','PACE','PACE','SEAM','OFF','LEG','SLA']);
  const q = randInt(46, 60) + RATING_SHIFT;
  const age = randInt(17, 20);
  const p = makePlayer({ role, q, age, prospect: true });
  p.pot = clamp(peakOvr(p) + randInt(10, 28), 66, 96);

}

// §5 SEASON BUILDER ---------------------------------------------------------
function roundRobin(ids) {
  const t = ids.slice(), n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const pairs = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; pairs.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(pairs);
    t.splice(1, 0, t.pop());
  }
  return rounds;
}
function blankStanding() { return { P:0, W:0, L:0, D:0, T:0, NR:0, Pts:0, rf:0, bf:0, ra:0, ba:0, wl:0, wt:0 }; }

function buildSeason(year) {
  const ids = TEAM_DEFS.map(t => t.id);
  const fixtures = [];
  let n = 1;
  const add = (comp, round, day, home, away, stage) => fixtures.push({ id: year + '-' + (n++), comp, round, day, home, away, stage: stage || 'league', result: null });

  roundRobin(shuffle(ids)).forEach((pairs, i) => pairs.forEach(([h, a]) => add('ODC', i + 1, CAL.ODC[i], h, a)));
  add('ODC', 'Final', CAL.ODC_FINAL, null, null, 'final');

  const sh = roundRobin(shuffle(ids));
  [...sh, ...sh.map(r => r.map(([h, a]) => [a, h]))].forEach((pairs, i) => pairs.forEach(([h, a]) => add('SHIELD', i + 1, CAL.SHIELD[i], h, a)));
  add('SHIELD', 'Final', CAL.SHIELD_FINAL, null, null, 'final');

  const tt = roundRobin(shuffle(ids));
  [...tt, ...tt.map(r => r.map(([h, a]) => [a, h]))].forEach((pairs, i) => pairs.forEach(([h, a]) => add('T20C', i + 1, CAL.T20[i], h, a)));
  add('T20C', 'Semi-final 1', CAL.T20_SEMI, null, null, 'semi1');
  add('T20C', 'Semi-final 2', CAL.T20_SEMI, null, null, 'semi2');
  add('T20C', 'Final', CAL.T20_FINAL, null, null, 'final');

  fixtures.sort((a, b) => a.day - b.day);
  const standings = {};
  COMP_ORDER.forEach(c => { standings[c] = {}; ids.forEach(id => standings[c][id] = blankStanding()); });
  // Australia's series opponents come from the full members only; associates play the World Cup and world tours.
  const opps = shuffle(Object.keys(NATION_STRENGTH).filter(n => !['SCO','NED','NEP','USA','CAN','NAM','OMA','UAE'].includes(n)));
  const windows = CAL.WINDOWS.map((w, i) => Object.assign({}, w, { opp: opps[i], squad: [], result: null, fx: [] }));
  windows.forEach(w => {
    const venues = shuffle(ids);
    const plan = w.id === 'TEST' ? [[52,'TEST'],[62,'TEST'],[72,'TEST'],[82,'TEST'],[93,'TEST']] : [[121,'ODI'],[125,'ODI'],[129,'ODI'],[134,'T20I'],[137,'T20I'],[140,'T20I']];
    plan.forEach(([d, c], i) => { const id = year + '-i' + (n++); w.fx.push(id); fixtures.push({ id, comp: c, round: `${COMPS[c].short} ${plan.filter((x, j) => j <= i && x[1] === c).length}`, day: d, home: 'AUS', away: 'X_' + w.opp, venue: venues[i % venues.length], stage: 'intl', win: w.id, result: null }); });
  });
  const worldTours = addWorldFixtures(year, fixtures, windows, () => n++);
  // The championship final is resolved only after the two-season league finishes.
  if (year % 2 === 1) fixtures.push({ id:year+'-wtcf', comp:'TEST', round:'WTC Final', day:215,
    home:null, away:null, venue:'X_ENG', stage:'wtcfinal', result:null });
  addAssociateQualificationFixtures(year, fixtures);
  addGlobalTournamentFixtures(year, fixtures);
  fixtures.sort((a, b) => a.day - b.day);
  return { year, label: year + '–' + String(year + 1).slice(2), fixtures, standings, windows, worldTours, champions: {}, userWins: 0, userLosses: 0 };
}

function U() { return game.gm.teamId; }

function teamName(id) { const t = teamDef(id); return t ? t.name : (id || 'TBC'); }
function squadOf(teamId) {
  if (teamId === 'AUS') { const w = activeWindow(); if (w && w.squad && w.squad.length >= 11) return w.squad.map(P).filter(p => p && !p.retired); const pool = Object.values(game.players).filter(p => !p.retired && p.nat === 'AUS' && p.teamId && !p.teamId.startsWith('X_') && !p.injury); return pool.sort((a,b)=>peakOvr(b)-peakOvr(a)).slice(0,20); }

}
function isAvailable(p) { return !p.injury && !p.natDuty && !p.retired && !p.rest; }
function availablePlayers(teamId) { return teamId === 'AUS' ? squadOf('AUS').filter(p => !p.injury) : squadOf(teamId).filter(isAvailable); }

function fitAdj(p) { return (p.fitness < 82 ? -(82 - p.fitness) * 0.45 : 0) + formMod(p) * 0.6; }

// Picks a balanced XI: keeper, spinner, three quicks, five batters, best all-round 11th,
// then guarantees five genuine bowling options. Returns ordered ids.
const BOWL_OPTION = 50 + RATING_SHIFT;   // the bowling rating that counts as a genuine option in the XI
// shape (optional): { spin, pace } specialist counts, e.g. two spinners on a turning pitch.
function autoXI(teamId, fmt, poolIn, shape) {
  let pool = (poolIn || availablePlayers(teamId)).slice();
  const xi = [];
  const nat = teamNat(teamId);
  const osCount = () => xi.filter(p => p.nat !== nat).length;
  const ok = p => p.nat === nat || osCount() < OVERSEAS_MAX;
  const take = p => { if (p) { xi.push(p); pool = pool.filter(x => x !== p); } };
  const best = (filter, score) => pool.filter(p => ok(p) && filter(p)).sort((a, b) => score(b) - score(a))[0];
  const bowlS = p => bowlRating(p, fmt) + fitAdj(p) - (isPace(p) && p.fitness < 75 ? 8 : 0);
  const batS = p => batRating(p, fmt) + fitAdj(p);
  const allS = p => overall(p, fmt) + fitAdj(p);

  take(best(p => p.sk.keep >= 45, p => keeperScore(p, fmt) + fitAdj(p)) || best(() => true, p => p.sk.keep));
  const nSpin = shape ? shape.spin : 1, nPace = shape ? shape.pace : 3;
  for (let i = 0; i < nSpin; i++) take(best(p => isSpin(p) && group(p) !== 'BAT', bowlS));
  for (let i = 0; i < nPace; i++) take(best(p => isPace(p) && group(p) !== 'BAT', bowlS));
  // Two specialist openers first (a top-order batter covers if the squad is short), then three more batters.
  const openPair = [];
  for (let i = 0; i < 2; i++) { const o = best(p => ['OPEN','TOP'].includes(p.role), p => batS(p) + (p.role === 'OPEN' ? OPENER_PREF : 0)); if (o) openPair.push(o); take(o); }
  for (let i = 0; i < 3; i++) take(best(p => ['BAT','WK','AR'].includes(group(p)), batS));
  while (xi.length < 11 && pool.some(ok)) take(best(() => true, allS));

  // Guarantee five bowling options rated 50+.
  const opts = () => xi.filter(p => canBowl(p) && bowlRating(p, fmt) >= BOWL_OPTION).length;
  let guard = 0;
  while (opts() < 5 && guard++ < 4) {
    const sub = best(p => canBowl(p) && bowlRating(p, fmt) >= BOWL_OPTION, bowlS);
    const keeper = xi[0];
    const out = xi.filter(p => p !== keeper && !openPair.includes(p) && !(canBowl(p) && bowlRating(p, fmt) >= BOWL_OPTION)).sort((a, b) => batS(a) - batS(b))[0];
    if (!sub || !out) break;
    xi.splice(xi.indexOf(out), 1); pool.push(out); take(sub);
  }
  return finaliseXI(xi, fmt);
}

// Batting order follows role, not raw rating. Two openers go first, drawn from specialist openers
// and top-order batters (openers preferred by OPENER_PREF); failing that, the most technical batter left. The rest bat in role tiers
// (top order, middle order and keeper, all-rounders, bowlers); rating only orders players within a tier.
const OPENER_PREF = 6; // rating points a specialist opener is worth over a top-order batter for an opening slot
const ORDER_TIER = { OPEN: 0, TOP: 0, MID: 1, WK: 1, BAR: 2, BWAR: 3, PACE: 4, SEAM: 4, OFF: 4, LEG: 4, SLA: 4 };
function battingOrder(xi, fmt) {
  const byBat = (a, b) => batRating(b, fmt) - batRating(a, fmt);
  // Anchors suit the Shield, aggressors suit white-ball cricket.
  const styleOpen = p => p.style === 'anchor' ? (fmt === 'FC' ? 3 : -1) : p.style === 'aggressor' ? (fmt === 'FC' ? -1 : 3) : 0;
  const openScore = p => batRating(p, fmt) + (p.role === 'OPEN' ? OPENER_PREF : 0) + styleOpen(p);
  const openers = xi.filter(p => ['OPEN','TOP'].includes(p.role)).sort((a, b) => openScore(b) - openScore(a)).slice(0, 2);
  const fill = list => { list.forEach(p => { if (openers.length < 2 && !openers.includes(p)) openers.push(p); }); };
  if (openers.length < 2) fill(xi.filter(p => ['BAT','WK','AR'].includes(group(p))).sort((a, b) => b.sk.tech - a.sk.tech));
  if (openers.length < 2) fill(xi.slice().sort(byBat));
  // Within a tier, finishers and enforcers drop below the others in white-ball cricket.
  const tierOf = p => ORDER_TIER[p.role] + (fmt !== 'FC' && ['finisher','enforcer'].includes(p.style) ? 0.5 : 0);
  const rest = xi.filter(p => !openers.includes(p)).sort((a, b) => (tierOf(a) - tierOf(b)) || byBat(a, b));
  return [...openers, ...rest];
}
function finaliseXI(xi, fmt, keepOrder) {
  const ordered = keepOrder ? xi : battingOrder(xi, fmt);
  const keeper = xi.slice().sort((a, b) => b.sk.keep - a.sk.keep)[0];
  const capt = (xi.find(p => p.id === game.captain && p.teamId === U()) || xi.slice().sort((a, b) => (overall(b, fmt) + b.age * 0.6) - (overall(a, fmt) + a.age * 0.6))[0]);
  return { order: ordered.map(p => p.id), keeper: keeper ? keeper.id : null, captain: capt ? capt.id : null };
}

// User XI: keeps the user's order, swaps out anyone unavailable for the best like-for-like.
function userXI(fmt) {
  const saved = (game.userXI[fmt] || []).map(P).filter(p => p && p.teamId === U());
  const kept = saved.filter(isAvailable);
  const replaced = saved.filter(p => !isAvailable(p));
  const pool = availablePlayers(U()).filter(p => !kept.includes(p));
  const xi = kept.slice();
  const repl = [];
  replaced.forEach(r => {
    if (xi.length >= 11) return;
    const sub = pool.filter(p => !xi.includes(p) && (p.nat === 'AUS' || xi.filter(x => x.nat !== 'AUS').length < OVERSEAS_MAX))
      .sort((a, b) => (group(b) === group(r) ? 12 : 0) + overall(b, fmt) - ((group(a) === group(r) ? 12 : 0) + overall(a, fmt)))[0];
    if (sub) { xi.splice(saved.indexOf(r) <= xi.length ? saved.indexOf(r) : xi.length, 0, sub); repl.push([r, sub]); }
  });
  while (xi.length < 11) {
    const sub = pool.filter(p => !xi.includes(p)).sort((a, b) => overall(b, fmt) - overall(a, fmt))[0];
    if (!sub) break; xi.push(sub);
  }
  const res = finaliseXI(xi.slice(0, 11), fmt, true);
  res.replaced = repl;
  return res;
}
// Attack for the conditions in multi-day cricket: two spinners on a turning pitch, four quicks on
// a green top, otherwise three quicks and a spinner.
function attackShape(fx, fmt) {
  if (!fx || fmt !== 'FC') return null;
  const pre = previewConditions(fx), v = teamDef(fx.venue || fx.home), pt = PITCHES[pre.cond.pitch];
  const spin = v.spin * pt.spin, pace = v.pace * pt.pace;
  if (spin >= 1.07 && spin > pace) return { spin: 2, pace: 2 };
  if (pace >= 1.08 && pace > spin) return { spin: pace >= 1.1 ? 0 : 1, pace: pace >= 1.1 ? 4 : 3 };
  return null;
}
// Safety net for AI-managed domestic squads depleted by retirement, injuries or
// national call-ups. Permanent local development players preserve valid match
// references, with no borrowed players and no changes to existing contracts.
// Only runs when fewer than eleven eligible cricketers remain.
function ensureDomesticMatchDepth(teamId) {
  if (!TEAM_DEFS.some(t => t.id === teamId)) return 0;
  const available = availablePlayers(teamId);
  if (available.length >= 11) return 0;
  const roles = ['WK','PACE','OPEN','TOP','MID','LEG','BAR','PACE','TOP','BWAR','OFF'];
  const missing = 11 - available.length;
  for (let i=0;i<missing;i++) {
    const existing=availablePlayers(teamId);
    const keepers=existing.filter(p=>p.sk.keep>=45).length;
    const bowlers=existing.filter(p=>canBowl(p)&&bowlRating(p,'FC')>=BOWL_OPTION).length;
    const role=!keepers?'WK':bowlers<4?'PACE':roles[(existing.length+i)%roles.length];
    const p=makePlayer({role, q:randInt(48,58)+RATING_SHIFT, age:randInt(19,23), teamId, nat:'AUS'});
    p.depthCallup=true;
  }
  if (teamId===U() && typeof addNews==='function') addNews('Squad','Development players called up',`${missing} local player${missing===1?'':'s'} added to provide an available XI.`);
  return missing;
}
function selectXI(teamId, fmt, fx) {
  ensureDomesticMatchDepth(teamId);
  if (teamId && teamId.startsWith('X_')) {
    const nat=teamId.slice(2);
    ensureIntlSquad(nat);
    let eligible=availablePlayers(teamId).length;
    while (eligible<11) {
      const role=eligible===0?'WK':eligible%4===0?'PACE':eligible%4===1?'OPEN':eligible%4===2?'BAR':'TOP';
      const p=makePlayer({role,q:INTL_BASE+(NATION_STRENGTH[nat]-82)-9,age:randInt(19,24),nat,teamId});
      p.contract=null;p.depthCallup=true;eligible++;
    }
  }
  if (teamId === U() && !game.autoXI[fmt] && (game.userXI[fmt] || []).length) return userXI(fmt);
  const r = autoXI(teamId, fmt, null, attackShape(fx, fmt)); r.replaced = []; return r;
}

// A match object (M) is plain data so it can live in the save while in progress.
function tacticsFor(M, teamId) {
  if (M.brief && M.brief[teamId]) return M.brief[teamId];
  return (M.brief[teamId] = coachBrief(M, teamId));
}
function createMatch(fx) {
  const fmt = COMPS[fx.comp].fmt;

    xi: {}, keeper: {}, captain: {}, fieldAvg: {}, bowlRank: {}, innings: [], balls: 0, toss: null,
    done: false, result: null, potm: null, log: [], live: false, timeUp: false, inningsWin: null, notes: [] };
  [fx.home, fx.away].forEach(t => {
    const s = selectXI(t, fmt, fx);
    if (!s.order || s.order.length < 11) throw new Error('Insufficient available XI for '+teamName(t)+' in '+fx.id+' ('+(s.order||[]).length+' players)'); M.xi[t] = s.order; M.keeper[t] = s.keeper; M.captain[t] = s.captain;
    M.fieldAvg[t] = mean(s.order.map(id => P(id).sk.field));
    M.bowlRank[t] = s.order.slice().sort((a, b) => bowlRating(P(b), fmt) - bowlRating(P(a), fmt)).slice(0, 2);
    if (t === U() && s.replaced && s.replaced.length) M.notes.push(s.replaced.map(([o, n]) => `${pname(o)} unavailable, ${pname(n)} comes in`).join('; '));
  });
  M.override = {};
  [fx.home, fx.away].forEach(t => {
    const mo = game.matchOverride;
    // New matches always delegate the plan to the head coach; old saves still load.
  });
  rollConditions(M, fx);
  return M;
}
function doToss(M) { M.toss = { winner: rand() < 0.5 ? M.home : M.away, decision: null }; return M.toss.winner; }
function tossDecisionAI(M) {
  if (M.fmt === 'FC') return (condFactor(M, 'pace') >= 1.08 || (M.cond && M.cond.days[0].sky === 'overcast')) && rand() < 0.6 ? 'bowl' : 'bat';
  if (M.fmt === 'T20') return rand() < 0.6 ? 'bowl' : 'bat';
  return rand() < 0.5 ? 'bowl' : 'bat';
}
function setTossDecision(M, decision) {
  M.toss.decision = decision;
  const other = M.toss.winner === M.home ? M.away : M.home;
  const bat = decision === 'bat' ? M.toss.winner : other;
  startInnings(M, bat, bat === M.home ? M.away : M.home, {});
}
function startInnings(M, bat, bowl, opts) {

    card: M.xi[bat].map(id => ({ id, r:0, b:0, f4:0, f6:0, out:null, in:false })),
    striker: 0, non: 1, next: 2, bw: {}, fow: [], overNo: 0, overBalls: 0, overConceded: 0,
    curBowler: null, lastBowler: null, overBowlers: [], spell: {}, part: { r:0, b:0 }, recent: [], overRuns: [],
    target: opts.target || null, followOn: !!opts.followOn, declared: false, closed: false, allOut: false, startBall: M.balls };
  inn.card[0].in = true; inn.card[1].in = true;

  if (!p.contract || p.retired) { p.contractConcern = false; return; }
  const per = ensurePersona(p), gap = askingSalary(p) / Math.max(1, p.contract.salary);
  const threshold = { loyal:2.45, professional:2.30, easygoing:2.30, leader:2.05, ambitious:1.62, volatile:1.48 }[per];
  if (gap < threshold * 0.90 || p.contract.years > 2) { p.contractConcern = false; return; }
  // At most one consideration per ~season, not a weekly punishment. Shorter contracts
  // and volatile/ambitious personalities make a reasonable request more likely.
  if (p.contractReviewDay != null && game.day - p.contractReviewDay < 120) return;
  p.contractReviewDay = game.day;
  const chance = { loyal:0.025, professional:0.035, easygoing:0.04, leader:0.07, ambitious:0.16, volatile:0.22 }[per];
  if (rand() < chance * (p.contract.years <= 1 ? 1.5 : 1)) p.contractConcern = true;
}
function weeklyMorale() {
  const res = {};
  TEAM_DEFS.forEach(t => {
    const recent = game.season.fixtures.filter(f => f.result && (f.home === t.id || f.away === t.id) && f.day > game.day - 14 && f.day <= game.day);
    const w = recent.filter(f => f.result.winner === t.id).length, l = recent.filter(f => f.result.winner && f.result.winner !== t.id).length;
    const h = staffIn(t.id, 'head'); const mm = h ? (h.mm || 60) : 45;
    const cap = t.id === U() ? P(game.captain) : null;
    res[t.id] = { form: (w - l), mm, leader: !!(cap && ensurePersona(cap) === 'leader') };
  });
  Object.values(game.players).forEach(p => {
    if (p.retired || !p.teamId || !res[p.teamId]) return;
    const per = ensurePersona(p), r = res[p.teamId];
    let d = 0;
    if (expectedStarter(p) && !p.injury && !p.natDuty && (p.played == null ? 0.6 : p.played) < 0.4) d -= per === 'ambitious' ? 5 : per === 'easygoing' ? 1 : per === 'volatile' ? 4 : 3;
    d += clamp(r.form, -3, 3) * (per === 'ambitious' ? 0.8 : per === 'easygoing' ? 0.2 : 0.45);
    reviewContractExpectation(p);
    if (contractConcern(p)) d -= per === 'volatile' ? 1.5 : per === 'ambitious' ? 1 : 0.25;
    d += (r.mm - 60 - STAFF_SHIFT) / 20;
    if (r.leader) d += 1;
    if (p.promise && game.day > p.promise.until) { if ((p.played || 0) < 0.45) { d -= 15; p.letDown = game.day; addNews('Locker', `${pname(p)} feels let down`, 'He was promised more cricket and has not had it.'); } p.promise = null; }
    if (per === 'volatile') d *= 1.5; if (per === 'professional') d *= 0.7;
    d += (67 - p.morale) * 0.09;
    // The head coach looks after everyday mood: unsettled players (45-61) get a weekly lift from his man-management.
    if (p.morale >= 45 && p.morale < 62 && !p.wantsOut && !(p.letDown && game.day - p.letDown >= 0 && game.day - p.letDown < 42)) d += clamp((r.mm - 50) / 14, 0.3, 2.5);
    p.morale = clamp(Math.round(p.morale + d + randn() * 1.2), 5, 100);
    p.form = clamp(Math.round(p.form + (p.morale - 60) / 25), 15, 92);
    if (p.teamId === U()) {
      if (p.morale < (per === 'volatile' ? 27 : per === 'ambitious' ? 23 : 17) && !p.wantsOut && (per === 'volatile' || per === 'ambitious' || p.letDown || p.contractConcern || (p.played != null && p.played < 0.3))) { p.wantsOut = game.day; addNews('Locker', `${pname(p)} asks for a trade`, `${moodLabel(p.morale)}. He wants to leave ${teamDef(U()).nick}. Talk to him, give him games, or move him on.`); }
      if (p.wantsOut && p.morale >= 50) { p.transferListed = false; p.wantsOut = null; addNews('Locker', `${pname(p)} withdraws his trade request`, 'He is settled again.'); }
    } else if (p.morale >= 50) p.wantsOut = null;
  });
  // A sulking player unsettles the room.
  const sulk = squadOf(U()).filter(p => p.wantsOut && game.day - p.wantsOut > 28).length;
  if (sulk) squadOf(U()).forEach(p => { if (!p.wantsOut) p.morale = clamp(p.morale - Math.min(2, sulk * 0.5), 5, 100); });
}
// Issues only the GM can settle: trade requests, Unhappy or Wants out, broken promises and contract disputes.
function gmIssue(p) {
  if (p.wantsOut) return 'Asked for a trade';
  if (p.letDown && game.day - p.letDown >= 0 && game.day - p.letDown < 42 && p.morale < 62) return 'Promised games he did not get';
  if (contractConcern(p) && p.morale < 62) return 'Concerned about contract terms';
  if (p.morale < 45) return p.morale < 30 ? 'Seriously unsettled' : 'Unhappy';
  return null;
}
function teamMorale(teamId) { return Math.round(mean(squadOf(teamId).map(p => { ensurePersona(p); return p.morale; }))); }
// GM conversation. Once a month per player.
function talkToPlayer(id, kind) {
  const p = P(id); ensurePersona(p);
  if (p.lastTalk && game.day - p.lastTalk < 30 && game.phase === 'season') return { ok: false, text: `You spoke to ${p.last} recently. Give it a few weeks.` };
  p.lastTalk = game.day;
  const h = staffIn(U(), 'head'); const mm = h ? (h.mm || 60) : 45;
  let gain = 0, text = '';
  if (kind === 'reassure') {
    gain = Math.round(4 + (mm - 60) / 6 + randn() * 3 + (p.persona === 'easygoing' || p.persona === 'professional' ? 3 : 0) - (p.persona === 'ambitious' ? 3 : 0));
    text = gain > 4 ? `${p.last} appreciated the chat.` : gain > 0 ? `${p.last} listened, but wants actions not words.` : `${p.last} was not convinced.`;
  } else if (kind === 'promise') {
    gain = Math.round(10 + randn() * 3); p.promise = { until: game.day + 35 };
    text = `You promised ${p.last} more cricket over the next five weeks. Break it and he will not forget.`;
  } else if (kind === 'challenge') {
    const good = p.persona === 'professional' || p.persona === 'leader' || p.persona === 'ambitious';
    gain = good ? Math.round(3 + randn() * 2) : Math.round(-6 + randn() * 3);
    if (good) p.form = clamp(p.form + 6, 15, 92);
    text = good ? `${p.last} responded well to the challenge.` : `${p.last} took it badly.`;
  }
  p.morale = clamp(p.morale + gain, 5, 100);
  return { ok: true, text, gain };
}

// GM response to a formal transfer request. Persistent state uses the existing player ID.
function decideTransferRequest(id, decision) {
  const p = P(id);
  if (!p || p.teamId !== U() || !p.wantsOut) return {ok:false,text:'This request is no longer active.'};
  if (decision === 'list') {
    p.transferListed = true; p.transferDecisionDay = game.day;
    logTx(`${pname(p)} placed on the trade list at his request.`);
    return {ok:true,text:`${pname(p)} is available for trade. He remains contracted until a deal is agreed.`};
  }
  if (decision === 'reject') {
    p.transferListed = false; p.transferDecisionDay = game.day;
    p.morale = clamp(p.morale - 5,5,100);
    return {ok:true,text:`You rejected ${pname(p)}'s request. He remains under contract but is unhappy.`};
  }
  if (decision === 'withdraw') {
    p.transferListed = false; p.transferDecisionDay = game.day;
    return {ok:true,text:`${pname(p)} has been removed from the trade list.`};
  }
  return {ok:false,text:'Unknown decision.'};
}

function devSlots() { return 2 + Math.round(staffEff(U(), 'head') / 25) + (staffEff(U(), 'bat') + staffEff(U(), 'bowl') >= 150 ? 1 : 0); }
function devUsed() { return squadOf(U()).filter(p => p.focus && p.focus !== 'none').length; }
function setFocus(id, f) {

// Monthly in-season progress for players on programmes (and a little for young players generally).
function monthlyDevelopment() {
  const report = [];
  Object.values(game.players).forEach(p => {
    if (p.retired || !p.teamId || teamDef(p.teamId) && teamDef(p.teamId).intl) return;
    const head = p.pot - peakOvr(p);
    if (head <= 0 || p.age > 30) return;
    const ageF = p.age <= 21 ? 1 : p.age <= 24 ? 0.75 : p.age <= 27 ? 0.45 : 0.2;
    const f = DEV_FOCUS[p.focus || 'none'];
    const team = p.teamId;
    const coach = k => ['tech','temp','power','keep','rot'].includes(k) ? staffEff(team, 'bat') : ['bowl','acc','vari','death'].includes(k) ? staffEff(team, 'bowl') : staffEff(team, 'physio');
    const prof = ensurePersona(p) === 'professional' ? 1.2 : 1;
    const before = peakOvr(p);
    const keys = f.skills.length ? f.skills : [];
    keys.forEach(k => { const gain = ageF * prof * (0.4 + coach(k) / 100) * (0.6 + rand() * 0.8); p.sk[k] = clamp(p.sk[k] + gain, 15, 99); });
    if (!keys.length && rand() < ageF * 0.5) { const ks = group(p) === 'PACE' || group(p) === 'SPIN' ? ['bowl','acc','vari'] : ['tech','temp','power']; const k = pick(ks); p.sk[k] = clamp(p.sk[k] + ageF * 0.6, 15, 99); }
    const d = peakOvr(p) - before;
    if (p.teamId === U() && d >= 1) report.push(`${pname(p)} +${d}`);
  });
  Object.values(game.players).forEach(p => { Object.keys(p.sk).forEach(k => p.sk[k] = Math.round(p.sk[k] * 10) / 10); });
  if (report.length) addNews('Training', 'Monthly training report', `Improved this month: ${report.join(', ')}.`);
}

function isWorldCupYear(year) { return year % 2 === 1; }
// FTP-style rotating international tours. Dates are simulation windows, NOT an imported
// official fixture-by-fixture ICC FTP. All twelve Full Members participate, including
// Australia through its separately managed windows. Pairings rotate by season and block.
// IDs and the existing match engine remain unchanged for save compatibility.
function worldTourPairs(year, block) {
  const ids = Object.keys(NATION_STRENGTH).slice().sort();
  // Eleven opposition countries: a round-robin rotation with one bye per block.
  // Using a twelfth dummy keeps pairing deterministic and avoids global RNG changes.
  ids.push('BYE');
  const turns = ((year - 2026) * 3 + block) % 11;
  for (let i = 0; i < turns; i++) ids.splice(1, 0, ids.pop());
  const result = [];
  for (let j = 0; j < 6; j++) {
    const a = ids[j], b = ids[11-j];
    if (a !== 'BYE' && b !== 'BYE') result.push((year + block + j) % 2 ? [a,b] : [b,a]);
  }
  return result;
}
function addWorldFixtures(year, fixtures, windows, nextId) {
  const seasonTours = [];
  // Three distinct tour windows, with a natural short gap between multi-format series.
  // Each country faces rotating opponents instead of only one annual pairing.
  const starts = [7, 77, 147];
  starts.forEach((base, block) => worldTourPairs(year, block).forEach(([home, away], idx) => {
    const tourId = `${year}-tour-${block}-${idx}`;
    const formats = block === 1 ? [['ODI',3],['T20I',3]] : [['TEST',2],['ODI',3],['T20I',3]];
    let offset = 0;
    const schedule = [];
    formats.forEach(([comp, count]) => {
      for (let m = 0; m < count; m++) {
        const day = base + idx * 2 + offset + m * (comp === 'TEST' ? 7 : 2);
        const f = {id:year+'-w'+nextId(), comp, round:`${COMPS[comp].short} ${m+1}`, day,
          home:'X_'+home, away:'X_'+away, venue:'X_'+home, stage:'world', tourId,
          seriesId:tourId+'-'+comp, result:null};
        fixtures.push(f); schedule.push(f.id);
      }
      offset += count * (comp === 'TEST' ? 7 : 2) + 3;
    });
    seasonTours.push({id:tourId,home:'X_'+home,away:'X_'+away,start:base+idx*2,
      end:base+idx*2+offset,formats:formats.map(x=>x[0]),fixtures:schedule});
  }));
  if (isWorldCupYear(year)) {
    const wb = windows.find(w => w.id === 'WB');
    if (wb) {
      wb.id = 'WC'; wb.label = 'T20 World Cup'; wb.fmt = 'T20'; wb.wc = true; wb.opp = 'IND';
      for (let i=fixtures.length-1;i>=0;i--) if (fixtures[i].win === 'WB') fixtures.splice(i,1);

}

// ---- World Test Championship (two-year cycles) ------------------------------
// Nine participants; Afghanistan, Ireland and Zimbabwe retain bilateral Tests
// without entering the WTC. These are simulated championship fixtures rather
// than an assertion of the official ICC Future Tours Programme.
const WTC_TEAMS = ['AUS','ENG','IND','NZ','PAK','SA','SL','WI','BAN'];
function wtcCycle(year) { return year - year % 2; }
function blankWtc(year) {
  const teams={}; WTC_TEAMS.forEach(n=>teams[n]={p:0,w:0,l:0,d:0,t:0,nr:0,pts:0,max:0,series:0});
  return {start:wtcCycle(year),teams,seen:[],final:null};
}
function ensureWtc() {
  if (!game.wtc) game.wtc=blankWtc(game.year);
  if (!game.wtcHistory) game.wtcHistory=[];
  return game.wtc;
}
function wtcRows() {
  const w=ensureWtc();
  return WTC_TEAMS.map(n=>({nat:n,...w.teams[n],pct:w.teams[n].max ? 100*w.teams[n].pts/w.teams[n].max:0}))
    .sort((a,b)=>b.pct-a.pct || b.pts-a.pts || b.w-a.w || a.nat.localeCompare(b.nat));
}
function trackWtcResult(fx) {
  if (fx.comp!=='TEST'||fx.stage==='wtcfinal'||!fx.result) return;
  const a=teamNat(fx.home),b=teamNat(fx.away);
  if (!WTC_TEAMS.includes(a)||!WTC_TEAMS.includes(b)) return;
  const w=ensureWtc();
  if (w.start!==wtcCycle(game.year)||w.seen.includes(fx.id)) return;
  w.seen.push(fx.id);
  const A=w.teams[a], B=w.teams[b];
  A.p++; B.p++;
  if (fx.result.noResult) { A.nr++; B.nr++; return; }
  A.max+=12; B.max+=12;
  if (fx.result.winner===fx.home) { A.w++; B.l++; A.pts+=12; }
  else if (fx.result.winner===fx.away) { B.w++; A.l++; B.pts+=12; }
  else if (fx.result.tie) { A.t++;B.t++;A.pts+=6;B.pts+=6; }
  else { A.d++;B.d++;A.pts+=4;B.pts+=4; }
}
function prepareWtcFinal() {
  if (game.year%2!==1) return;
  const fx=game.season.fixtures.find(f=>f.stage==='wtcfinal');
  if (!fx||fx.result||fx.home) return;
  const qualified=wtcRows().filter(r=>r.p>0);
  if (qualified.length<2) { fx.result={winner:null,noResult:true,text:'WTC final not contested'};return; }
  fx.home=qualified[0].nat==='AUS'?'AUS':'X_'+qualified[0].nat;
  fx.away=qualified[1].nat==='AUS'?'AUS':'X_'+qualified[1].nat;
  addNews('World','World Test Championship final',`${NATIONS[qualified[0].nat]} v ${NATIONS[qualified[1].nat]} · ${dateStr(fx.day)}.`);
}

  const w=ensureWtc();

  w.final={home:fx.home,away:fx.away,winner,year:game.year};
  game.wtcHistory.unshift({start:w.start,end:game.year,home:fx.home,away:fx.away,winner,
    rows:wtcRows().map(r=>({nat:r.nat,p:r.p,pts:r.pts,max:r.max,pct:Math.round(r.pct*10)/10}))});
  game.wtcHistory=game.wtcHistory.slice(0,12);

}
function rolloverWtc(year) {

}

function worldSeriesStandings() {
  const groups = {};
  (game.season.fixtures || []).forEach(f => {
    if (!f.seriesId || !f.home || !f.away) return;
    const s = groups[f.seriesId] || (groups[f.seriesId]={id:f.seriesId,comp:f.comp,home:f.home,away:f.away,
      winsHome:0,winsAway:0,draws:0,played:0,total:0});
    s.total++;
    if (!f.result) return;
    s.played++;
    if (f.result.winner===f.home) s.winsHome++;
    else if (f.result.winner===f.away) s.winsAway++;
    else s.draws++;
  });
  return Object.values(groups).sort((a,b)=>a.id.localeCompare(b.id));
}
function archiveWorldSeries() {
  const complete = worldSeriesStandings().filter(s=>s.total===s.played);
  game.worldSeriesHistory = game.worldSeriesHistory || [];
  for (const s of complete) {
    if (game.worldSeriesHistory.some(x=>x.id===s.id)) continue;
    const winner = s.winsHome>s.winsAway ? s.home : s.winsAway>s.winsHome ? s.away : null;
    // Award is based on actual match contributions, never invented from results.
    // Match-award counts remain available for legacy fixtures without scorecards.
    const matchIds=(game.season.fixtures||[]).filter(f=>f.seriesId===s.id && f.result);
    const perf={};
    for (const f of matchIds) {
      const card=(game.scorecards||{})[f.id];
      if (card && card.innings) for (const inn of card.innings) {
        for (const bat of (inn.card||[])) if (bat.in) {
          const t=perf[bat.id]||(perf[bat.id]={runs:0,wickets:0,matchAwards:0}); t.runs+=bat.r||0;
        }
        for (const b of (inn.bw||[])) {
          const t=perf[b.id]||(perf[b.id]={runs:0,wickets:0,matchAwards:0}); t.wickets+=b.w||0;
        }
      }
      if (f.result.potm) {
        const t=perf[f.result.potm]||(perf[f.result.potm]={runs:0,wickets:0,matchAwards:0}); t.matchAwards++;
      }
    }
    const ranked=Object.entries(perf).filter(([id])=>!!P(id)).sort((a,b)=>
      ((b[1].runs + b[1].wickets*24 + b[1].matchAwards*35) - (a[1].runs + a[1].wickets*24 + a[1].matchAwards*35)));
    const best=ranked[0];
    const honours=best?{playerId:best[0],playerName:pname(P(best[0])),runs:best[1].runs,wickets:best[1].wickets,matchAwards:best[1].matchAwards,
      basis:matchIds.every(f=>(game.scorecards||{})[f.id])?'performance':'match awards'}:null;
    game.worldSeriesHistory.unshift({id:s.id,year:game.year,comp:s.comp,home:s.home,away:s.away,
      winner,winsHome:s.winsHome,winsAway:s.winsAway,draws:s.draws,honours});
  }
  if (game.worldSeriesHistory.length>120) game.worldSeriesHistory.length=120;
}

    const a=by(f.home),b=by(f.away);a.P++;b.P++;
    if(f.result.winner && by(f.result.winner)){const win=by(f.result.winner);win.W++;win.Pts+=2;(win===a?b:a).L++;}

// Schedule five-team groups in five true round-robin rounds. Every team has a bye,
// and never appears twice on one date. The four groups can play concurrently.

function wcRoundPairs(teams) {

    const matches=[];
    for(let j=0;j<3;j++) { const a=ring[j],b=ring[5-j]; if(a&&b) matches.push([a,b]); }
    rounds.push(matches);
    ring.splice(1,0,ring.pop());
  }

}
function wcGroupSlots(groups) {
  const out=[]; let n=0;
  for(let r=0;r<5;r++) for(const g of ['A','B','C','D']) {
    for(const [a,b] of wcRoundPairs(groups[g])[r])

// Existing careers: only future, unplayed fixtures are moved; completed records

function repairWorldCupSchedule(g) {
  if(!g || !g.season || !g.season.fixtures) return;
  const fx=g.season.fixtures.filter(f=>f.comp==='WC');
  if(!fx.length) return;
  const group=fx.filter(f=>f.stage==='wcgroup');
  if(group.length!==40)return; // legacy 8-team formats are intentionally unchanged
  const names=['A','B','C','D'];
  const groups=Object.fromEntries(names.map(k=>[k,[...new Set(group.filter(f=>f.group===k).flatMap(f=>[f.home,f.away]))]]));
  if(names.some(k=>groups[k].length!==5))return;
  const slots=wcGroupSlots(groups);
  const target = new Map(slots.map(sl=>[[sl.home,sl.away].sort().join('|'),sl]));
  const used={};
  for(const f of fx.filter(f=>f.result || f.day<g.day)) {
    for(const t of [f.home,f.away])if(t) (used[t] ||= new Set()).add(f.day);
  }
  // Never move a fixture that has begun or been completed.
  for(const f of group) {
    if(f.result || f.day<g.day)continue;
    const sl=target.get([f.home,f.away].sort().join('|'));if(!sl)continue;
    let d=Math.max(g.day,sl.day);
    while(([f.home,f.away].some(t=>used[t]?.has(d))) && d<180)d++;

    for(const t of [f.home,f.away])(used[t] ||= new Set()).add(d);
  }

  // its own date, 2 days apart, and leave rest before semis and final.
  const supers=fx.filter(f=>f.stage==='wcsuper');
  if(supers.length===12) {
    const roundByIndex=[0,1,2,2,1,0];
    for(let i=0;i<supers.length;i++)if(!supers[i].result && supers[i].day>=g.day) {
      supers[i].day=Math.max(g.day,136+2*roundByIndex[i%6]);
      supers[i].venue=WC_HOST_VENUES[(i+2)%6];
    }

  for(const f of fx.filter(f=>f.stage?.startsWith('wcsemi')))if(!f.result&&f.day>=g.day){f.day=Math.max(143,g.day);f.venue=WC_HOST_VENUES[f.stage==='wcsemi1'?1:4];}
  for(const f of fx.filter(f=>f.stage==='wcfinal'))if(!f.result&&f.day>=g.day){f.day=Math.max(146,g.day);f.venue='VIC';}
  g.season.fixtures.sort((a,b)=>a.day-b.day);

    day:sl.day,home:sl.home,away:sl.away,venue:sl.venue,stage:'wcgroup',group:sl.group,result:null,win:'WC'});

// Tournament stats: runs and wickets for every player across the World Cup.
function trackWorldCupStats(M) {

// The best XI for a format (ignoring injuries and national duty), each slot labelled by its job,

const SLOT_NAMES = { opener:'Opener', three:'No. 3', middle:'Middle order', keeper:'Keeper', allrounder:'All-rounder', quick:'Quick', spinner:'Spinner' };
function slotFor(p, idx, keeperId) {

  if (g === 'AR') return idx < 2 ? 'opener' : 'allrounder';

}

    case 'opener': return bat ? batRating(p, fmt) + (p.role === 'OPEN' ? OPENER_PREF : p.role === 'TOP' ? 3 : 0) : -1e9;
    case 'three': case 'middle': return bat ? batRating(p, fmt) : -1e9;

const AGENT_STYLES = { tough:{ label:'Hard-nosed', mult:1.12, patience:2 }, fair:{ label:'Straight shooter', mult:1.0, patience:3 }, friendly:{ label:'Easy to deal with', mult:0.96, patience:4 } };
